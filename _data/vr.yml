    a: "在修什麼"
    b: ""
  - key: ui.book
    when: "選項與視窗標題：人物簿"
    a: "人物簿"
    b: ""
  - key: zone.gate
    when: "地點：門埕（甲＝名稱，乙＝怎麼走）"
    a: "門埕"
    b: "中軸往南，大門裡頭"
  - key: zone.porch
