owner: 許原綸
avatar: /assets/img/avatar-2.jpg
owner_bio: |-
  許原綸，字經始，號龍江。笨港人，祖籍晉江龍湖亭，生於2002年。現就讀於臺灣普通大學碩士班，正與碩士論文纏綿中，進度尚待天意。

  研究興趣在近現代東亞的宗教、思想與文化史。碩士論文以民初中國的素食主義為題，試圖探究一種飲食選擇怎樣與宗教信仰、身體觀念與時代思潮彼此交織。同時也對東西交流史、東南亞史，以及華人文化的主體性抱持濃厚興趣。

  最大的嗜好是貓。心智年齡大約只有十歲。平日生活平淡，自己炊飯、食茶，到公園閒逛，偶爾買一塊起司蛋糕，便覺得日子很好。
email: khoguanlun@gmail.com
place: 北港、文山和北投
intro: |-
  學鳩齋是書齋主人的個人書房。齋名取自《莊子・逍遙遊》裡那隻被大鵬比下去的小鳥：飛不上九萬里，就在榆枋之間，一次次起飛。

  這裡收錄研究論文、讀書問學途中的瑣談，以及日常的生活札記；讀書摘錄與典故，另放在獺祭魚。
