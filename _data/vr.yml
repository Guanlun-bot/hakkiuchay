couplet:
  upper: 知味粗茶堪作伴
  lower: 了心陋室可安身
texts:
  - key: zl_enter
    title: 進入知了間的提示
    body: 院子入口。正前方是條案與丁雲鵬《玉川煎茶圖》；左邊門洞進和室，右邊門洞進茶室。
  - key: teapaint
    title: 玉川煎茶圖
    body: |-
      明・丁雲鵬《玉川煎茶圖》，壬子年（1612）冬作。
      盧仝（玉川子）在芭蕉、太湖石下烹茶，一僕提壺汲水，一婢捧盒。
  - key: couplet
    title: 對聯
    body: |-
      上聯　知味粗茶堪作伴
      下聯　了心陋室可安身

      兩句句首合為「知了」。
  - key: altar2
    title: 翹頭案
    body: 明間正中的翹頭案，案上一隻錫茶罐、一副蓋碗；牆上掛《玉川煎茶圖》與對聯。
  - key: chandelier2
    title: 水晶吊燈
    body: 跟學鳩齋一樣的兩層銅吊燈，S 形燈臂、燭台和水晶垂珠，從屋脊垂下。
  - key: plum2
    title: 老樁梅
    body: 條案右側高几上一盆老樁梅：樹樁劈裂中空，只抽出幾條細枝，開著淡粉的花，紅苞未放；橢圓宜興盆裡伴一塊小靈璧石。
  - key: pyra
    title: 火棘
    body: 條案左側高几上一盆火棘，斜幹，細枝拱垂，小葉深綠，一簇簇紅果。
  - key: taishi
    title: 太師椅
    body: 明間兩側各一對太師椅，中間一張茶几。點椅子可以坐下。
  - key: cicada
    title: Cicada on a Grapevine
    body: >-
      Bokurin Guan Japanese, late 14th–early 15th century


      At the end of summer, the leaves of a grapevine have withered, its fruits
      have ripened, and a solitary cicada clings to the vine. This scroll was
      originally paired with a painting now in the collection of the Kyoto
      temple Honpōji that features a grasshopper, vibrant leaves, and darker
      fruits of a plant at peak ripeness. Grapevines, with their abundant,
      long-lasting fruit, are traditionally associated with fecundity and
      perpetuity.


      Little is known about the artist Guan but it appears that he was a Zen
      monk of relatively minor status. In this lyrical composition, his
      graceful, controlled handling of the brush and sharp eye for details in
      nature suggest that he was well trained in the art of monochrome ink
      painting.
  - key: shoin
    title: 付書院
    body: 窗前的書院板：硯箱、筆、三冊線裝書，一只小銅香爐。
  - key: ikebana2
    title: 插花
    body: 窗戶另一邊，矮櫃上一隻白瓷長頸瓶，依真、副、控三枝插山茶：高枝紅花，斜出一枝白花，低處一朵紅。
  - key: screen
    title: 山水図屏風
    body: |-
      海北友松，安土桃山時代・慶長7年(1602)

      浅井長政の重臣海北綱親の子である友松は、独力で自らの画境を切り開いた。武人らしく気迫のこもった鋭い表現で水墨画を描いている。本屏風にみられるダイナミックな画面構成や球状、円筒状に表わす独特な形態感覚で対象を捉える表現が友松の特徴といえる。
  - key: banana
    title: 芭蕉
    body: 茶室後角一盆芭蕉，大葉子越過屏風的左端。隔壁明間的《玉川煎茶圖》裡，盧仝就坐在芭蕉下煎茶。
  - key: fountain
    title: 獅頭吐水
    body: 博古架旁的角落，牆上一面古銅獅頭，細水從口中吐進高陶甕，甕口一圈圈水紋。旁邊擱一支竹杓，取水煮茶。
  - key: teaware
    title: 茶櫃
    body: 一格一個樣子：大陶壺、鐵壺、木茶箱、紙包茶、幾隻錫罐、一疊杯子、幾本書，留些空處。
  - key: puer
    title: 普洱茶櫃
    body: 上層是竹箬包好、麻繩綁著的一提提七子餅；中層幾餅拆開的放在餅架上，露出棉紙；下層是茶磚、沱茶和一甕散茶。
  - key: viv
    title: 雨林缸
    body: 茶櫃裡的一格做成雨林缸：苔蘚、沉木、鳳梨科，兩隻綠色樹蛙，紅眼睛。
  - key: beauty
    title: Beauty Revealed
    body: >-
      Sarah Goodridge，1828 年，象牙上的水彩細密畫，裝在紅色皮盒裡。


      According to descendants of the statesman Daniel Webster (1782-1852), this
      miniature is a self-portrait Goodridge made for him.
  - key: teapendant
    title: 宋燈
    body: 茶室正中高掛一盞小宋燈，八角木框糊素絹，紅穗垂在下緣，把整間照得均勻。
  - key: modern
    title: 當代茶席
    body: 後牆前的長桌，一把側把壺放在陶質茶承上，幾只杯子。
  - key: altar
    title: 插花
    body: |-
      掛軸右下一瓶梅。

      中軸留空，從大門一路看得到掛軸。
  - key: otter
    title: 水獺圖
    body: |-
      三隻水獺在水中嬉游，絹本設色，裱成掛軸，掛在咖啡機上方。

      獺祭魚：水獺把捕到的魚排在岸邊，像在祭祀。
