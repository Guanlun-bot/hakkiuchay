/* ---------------- reader (markdown) ---------------- */
function inline(s){ let h=esc(s);
  h=h.replace(/\+\+(.+?)\+\+/g,'$1');
  h=h.replace(/\[註(\d+)\]/g,'<sup><a href="#n$1" id="r$1">[$1]</a></sup>');
  h=h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  h=h.replace(/(^|[\s(（])(https?:\/\/[^\s<）)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return h; }
function joinLines(lines){ let out=''; for(const l of lines){ if(!out){ out=l; continue; } const a=out.slice(-1), b=l[0]||''; const br=/ {2}$/.test(out); out=out.replace(/\s+$/,''); out+=br?'\n':(/[A-Za-z0-9,.;:)]/.test(a)&&/[A-Za-z0-9(]/.test(b)?' ':'')+l; } return out; }
function md(src,link){ const blocks=src.replace(/\r/g,'').split(/\n\s*\n/); let html='';
  for(let b of blocks){ b=b.replace(/^\n+|\n+$/g,''); if(!b.trim()) continue; const lines=b.split('\n');
    const img=b.trim().match(/^!\[([^\]]*)\]\(([^)]+)\)$/); if(img){ html+=`<a class="img" href="${esc(link)}" target="_blank" rel="noopener">〔圖〕${esc(img[1]||'')}　— 到網站看圖</a>`; continue; }
    if(/^#{1,4}\s/.test(b)){ const lv=Math.min(3,b.match(/^#+/)[0].length+1); html+=`<h${lv}>${inline(b.replace(/^#+\s*/,''))}</h${lv}>`; continue; }
    if(lines.every(l=>/^>/.test(l))){ html+=`<blockquote>${md(lines.map(l=>l.replace(/^>\s?/,'')).join('\n'),link)}</blockquote>`; continue; }
    if(lines.every(l=>/^\s*([-*]|\d+\.)\s/.test(l))){ const ol=/^\s*\d/.test(lines[0]); html+=`<${ol?'ol':'ul'}>${lines.map(l=>`<li>${inline(l.replace(/^\s*([-*]|\d+\.)\s+/,''))}</li>`).join('')}</${ol?'ol':'ul'}>`; continue; }
    html+=`<p>${inline(joinLines(lines)).replace(/\n/g,'<br>')}</p>`; }
  return html; }
function openReader(pi){ const p=POSTS[pi]; const link=postLink(p); $('#rlink').href=link;
  const notes=(p.notes||[]).map((n,k)=>`<li id="n${k+1}">${inline(String(n))} <a href="#r${k+1}">↩</a></li>`).join('');
  const refs=(p.refs||[]).filter(Boolean).map(r=>/^##/.test(r)?`<h3>${esc(r.replace(/^#+\s*/,''))}</h3>`:`<p style="margin:0 0 .6em;padding-left:2em;text-indent:-2em">${inline(String(r))}</p>`).join('');
  $('#rbody').innerHTML=`<h1>${esc(p.title)}</h1>${p.subtitle?`<div class="sub">${esc(p.subtitle)}</div>`:''}<div class="by">${esc([p.author,p.date].filter(Boolean).join('・'))}</div>${p.source?`<div class="src">${inline(String(p.source))}</div>`:''}<article>${md(p.body,link)}</article>${notes?`<ol class="notes">${notes}</ol>`:''}${refs?`<div class="notes"><h3 style="margin-top:0">參考文獻</h3>${refs}</div>`:''}`;
  $('#reader').classList.remove('hide'); $('#reader').scrollTop=0; closePanel(); ME.reading=pi; pushPresence(); }
function closeReader(){ $('#reader').classList.add('hide'); ME.reading=-1; pushPresence(); }

// On hakkiuchay.space there is no Claude room: share presence through a Supabase Realtime channel instead.
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function supabaseRoom(){ const C=window.VR_CONFIG; if(!C||!C.url||!C.key) return null;
  if(!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
  const sb=window.supabase.createClient(C.url,C.key,{auth:{persistSession:false,autoRefreshToken:false}});
  const me=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)), ch=sb.channel(C.channel||'hakkiuchay-vr',{config:{presence:{key:me},broadcast:{self:false,ack:false}}});
  // Two paths carry the same state: broadcast (fast, for walking) and presence (slower, but it also reaches anyone who joins later).
  // Whichever copy is newer wins, so the room works even if one path is blocked.
  const peers=new Map();   // key -> {p, t, heard, skews[], fast}
  let peersFn=null, cur=null, sentAt=0, sentKey='', timer=null, emitT=null, ready=false, tracked='', trackAt=0, trackT=null;
  const shift=(p,d)=>{ if(!p) return {}; const o={...p}; const at=v=>typeof v==='number'&&v>0?v+d:v;
    if(o.rec) o.rec={...o.rec,at:at(o.rec.at)}; if(o.gf) o.gf={...o.gf,at:at(o.gf.at)}; if(o.ir) o.ir={...o.ir,at:at(o.ir.at)}; o.e=at(o.e);
    if(o.dr&&typeof o.dr==='object'){ const dr={}; for(const key in o.dr){ const r=o.dr[key]; dr[key]=Array.isArray(r)?[r[0],at(r[1])]:r; } o.dr=dr; } return o; };
  let here=new Set();
  const emit=()=>{ emitT=null; if(!peersFn) return; const now=Date.now(), list=[];
    for(const [k,v] of peers){ if(!here.has(k)&&now-v.heard>8000){ peers.delete(k); continue; } list.push({peer:k,kind:'viewer',sameTab:false,presence:shift(v.p,Math.min(...v.skews))}); }
    peersFn({peers:list}); };
  let lastEmit=0; const soon=()=>{ const d=Date.now()-lastEmit; if(d>100){ lastEmit=Date.now(); emit(); } else if(!emitT) emitT=setTimeout(()=>{ lastEmit=Date.now(); emit(); },100-d); };
  const take=(k,t,p,fast)=>{ if(!k||k===me||!p||typeof p!=='object') return; const v=peers.get(k)||{skews:[],t:0};
    // receive time minus send time = clock offset plus delay; the smallest recent value is the best guess at the offset
    if(fast||num(t)>v.t){ v.skews.push(Date.now()-num(t)); if(v.skews.length>12) v.skews.shift(); } if(fast) v.fast=Date.now();
    if(num(t)>=v.t){ v.t=num(t); v.p=p; } v.heard=Date.now(); peers.set(k,v); };
  ch.on('presence',{event:'sync'},()=>{ const st=ch.presenceState(); here=new Set(Object.keys(st));
    for(const k of here){ const m=st[k][st[k].length-1]; if(m&&m.p) take(k,m.t,m.p,false); }
    for(const k of [...peers.keys()]) if(!here.has(k)&&Date.now()-peers.get(k).heard>8000) peers.delete(k); soon(); });
  ch.on('broadcast',{event:'s'},msg=>{ const m=msg&&(msg.payload||msg); if(!m) return; take(m.k,m.t,m.p,true); soon(); if(m.hi) setTimeout(()=>send(true),Math.random()*400); });
  const moving=(a,b)=>{ if(!a||!b) return false; const x={...a}, y={...b}; for(const f of ['x','z','r']){ delete x[f]; delete y[f]; } return JSON.stringify(x)===JSON.stringify(y); };
  function track(){ trackT=null; if(!ready||!cur) return; const k=JSON.stringify(cur); if(k===tracked) return; tracked=k; trackAt=Date.now(); ch.track({t:Date.now(),p:cur}).catch(()=>{}); }
  function send(force,hi){ timer=null; if(!ready||!cur) return; const k=JSON.stringify(cur); if(!force&&k===sentKey) return; sentKey=k; sentAt=Date.now();
    try{ const r=ch.send({type:'broadcast',event:'s',payload:{k:me,t:Date.now(),p:cur,hi:hi?1:0}}); if(r&&r.catch) r.catch(()=>{}); }catch{}
    if(!trackT) trackT=setTimeout(track,Math.max(0,800-(Date.now()-trackAt))); }
  await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),15000);
    ch.subscribe(st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); ready=true; track(); send(true,true); res(); } }); });
  setInterval(()=>send(true),2500);
  setInterval(soon,3000);
  addEventListener('pagehide',()=>{ try{ ch.untrack(); sb.removeChannel(ch); }catch{} });
  return { presence(o){ const prev=cur; cur=o; if(timer) return Promise.resolve();
      const gap=moving(prev,o)?140:0, wait=Math.max(0,gap-(Date.now()-sentAt)); timer=setTimeout(send,wait); return Promise.resolve(); },
    onPeers(fn){ peersFn=fn; emit(); },
    mode(){ let fast=0, n=0; for(const v of peers.values()){ n++; if(v.fast&&Date.now()-v.fast<6000) fast++; } return n?(fast?'即時':'慢速'):''; } }; }
async function connectRoom(){ try{ if(window.claude&&typeof window.claude.use==='function') room=await window.claude.use('room'); }catch{ room=null; }
  if(!room){ try{ room=await supabaseRoom(); }catch{ room=null; } }

  room.onPeers(ch=>{ const seen=new Set(); for(const p of ch.peers){ if(p.sameTab||p.kind!=='viewer') continue; seen.add(p.peer); let o=others.get(p.peer); if(!o){ o={av:makeAvatar(0x888888),p:{}}; others.set(p.peer,o); } o.p=p.presence||{}; }
    for(const [k,o] of others) if(!seen.has(k)){ scene.remove(o.av.g); others.delete(k); } renderPeople(); }, ()=>{ room=null; renderPeople(); });
  lastSent=''; pushPresence(); renderPeople(); }

const controllers=[];

/* ---------------- loop ---------------- */
const clock=new THREE.Clock(); const fwd=new THREE.Vector3(); let presT=0;
function step(dt){

  else if(ME.path.length){ const t=ME.path[0]; const dx=t.x-ME.x, dz=t.z-ME.z, d=Math.hypot(dx,dz); const sp=2.4*dt;
    const want=Math.atan2(-dx,-dz); if(d>0.4 && !ME.faceTo){ let dy=want-ME.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); ME.yaw+=dy*Math.min(1,dt*3.2); }
    if(d<=sp){ ME.x=t.x; ME.z=t.z; ME.path.shift(); if(!ME.path.length){ if(ME.faceTo){ const f=ME.faceTo; ME.targetYaw=Math.atan2(-(f.x-ME.x),-(f.z-ME.z)); ME.targetPitch=Math.atan2(f.y-ME.eye,Math.hypot(f.x-ME.x,f.z-ME.z)); ME.faceTo=null; } const a=ME.afterArrive; ME.afterArrive=null; a&&a(); } }
    else { const ok=tryMove(dx/d*sp,dz/d*sp); if(!ok){ ME.path=[]; ME.afterArrive=null; } } }
  if(ME.targetYaw!=null){ let dy=ME.targetYaw-ME.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); ME.yaw+=dy*Math.min(1,dt*5); ME.pitch+=(ME.targetPitch-ME.pitch)*Math.min(1,dt*5); if(Math.abs(dy)<0.01){ ME.targetYaw=null; } }

  const tt=clock.elapsedTime;

    const bearing=i*Math.PI*2/clouds.length+tt*.006;
    cloud.position.set(65*Math.cos(bearing),22+i%3*10,courtAxis+65*Math.sin(bearing));
  });
  // others
  for(const [,o] of others){ const p=o.p; const s=num(p.s,-1); let x=num(p.x), z=num(p.z), r=num(p.r), y=floorY(x,z); if(s>=0&&SEATS[s]){ x=SEATS[s].x; z=SEATS[s].z; r=SEATS[s].yaw; y=SEAT_KIND[SEATS[s].kind].sink; }
    o.av.cup.visible=num(p.dk,-1)>=0&&!!DRINKS[p.dk];
    { const st=s>=0&&SEATS[s]?SEATS[s]:null, spot=st&&SEAT_SPOT[st.kind];
      if(spot) o.av.cup.position.set(.18,spot[1]-y-.045,-spot[0]); else o.av.cup.position.set(.27,.88,-.14);
      const sn=num(p.sn,-1); if(o.av.snI!==sn){ o.av.snI=sn; o.av.g.remove(o.av.snack); o.av.snack=snackMesh(SNACKS[sn]?sn:-1); o.av.g.add(o.av.snack); }
      if(spot) o.av.snack.position.set(-.2,spot[1]-y-.04,-spot[0]-.08); else o.av.snack.position.set(-.27,.86,-.14); }
    const g=o.av.g; g.position.x+=(x-g.position.x)*Math.min(1,dt*9); g.position.z+=(z-g.position.z)*Math.min(1,dt*9); g.position.y+=(y-g.position.y)*Math.min(1,dt*6); let dy=r-g.rotation.y; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); g.rotation.y+=dy*Math.min(1,dt*6); }

  if(renderer.xr.isPresenting){
    const axes=Array.from(renderer.xr.getSession().inputSources,src=>src.gamepad?.axes?.[2]||0);
    const turn=axes.find(axis=>Math.abs(axis)>0.7);
    if(turn && !snapHeld){
      const offset=offsetFromRig();
      const angle=-Math.sign(turn)*Math.PI/6;
      const x=offset.x, z=offset.z;
      ME.x+=x-(x*Math.cos(angle)+z*Math.sin(angle));

        (hit.object.userData.type!=='floor'||walkable(hit.point.x,hit.point.z));
      line.material.color.setHex(valid?0xa8e6ac:0xffe2a8);
    }
  }
}
function tryMove(dx,dz){ if(walkable(ME.x+dx,ME.z+dz)){ ME.x+=dx; ME.z+=dz; return true; } if(walkable(ME.x+dx,ME.z)){ ME.x+=dx; return true; } if(walkable(ME.x,ME.z+dz)){ ME.z+=dz; return true; } return false; }
/* ---------------- performance: merge static meshes, share a small pool of point lights ---------------- */
function mergeGeos(list){ let nv=0, ni=0; for(const g of list){ nv+=g.attributes.position.count; ni+=g.index?g.index.count:g.attributes.position.count; }
  const pos=new Float32Array(nv*3), nor=new Float32Array(nv*3), uv=new Float32Array(nv*2), idx=new Uint32Array(ni); let vo=0, io=0;
  for(const g of list){ const n=g.attributes.position.count; pos.set(g.attributes.position.array.subarray(0,n*3),vo*3);
    if(g.attributes.normal) nor.set(g.attributes.normal.array.subarray(0,n*3),vo*3); if(g.attributes.uv) uv.set(g.attributes.uv.array.subarray(0,n*2),vo*2);
    if(g.index){ const a=g.index.array; for(let i=0;i<a.length;i++) idx[io+i]=a[i]+vo; io+=a.length; } else { for(let i=0;i<n;i++) idx[io+i]=vo+i; io+=n; }
    vo+=n; }

let LIGHT_POOL=[], VLIGHTS=[];

const canonMats=new Map();
function canonical(m){ const live=[lampPaper,lanternSilk,...ZL_LIVE,...LAMPS.map(l=>l.mat)]; if(live.includes(m)) return {m,uv:null};
  const t=m.map; const sig=[m.type,m.color?m.color.getHex():'',m.roughness,m.metalness,m.emissive?m.emissive.getHex():'',m.emissiveIntensity,m.side,m.transparent,m.opacity,m.flatShading,m.toneMapped,m.fog,m.depthWrite,m.alphaTest,m.vertexColors,
    t?t.source.uuid+','+t.wrapS+','+t.wrapT+','+t.colorSpace+','+t.anisotropy+','+t.flipY:''].join('|');
  let uv=null; if(t){ if(t.matrixAutoUpdate) t.updateMatrix(); const e=t.matrix.elements; if(!(e[0]===1&&e[4]===1&&e[6]===0&&e[7]===0&&e[1]===0&&e[3]===0)) uv=t.matrix.clone(); }

function optimizeScene(){
  try{
  scene.updateMatrixWorld(true);
  // anything that moves, changes visibility or is picked stays as it is
  const dyn=new Set();
  const keep=o=>{ if(o) o.traverse(c=>dyn.add(c)); };
  for(const k in DOORS){ for(const l of DOORS[k].leaves) keep(l.pv); keep(DOORS[k].bar); }
  [platter,cuckoo.g,PINE,myCup,mySnackMesh,hl,hlGlow,marker,floorShade,...LANTERNS,...GF_CUPS,...IRORI_CUPS,...PINZI,...ZL_DYN,...LEAVES.map(l=>l.m)].forEach(keep);
  const groups=new Map(), victims=[], pickId=new Map();
  scene.traverse(o=>{ if(!o.isMesh||o.isInstancedMesh||dyn.has(o)||!o.visible) return; let p=o.parent; while(p&&p!==scene){ if(!p.visible) return; p=p.parent; }
    if(Array.isArray(o.material)) return; const m=o.material, u=o.userData&&o.userData.type?o.userData:null;
    if(!(m.isMeshStandardMaterial||m.isMeshBasicMaterial)||m.visible===false||o.geometry.morphAttributes&&Object.keys(o.geometry.morphAttributes).length) return;
    if(u&&['shelf','lamp'].includes(u.type)) return;

    if(u&&!pickId.has(u)) pickId.set(u,pickId.size+1);
    const cm=canonical(m);
    const key=cm.m.uuid+'|'+(o.castShadow?1:0)+(o.receiveShadow?1:0)+'|'+(u?pickId.get(u):0); if(!groups.has(key)) groups.set(key,{m:cm.m,u,cast:o.castShadow,recv:o.receiveShadow,geos:[]});
    const gg=g.clone().applyMatrix4(o.matrixWorld); for(const name of Object.keys(gg.attributes)) if(!['position','normal','uv'].includes(name)) gg.deleteAttribute(name);
    if(cm.uv&&gg.attributes.uv){ const a=gg.attributes.uv, v=new THREE.Vector3(); for(let i=0;i<a.count;i++){ v.set(a.getX(i),a.getY(i),1).applyMatrix3(cm.uv); a.setXY(i,v.x,v.y); } }
    groups.get(key).geos.push(gg); victims.push(o); });

  for(let i=pickables.length-1;i>=0;i--) if(gone.has(pickables[i])) pickables.splice(i,1);

  scene.traverse(o=>{ if(o.isPointLight&&!LIGHT_POOL.includes(o)) VLIGHTS.push(o); });
  for(const l of VLIGHTS){ l.userData.wp=new THREE.Vector3().setFromMatrixPosition(l.matrixWorld); l.userData.zone=zoneOf({x:l.userData.wp.x,z:l.userData.wp.z}); l.visible=false; }

  renderer.shadowMap.needsUpdate=true;
  }catch(e){ console.warn('optimize',e); }
}
let lightPick=[], lightT=1;
