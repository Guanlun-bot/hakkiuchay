# 學鳩齋後台（Sveltia CMS）。照片在你的瀏覽器裡先縮到長邊 2000 像素、轉成 WebP，再上傳。
app_title: 學鳩齋後台
backend:
  name: github
  repo: Guanlun-bot/hakkiuchay
  branch: main
  auth_methods: [token]
  commit_messages:
    create: "新增 {{collection}}：{{slug}}"
    update: "修改 {{collection}}：{{slug}}"
    delete: "刪除 {{collection}}：{{slug}}"
    uploadMedia: "上傳 {{path}}"
    deleteMedia: "刪除 {{path}}"
media_folder: assets/uploads
public_folder: /assets/uploads
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    summary: "{{title}}（{{date}}）"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_groups:
      - label: 分類
        field: cat
    fields:
      - { name: title, label: 標題, widget: string }
      - { name: subtitle, label: 副標題（可留空）, widget: string, required: false }
      - { name: author, label: 作者（留空就用基本資料的名字）, widget: string, required: false }
      - name: slug
        label: 網址代稱
        widget: string
        hint: 只能用英文小寫、數字和連字號，例如 three-speeds。建立後不要再改。
        pattern: ["^[a-z0-9-]+$", "只能用英文小寫、數字和連字號（-）"]
      - name: cat
        label: 分類
        widget: select
        options:
          - { label: 學術, value: academic }
          - { label: 參學瑣談, value: study-talks }
          - { label: 生活札記, value: life }
      - { name: date, label: 日期, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { name: summary, label: 摘要, widget: text, required: false, hint: 列表上顯示的一兩句話。學術文章會當作摘要放在文章開頭。 }
      - { name: keywords, label: 關鍵詞（學術文章用）, widget: list, required: false }
      - { name: source, label: 出處（參學瑣談用）, widget: string, required: false }
      - { name: body, label: 內文, widget: markdown, hint: "要加註腳時，在內文寫 [註1]、[註2]……，再到下方「註釋」依序填寫。" }
      - name: notes
        label: 註釋
        widget: list
        required: false
        field: { name: note, label: 註, widget: text }
      - name: refs
        label: 參考書目
        widget: list
        required: false
        field: { name: ref, label: 書目, widget: string }

  - name: settings
    label: 照片與基本資料
    files:
      - name: photos
        label: 首頁照片
        file: _data/photos.yml
        fields:
          - name: photos
            label: 照片（可拖曳調整順序）
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: 照片, widget: image }
              - { name: caption, label: 說明（可留空）, widget: string, required: false }
      - name: site
        label: 基本資料
        file: _data/site.yml
        fields:
          - { name: owner, label: 名字或字號, widget: string }
          - { name: avatar, label: 大頭貼, widget: image, required: false }
          - { name: owner_bio, label: 自我介紹, widget: text, required: false }
          - { name: email, label: 電子郵件, widget: string, required: false }
          - { name: place, label: 所在, widget: string, required: false }
          - { name: discord, label: Discord 連結, widget: string, required: false, hint: 填了才會在關於頁與頁尾顯示 }
          - { name: signal, label: Signal 群組連結, widget: string, required: false }
          - { name: tajiyu_url, label: 獺祭魚網址, widget: string, required: false }
      - name: home
        label: 首頁文字
        file: _data/home.yml
        fields:
          - { name: quote, label: 照片下方引文, widget: text, required: false, hint: 一行就是一行；留空則不顯示 }
          - { name: quote_source, label: 題跋出處, widget: string, required: false }
          - { name: intro_title, label: 介紹區塊標題, widget: string, required: false }
          - { name: intro, label: 書齋介紹, widget: text, required: false, hint: 空一行就是分段；留空則不顯示 }
          - { name: slide_seconds, label: 照片輪播秒數, widget: number, value_type: int, min: 2, required: false }
      - name: text
        label: 網站文字
        file: _data/text.yml
        fields:
          - { name: site_name, label: 齋名（頁首左上）, widget: string }
          - { name: nav_home, label: 選單：首頁, widget: string }
          - { name: nav_tajiyu, label: 選單：獺祭魚, widget: string }
          - { name: nav_about, label: 選單：關於, widget: string }
          - { name: footer, label: 頁尾文字, widget: string }
          - { name: about_title, label: 關於頁：大標題, widget: string }
          - { name: owner_heading, label: 關於頁：齋主欄標題, widget: string }
          - { name: contact_heading, label: 關於頁：聯絡欄標題, widget: string }
          - { name: contact_note, label: 關於頁：聯絡說明, widget: text, required: false }
          - { name: email_label, label: 關於頁：電子郵件標籤, widget: string }
          - { name: place_label, label: 關於頁：所在標籤, widget: string }
          - { name: discord_label, label: Discord 標籤, widget: string, required: false }
          - { name: signal_label, label: Signal 標籤, widget: string, required: false }
          - { name: empty_category, label: 分類沒有文章時顯示, widget: string }
          - { name: tajiyu_title, label: 獺祭魚頁標題, widget: string, required: false }
          - { name: tajiyu_intro, label: 獺祭魚簡介, widget: string, required: false }
      - name: categories
        label: 分類名稱
        file: _data/categories.yml
        fields:
          - name: academic
            label: 學術
            widget: object
            fields:
              - { name: name, label: 名稱（選單與標題）, widget: string }
              - { name: desc, label: 說明, widget: string, required: false }
              - { name: prefix, label: 索書號字頭, widget: string }
              - { name: color, label: 顏色, widget: hidden }
              - { name: en, label: en, widget: hidden }
          - name: study-talks
            label: 參學瑣談
            widget: object
            fields:
              - { name: name, label: 名稱（選單與標題）, widget: string }
              - { name: desc, label: 說明, widget: string, required: false }
              - { name: prefix, label: 索書號字頭, widget: string }
              - { name: color, label: 顏色, widget: hidden }
              - { name: en, label: en, widget: hidden }
          - name: life
            label: 生活札記
            widget: object
            fields:
              - { name: name, label: 名稱（選單與標題）, widget: string }
              - { name: desc, label: 說明, widget: string, required: false }
              - { name: prefix, label: 索書號字頭, widget: string }
              - { name: color, label: 顏色, widget: hidden }
              - { name: en, label: en, widget: hidden }
