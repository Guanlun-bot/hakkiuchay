{%- assign p = include.post -%}
{%- assign c = site.data.categories[p.cat] -%}
<li style="--c:{{ c.color }}">
  <time datetime="{{ p.date | date: '%Y-%m-%d' }}">{{ p.date | date: "%Y・%m・%d" }}{% include callno.html post=p %}</time>
  <div>
    <h3><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
    {% if p.summary %}<p>{{ p.summary }}</p>{% endif %}
    {% if include.show_cat %}<div class="meta-line"><a class="cat-tag" href="{{ '/' | append: p.cat | append: '/' | relative_url }}">{{ c.name }}</a></div>{% endif %}
  </div>
</li>
