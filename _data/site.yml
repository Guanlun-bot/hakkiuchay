owner_bio: |
  許原綸，字經始，號龍江，綽號阿農。笨港人，祖籍福建晉江龍湖亭，2002年生於嘉義。

  最大的嗜好是貓。心智年齡大約只有十歲。平日生活平淡，自己炊飯、食茶，到公園閒逛，偶爾買一塊起司蛋糕，便覺得日子很好。

  現就讀於臺灣普通大學碩士班，正與碩士論文纏綿中，進度尚待天意。研究興趣在近現代東亞的宗教、思想與文化史。碩士論文以民初中國的素食主義為題，試圖探究一種飲食選擇怎樣與宗教信仰、身體觀念與時代思潮彼此交織。同時也對東西交流史、東南亞史，以及華人文化的主體性有一些興趣。
