    b: "你中文那麼好，那你說越南話給我聽啊。說 cảm ơn，說說看！"
  - key: he.t2
    when: "逗阿荷的選項二"
    a: "你剛剛唱的是哪首？怎麼聽起來像貓在叫。"
    b: "笑她唱歌走音"
  - key: he.r2
