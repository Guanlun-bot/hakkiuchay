# 學鳩齋管理後台設定（Pages CMS：https://app.pagescms.org）
media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: posts
    label: 文章
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{fields.slug}.md"
    view:
      fields: [title, cat, date]
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 標題
        type: string
        required: true
      - name: subtitle
        label: 副標題（可留空，例如英文標題）
        type: string
      - name: author
        label: 作者（留空就用基本資料的名字）
        type: string
      - name: slug
        label: 網址代稱
        type: string
        required: true
        description: 只能用英文小寫、數字和連字號，例如 three-speeds。會成為這篇文章網址的一部分，建立後不要再改。
        pattern:
          regex: "^[a-z0-9-]+$"
          message: 只能用英文小寫、數字和連字號（-）
      - name: cat
        label: 分類
        type: select
        required: true
        options:
          values:
            - name: academic
              label: 學術
            - name: study-talks
              label: 參學瑣談
            - name: life
              label: 生活札記
      - name: date
        label: 日期
        type: date
        required: true
      - name: summary
        label: 摘要
        type: text
        description: 列表上顯示的一兩句話。學術文章會當作摘要放在文章開頭。
      - name: keywords
        label: 關鍵詞（學術文章用）
        type: string
        list: true
      - name: source
        label: 出處（參學瑣談用，例如：讀《論語》、聽講記）
        type: string
      - name: body
        label: 內文
        type: rich-text
        description: 要加註腳時，在內文寫 [註1]、[註2]……，再到下方「註釋」依序填寫。
        options:
          format: markdown
          rename: safe
      - name: notes
        label: 註釋
        type: text
        list: true
        description: 第一條對應內文的 [註1]，第二條對應 [註2]，依此類推。
      - name: refs
        label: 參考書目
        type: string
        list: true
        description: 一條一筆。要分類時，另起一條寫「## 分類名稱」，例如「## 近人專書」。

  - name: photos
    label: 首頁照片
    type: file
    path: _data/photos.yml
    format: yaml
    fields:
      - name: photos
        label: 照片（可拖曳調整順序）
        type: object
        list: true
        fields:
          - name: image
            label: 照片
            type: image
            options:
              rename: safe
              extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP]
          - name: caption
            label: 說明（可留空，放大時顯示在角落）
            type: string

  - name: site
    label: 基本資料
    type: file
    path: _data/site.yml
    format: yaml
    fields:
      - name: owner
        label: 名字或字號
        type: string
      - name: avatar
        label: 大頭貼
        type: image
      - name: owner_bio
        label: 自我介紹
        type: text
        description: 空一行就是分段。
      - name: email
        label: 電子郵件
        type: string
        description: 留空就不會顯示。
      - name: place
        label: 所在
        type: string
        description: 留空就不會顯示。
      - name: discord
        label: Discord 連結
        type: string
        description: 例如 https://discord.gg/xxxx 。填了才會在關於頁與頁尾顯示。
      - name: signal
        label: Signal 群組連結
        type: string
        description: 填了才會顯示圖示。
      - name: tajiyu_url
        label: 獺祭魚網址
        type: string
        description: 填入後，選單上的「獺祭魚」會直接開啟這個網址。

  - name: home
    label: 首頁文字
    type: file
    path: _data/home.yml
    format: yaml
    fields:
      - name: quote
        label: 照片下方引文
        type: text
        description: 一行就是一行；留空則不顯示。
      - name: quote_source
        label: 題跋出處
        type: string
      - name: intro_title
        label: 介紹區塊標題
        type: string
      - name: intro
        label: 書齋介紹
        type: text
        description: 空一行就是分段；留空則不顯示這個區塊。
      - name: slide_seconds
        label: 照片輪播秒數
        type: number

  - name: text
    label: 網站文字
    type: file
    path: _data/text.yml
    format: yaml
    fields:
      - { name: site_name, label: 齋名（頁首左上）, type: string }
      - { name: nav_home, label: 選單：關於書齋（首頁）, type: string }
      - { name: nav_tajiyu, label: 選單：獺祭魚, type: string }
      - { name: footer, label: 頁尾文字（© 年份之後）, type: string }
      - { name: owner_heading, label: 齋主／聯絡：齋主欄標題, type: string }
      - { name: contact_heading, label: 齋主／聯絡：聯絡欄標題, type: string }
      - { name: contact_note, label: 齋主／聯絡：聯絡說明, type: text }
      - { name: email_label, label: 齋主／聯絡：電子郵件標籤, type: string }
      - { name: place_label, label: 齋主／聯絡：所在標籤, type: string }
      - { name: discord_label, label: Discord 標籤, type: string }
      - { name: signal_label, label: Signal 標籤, type: string }
      - { name: empty_category, label: 分類沒有文章時顯示, type: string }
      - { name: tajiyu_title, label: 獺祭魚頁標題（未填網址時才會用到）, type: string }
      - { name: tajiyu_intro, label: 獺祭魚簡介, type: string }

  - name: categories
    label: 分類名稱
    type: file
    path: _data/categories.yml
    format: yaml
    fields:
      - name: academic
        label: 學術
        type: object
        fields:
          - { name: name, label: 名稱（選單與標題）, type: string }
          - { name: desc, label: 說明, type: string }
          - { name: prefix, label: 索書號字頭, type: string }
          - { name: cover, label: 背景圖片, type: image }
          - { name: cover_caption, label: 背景圖說明（目前不顯示）, type: string }
          - { name: color, label: 顏色（勿改）, type: string, hidden: true }
          - { name: en, label: en, type: string, hidden: true }
      - name: study-talks
        label: 參學瑣談
        type: object
        fields:
          - { name: name, label: 名稱（選單與標題）, type: string }
          - { name: desc, label: 說明, type: string }
          - { name: prefix, label: 索書號字頭, type: string }
          - { name: cover, label: 背景圖片, type: image }
          - { name: cover_caption, label: 背景圖說明（目前不顯示）, type: string }
          - { name: color, label: 顏色（勿改）, type: string, hidden: true }
          - { name: en, label: en, type: string, hidden: true }
      - name: life
        label: 生活札記
        type: object
        fields:
          - { name: name, label: 名稱（選單與標題）, type: string }
          - { name: desc, label: 說明, type: string }
          - { name: prefix, label: 索書號字頭, type: string }
          - { name: cover, label: 背景圖片, type: image }
          - { name: cover_caption, label: 背景圖說明（目前不顯示）, type: string }
          - { name: color, label: 顏色（勿改）, type: string, hidden: true }
          - { name: en, label: en, type: string, hidden: true }
