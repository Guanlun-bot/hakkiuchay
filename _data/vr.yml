    a: "在讀《論語》，許總管說每天要背一章。今天是「學而時習之」。"
    b: "在臨帖，寫的是〈九成宮〉。我的「之」字總是寫不好。"
  - key: fu.bookL
    when: "問阿福讀書的按鈕名稱"
    a: "在讀什麼書？"
    b: ""
  - key: lai.talk
    when: "跟阿來說話"
    a: "{稱呼}！你要喝茶嗎？我跑得很快喔！"
    b: "{稱呼}，我問你喔，月亮為什麼會跟著人走？"
  - key: lai.what
    when: "問阿來在做什麼"
    a: "許總管叫我去送東西，我一下就回來！"
    b: "我在掃院子，葉子掃不完，風一吹又掉下來。"
  - key: lai.whatL
    when: "問阿來在做什麼的按鈕名稱"
    a: "你在做什麼？"
    b: ""
  - key: lai.ask
    when: "阿來問你問題"
    a: "{稱呼}，一百減掉三十七是多少？……六十三！我算對了吧！"
    b: "{稱呼}，台北到台南要走幾天？坐火車呢？"
  - key: lai.askL
    when: "阿來問問題的按鈕名稱"
    a: "考考我"
    b: ""
  - key: fu.call
    when: "叫阿福時他說的話（甲：醒著；乙：剛被叫醒）"
    a: "{稱呼}，來了！"
    b: "（揉著眼睛）{稱呼}……來了……"
  - key: lai.call
    when: "叫阿來時他說的話（甲：醒著；乙：剛被叫醒）"
    a: "{稱呼}，來了！"
    b: "（打著呵欠）{稱呼}，我來了……"
  - key: fu.bye
    when: "遣回阿福時他說的話"
    a: "是，{稱呼}。"
    b: ""
  - key: lai.bye
    when: "遣回阿來時他說的話"
    a: "是，{稱呼}！我回去了。"
    b: ""
  - key: fu.hi
    when: "頭家回家時阿福問好"
    a: "{稱呼}回來了！"
    b: ""
  - key: lai.hi
    when: "頭家回家時阿來問好"
    a: "{稱呼}回來啦！要不要喝茶？"
    b: ""
  - key: yu.boss
    when: "頭家從大門進來時玉姨說的話"
    a: "頭家轉來啊！"
    b: "頭家轉來啊，外頭熱吧？"
  - key: lai.teaL
    when: "頭家坐著時叫阿來泡茶的按鈕"
    a: "叫阿來泡茶"
    b: ""
  - key: lai.teaGo
    when: "阿來去泡茶"
    a: "好，我去跟阿春姊拿茶！"
    b: ""
  - key: lai.tea
    when: "阿來把茶端回來"
    a: "{稱呼}，茶來了，小心燙。"
    b: ""
  - key: kid.callL
    when: "呼喚按鈕（甲：叫來；乙：遣回；{名} 會換成名字）"
    a: "喚{名}"
    b: "讓{名}回去"
  - key: kid.wait
    when: "頭家進浴室或廁所時書僮在門外等"
    a: "我們在外面等{稱呼}。"
    b: ""
  - key: xu.call
    when: "許總管叫阿來跑腿"
    a: "阿來，去把這個送到前面。"
    b: ""
  - key: sauna.bolt
    when: "點烤箱門內的門栓（甲：栓上；乙：拉開）"
    a: "門栓拉上了，燈慢慢亮起來，暖黃的光照滿整間。"
    b: "門栓拉開了。"
  - key: sauna.lock
    when: "烤箱門栓（甲：門被栓住時點門；乙：在外面點門栓）"
    a: "門從裡面栓住了。"
    b: "門栓在裡面。"
  - key: sauna.busy
    when: "傭人在烤箱裡時點門"
    a: "裡面有人在烤，等他們出來吧。"
    b: ""
  - key: day.times
    when: "傭人作息（臺北時間，逗號分開）：起床、女生洗澡、男生洗澡、熄燈"
    a: "05:00,22:40,23:20,24:00"
    b: ""
  - key: staff.sleep
    when: "點睡著的傭人（甲、乙輪流）"
    a: "睡著了。"
    b: "睡得正熟，別吵醒。"
  - key: staff.bath
    when: "跟正在洗澡的傭人說話（甲：洗身、更衣；乙：泡澡）"
    a: "在洗澡呢，晚點再說。"
    b: "泡得正舒服。"
  - key: alarm.msg
    when: "點床頭櫃的鬧鐘（{now} 現在時間、{wake} 起床時間）"
    a: "鬧鐘：現在 {now}，明早 {wake} 響。"
    b: ""
  - key: alarm.ring
    when: "鬧鐘響時，人在房間附近看到的提示"
    a: "鈴——鬧鐘響了，起床了。"
    b: ""
  - key: sauna.hud
    when: "在烤箱裡，右下角小框的名稱"
    a: "烤箱"
    b: ""
  - key: sauna.remind
    when: "在烤箱待滿十二分鐘的提醒"
    a: "已經烤十二分鐘了，出去喝口水、沖一下再進來吧。"
    b: ""
  - key: bath.sign
    when: "浴室暖簾旁的木牌（甲：女生洗澡時；乙：男生洗澡時）"
    a: "女湯"
    b: "男湯"
  - key: bath.sign0
    when: "浴室木牌在其他時候"
    a: "湯"
    b: ""
  - key: cine.stars
    when: "電影院小面板的星空開關（甲：開；乙：關），各人自己的"
    a: "星空：開"
    b: "星空：關"
  - key: cine.err
    when: "影片載入失敗時"
    a: "影片載入失敗：請確認網址，以及 Cloudflare R2 的 CORS 已允許 https://hakkiuchay.space 讀取。"
    b: ""
  - key: cine.tap
    when: "瀏覽器擋住自動播放時"
    a: "點一下畫面，影片就會開始播放（瀏覽器要先點一下才能出聲）。"
    b: ""
  - key: cls.seat
    when: "教室座位的名稱（甲：學生座；乙：講桌）"
    a: "教室"
    b: "講桌"
  - key: cls.label
    when: "教室座位的動作（甲：學生座；乙：講桌）"
    a: "上課"
    b: "講課"
  - key: cls.hello
    when: "在教室坐下時的提示（甲：學生座；乙：講桌）"
    a: "在教室坐下，面向黑板。"
    b: "在講桌後坐下。點筆電開投影。"
  - key: cls.status
    when: "在教室坐著時給別人看的狀態（甲：學生座；乙：講桌）"
    a: "在教室上課"
    b: "在講台上"
  - key: cls.board
    when: "黑板面板的標題（甲）"
    a: "黑板"
    b: ""
  - key: cls.ui
    when: "黑板與投影面板的關閉按鈕（乙）"
    a: ""
    b: "關閉"
  - key: cls.pen
    when: "黑板工具（甲：粉筆；乙：板擦）"
    a: "粉筆"
    b: "板擦"
  - key: cls.text
    when: "黑板打字（甲：打字；乙：直書切換）"
    a: "打字"
    b: "直書"
  - key: cls.colors
    when: "黑板粉筆（甲：四色名稱，用逗號分開；乙：三種粗細，用逗號分開）"
    a: "白,黃,紅,藍"
    b: "細,中,粗"
  - key: cls.undo
    when: "黑板按鈕（甲：復原；乙：清空）"
    a: "復原"
    b: "清空"
  - key: cls.clearq
    when: "按清空後的確認字（甲）"
    a: "再按一次清空"
    b: ""
  - key: cls.cleared
    when: "別人清空黑板時的提示（甲）"
    a: "黑板被擦乾淨了。"
    b: ""
  - key: cls.load
    when: "黑板按鈕：貼上電腦裡的圖片（甲）"
    a: "貼上圖片"
    b: ""
  - key: cls.export
    when: "黑板按鈕（甲：下載圖片；乙：下載文字並複製）"
    a: "存成圖片"
    b: "匯出文字"
  - key: cls.notext
    when: "匯出文字的提示（甲：沒有文字時；乙：完成時）"
    a: "黑板上沒有打字的內容。"
    b: "文字已下載，也複製到剪貼簿。"
  - key: cls.texthint
    when: "黑板面板下方的說明（甲）"
    a: "在教室的人都看得到黑板。打字：點黑板上的位置再輸入，Enter 寫上去、Shift+Enter 換行、Esc 取消。大家離開後黑板就清空。"
    b: ""
  - key: cls.proj
    when: "投影面板的標題（甲）"
    a: "投影"
    b: ""
  - key: cls.file
    when: "投影開檔按鈕（甲：開啟電腦裡的檔案；乙：載入網址）"
    a: "開啟檔案（PDF、圖片、PPTX）"
    b: "載入網址"
  - key: cls.nav
    when: "投影翻頁按鈕（甲：上一頁；乙：下一頁）"
    a: "上一頁"
    b: "下一頁"
  - key: cls.screen
    when: "布幕按鈕（甲：放下；乙：收起）"
    a: "放下布幕"
    b: "收起布幕"
  - key: cls.screened
    when: "點黑板旁拉桿後的提示（甲：放下；乙：收起）"
    a: "布幕放下了。"
    b: "布幕收起來了。"
  - key: cls.laser
    when: "投影面板（甲：雷射筆勾選；乙：停止投影按鈕）"
    a: "雷射筆"
    b: "停止投影"
  - key: cls.loading
    when: "投影讀檔中（甲）"
    a: "讀取中…"
    b: ""
  - key: cls.err
    when: "投影讀檔失敗（甲：一般；乙：舊式 .ppt）"
    a: "這個檔案讀不出來。"
    b: "舊式 .ppt 無法讀取，請另存成 PDF 或 PPTX。"
  - key: cls.urlerr
    when: "投影網址讀不到時（甲）"
    a: "這個網址不讓別的網站讀取，請先下載再開啟。"
    b: ""
  - key: cls.projhint
    when: "投影面板下方的說明（甲）"
    a: "投影的畫面大家都看得到；只有開檔的人能翻頁（← → 也可以）。PPTX 只顯示文字與圖片。勾雷射筆後，在上面的畫面移動滑鼠。"
    b: ""
  - key: cls.vr
    when: "戴 VR 眼鏡點黑板或筆電時的提示（甲）"
    a: "請在電腦或手機上操作。"
    b: ""
