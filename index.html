---
layout: default
title: 學鳩齋
nav: home
---
{%- assign photos = site.data.photos.photos -%}
<div class="wrap">
  <h1 class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">學鳩齋</h1>
  {% if photos and photos.size > 0 %}
  <div class="wall" id="wall">
    {% for ph in photos %}{% if ph.image %}
    <figure>
      <button type="button" data-i="{{ forloop.index0 }}" aria-label="放大照片{% if ph.caption %}：{{ ph.caption | escape }}{% endif %}">
        <img src="{{ ph.image | relative_url }}" alt="{{ ph.caption | default: '' | escape }}" loading="{% if forloop.index > 6 %}lazy{% else %}eager{% endif %}" decoding="async">
      </button>
    </figure>
    {% endif %}{% endfor %}
  </div>
  {% else %}
  <div class="empty-wall"><span class="plaque" aria-hidden="true">學鳩齋</span></div>
  {% endif %}
</div>

{% if photos and photos.size > 0 %}
<dialog class="lightbox" id="lb" aria-label="照片">
  <button class="nav" id="lb-prev" type="button" aria-label="上一張">‹</button>
  <div class="stagebox"><img id="lb-img" alt=""><span class="cap" id="lb-cap"></span></div>
  <button class="nav" id="lb-next" type="button" aria-label="下一張">›</button>
  <span class="count" id="lb-count"></span>
  <button class="close" id="lb-close" type="button" aria-label="關閉">×</button>
</dialog>
<script>
(function () {
  const items = [...document.querySelectorAll("#wall button")].map(b => {
    const img = b.querySelector("img"); return { src: img.src, cap: img.alt };
  });
  const lb = document.getElementById("lb"), im = document.getElementById("lb-img"),
        cap = document.getElementById("lb-cap"), cnt = document.getElementById("lb-count");
  let i = 0;
  const show = n => { i = (n + items.length) % items.length; im.src = items[i].src; im.alt = items[i].cap; cap.textContent = items[i].cap; cnt.textContent = (i + 1) + " / " + items.length; };
  document.querySelectorAll("#wall button").forEach((b, n) => b.addEventListener("click", () => { show(n); lb.showModal(); }));
  document.getElementById("lb-prev").onclick = () => show(i - 1);
  document.getElementById("lb-next").onclick = () => show(i + 1);
  document.getElementById("lb-close").onclick = () => lb.close();
  lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("stagebox")) lb.close(); });
  lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") show(i - 1); if (e.key === "ArrowRight") show(i + 1); });
  let x0 = null;
  lb.addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  lb.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
})();
</script>
{% endif %}
