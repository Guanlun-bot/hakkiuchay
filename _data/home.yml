quote: |-
  蜩與鷽鳩笑之曰：「我決起而飛，槍榆枋，時則不至，而控於地而已矣，奚以之九萬里而南爲？」
  適莽蒼者，三湌而反，腹猶果然。適百里者，宿舂糧。適千里者，三月聚糧。
quote_source: 《莊子・逍遙遊》
intro_title: 書齋
intro: |-
  學鳩齋是許原綸的書齋，位於許宅東廂房，與茶寮「知了間」隔院相望。

  齋內設有四張桌子：「近思室」放學術論文，「拈花記」記學佛的心得
  「三籟園」收生活片段，「獺祭魚」藏著蒐羅來的書目與史料，可以隨意翻閱，看累了也可以坐在藤椅上發呆。

  書齋搬上網路，只是想讓腦中的想法有個安放之處，不至於散落閒置，並不是特別寫給誰看。

  有緣人路過，歡迎進來食茶。
