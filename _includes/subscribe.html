{%- assign T = site.data.text -%}
{%- if site.notify_url and site.notify_url != "" -%}
<form class="subscribe" id="subscribe" data-url="{{ site.notify_url }}" novalidate>
  <label for="sub-email">{{ T.subscribe_label }}</label>
  <span class="subscribe-row">
    <input type="email" id="sub-email" name="email" required autocomplete="email" placeholder="{{ T.subscribe_placeholder }}">
    <input type="text" name="hp" tabindex="-1" autocomplete="off" aria-hidden="true" class="subscribe-hp">
    <button class="btn" type="submit">{{ T.subscribe_button }}</button>
  </span>
  <p class="subscribe-msg" role="status" hidden></p>
</form>
<script>
(function () {
  const f = document.getElementById("subscribe"), msg = f.querySelector(".subscribe-msg"), btn = f.querySelector("button");
  const say = t => { msg.textContent = t; msg.hidden = false; };
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const email = f.email.value.trim();
    if (!f.email.checkValidity() || !email) { say({{ T.subscribe_error | jsonify }}); return; }
    btn.disabled = true;
    try {
      const r = await fetch(f.dataset.url.replace(/\/$/, "") + "/subscribe", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email, hp: f.hp.value }) });
      if (!r.ok) throw 0;
      say({{ T.subscribe_sent | jsonify }}); f.email.value = "";
    } catch (_) { say({{ T.subscribe_error | jsonify }}); }
    btn.disabled = false;
  });
})();
</script>
{%- endif -%}
