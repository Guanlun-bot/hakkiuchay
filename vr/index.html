:root{--paper:#f1efe8;--card:#f7f6f1;--ink:#3f3a39;--ink-soft:#6e6866;--rule:#d3cec3;--seal:#a8343a;
--c-academic:#3e5873;--c-talks:#3d6b4f;--c-life:#86683c;--c-taji:#a8343a;--f:"Noto Serif TC","Songti TC","PMingLiU",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1714;color:var(--ink);font-family:var(--f)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:var(--f);cursor:pointer}
.hide{display:none!important}
/* gate */
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#brand{position:absolute;left:14px;top:12px;background:rgba(241,239,232,.92);padding:8px 14px 9px;border-left:3px solid var(--seal);box-shadow:0 2px 12px rgba(0,0,0,.25)}
#brand .n{font-family:Reisho,var(--f);font-size:26px;line-height:1.1;color:var(--ink)}
#lighting,#ctempRow{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:7px;pointer-events:auto}
#lighting input,#ctempRow input{width:88px;accent-color:var(--seal)}
#ctempRow input{accent-color:#8a7a5a;background:linear-gradient(90deg,#ffb46b,#fff4e6,#cfe0ff);border-radius:4px;height:6px;-webkit-appearance:none;appearance:none}
#lighting output,#ctempRow output{min-width:3em;text-align:right}
#brand .t{font-size:12px;color:var(--ink-soft);margin-top:3px;letter-spacing:.05em}
#people{position:absolute;right:14px;top:12px;background:rgba(241,239,232,.92);padding:8px 12px;font-size:13px;min-width:150px;max-width:240px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#people .h{font-size:12px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#people .p{display:flex;gap:6px;align-items:baseline;line-height:1.7}
#people .dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
#people .st{color:var(--ink-soft);font-size:12px;margin-left:auto;white-space:nowrap}
#bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96vw}
#bar button{background:rgba(241,239,232,.94);border:1px solid var(--rule);color:var(--ink);font-size:14px;padding:8px 14px;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.22);letter-spacing:.08em}
#bar button:hover{background:#fff}
#bar button:disabled{opacity:.5;cursor:default}
#planbar{position:absolute;right:14px;bottom:70px;display:flex;flex-direction:column;gap:6px}
#planbar button{background:rgba(241,239,232,.94);border:1px solid var(--rule);color:var(--ink);font-size:14px;padding:7px 12px;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.22)}
#hint{opacity:0;position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(30,26,23,.78);color:#efe8da;font-size:13px;padding:8px 14px;border-radius:2px;line-height:1.7;text-align:center;max-width:92vw;pointer-events:none;transition:opacity .8s}
#drink{position:absolute;left:14px;bottom:14px;background:rgba(241,239,232,.94);padding:6px 10px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.22);display:flex;gap:8px;align-items:center}
#drink button{font-size:12px;padding:3px 8px;border:1px solid var(--rule);background:#fff;border-radius:2px;color:var(--ink)}
.menu li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.vol{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}
.vol input{flex:1;accent-color:var(--seal)}
#timer{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(241,239,232,.95);padding:10px 16px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.25);border-top:3px solid var(--c-talks)}
#timer .lab{font-size:12px;color:var(--ink-soft);letter-spacing:.2em}
#timer .clk{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1.2}
#timer .row{display:flex;gap:6px;margin-top:6px;justify-content:center}
#timer button{font-size:13px;padding:5px 10px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px}
#timer button.pri{background:var(--c-talks);color:#fff;border-color:var(--c-talks)}
/* side panel */
#panel{position:fixed;right:0;top:0;bottom:0;width:min(400px,100vw);background:var(--paper);z-index:20;box-shadow:-6px 0 24px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s cubic-bezier(.22,.61,.36,1)}
#panel.open{transform:none}
#panel .ph{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
#panel .ph h2{font-size:18px;margin:0;font-weight:600;flex:1;line-height:1.4}
#panel .x{border:0;background:none;font-size:22px;color:var(--ink-soft);padding:0 4px;line-height:1}

.meta{font-size:12px;color:var(--ink-soft)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 2px;border-bottom:1px solid #e3dfd5;cursor:pointer;line-height:1.5}
.list li:hover{background:#ebe7dd}
.list .bt{font-size:14.5px}
.list .ba{font-size:12px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 10px}
.chips button{font-size:12.5px;padding:4px 9px;border:1px solid var(--rule);background:#fff;border-radius:2px;color:var(--ink)}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card dl{display:grid;grid-template-columns:4.5em 1fr;gap:6px 10px;margin:8px 0 14px;font-size:14px}
.card dt{color:var(--ink-soft)}
.card dd{margin:0}
.card .tt{font-size:19px;font-weight:600;line-height:1.5}
.btn{display:inline-block;font-size:13.5px;padding:7px 12px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px;text-decoration:none;margin:0 6px 6px 0}
.btn.pri{background:var(--seal);color:#fff;border-color:var(--seal)}
.sec{font-size:13px;letter-spacing:.2em;margin:14px 0 4px;padding-left:8px;border-left:3px solid}
/* reader */
#reader{position:fixed;inset:0;z-index:30;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch}
#reader .rw{max-width:720px;margin:0 auto;padding:28px 22px 80px}
#reader .top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--rule);margin-bottom:22px;z-index:1}
#reader h1{font-size:24px;line-height:1.5;margin:0 0 6px;font-weight:700}
#reader .sub{color:var(--ink-soft);font-size:15px;margin-bottom:4px}
#reader .by{color:var(--ink-soft);font-size:13px;margin-bottom:22px}
#reader .src{font-size:13px;color:var(--ink-soft);background:var(--card);padding:10px 12px;border-left:3px solid var(--rule);margin-bottom:22px;line-height:1.8}
#reader article{font-size:16.5px;line-height:2;text-align:justify}
#reader article p{margin:0 0 1.1em}
#reader article h2{font-size:19px;margin:1.8em 0 .6em}
#reader article h3{font-size:17px;margin:1.5em 0 .5em}
#reader blockquote{margin:0 0 1.2em;padding:4px 0 4px 16px;border-left:3px solid var(--rule);color:#5b5553;font-size:15.5px}
#reader sup a{color:var(--seal);text-decoration:none;font-size:11px}
#reader .img{display:block;font-size:13px;color:var(--ink-soft);border:1px dashed var(--rule);padding:8px 12px;margin:0 0 1.2em;text-decoration:none}
#reader .notes{border-top:1px solid var(--rule);margin-top:30px;padding-top:14px;font-size:13.5px;line-height:1.8;color:#555}
#reader .notes li{margin-bottom:6px}
#reader a{color:var(--c-academic)}

,"處暑","三候","禾乃登"],[9,7,"白露","初候","鴻雁來"],[9,12,"白露","二候","玄鳥歸"],[9,17,"白露","三候","群鳥養羞"],[9,23,"秋分","初候","雷始收聲"],[9,28,"秋分","二候","蟄蟲坯戶"],[10,3,"秋分","三候","水始涸"],[10,8,"寒露","初候","鴻雁來賓"],[10,13,"寒露","二候","雀入大水為蛤"],[10,18,"寒露","三候","菊有黃華"],[10,23,"霜降","初候","豺乃祭獸"],[10,28,"霜降","二候","草木黃落"],[11,2,"霜降","三候","蟄蟲咸俯"],[11,7,"立冬","初候","水始冰"],[11,12,"立冬","二候","地始凍"],[11,17,"立冬","三候","雉入大水為蜃"],[11,22,"小雪","初候","虹藏不見"],[11,27,"小雪","二候","天氣上升地氣下降"],[12,2,"小雪","三候","閉塞而成冬"],[12,7,"大雪","初候","鶡鴠不鳴"],[12,12,"大雪","二候","虎始交"],[12,17,"大雪","三候","荔挺出"],[12,21,"冬至","初候","蚯蚓結"],[12,26,"冬至","二候","麋角解"],[12,31,"冬至","三候","水泉動"]],"posts":[{"title":"從《南巫》中鬼神的符號意義探討馬來西亞華人認同的轉化歷程","subtitle":"收錄於謝世維主編，《光影心象：電影中的宗教性與靈性》","author":"許原綸","cat":"academic","date":"2026-01-03","slug":"nanwu-malaysian-chinese-identity","source":"","notes":["筆者於本文中多使用「南洋」一詞以指稱東南亞，其原因在於「南洋」所承載的想像，更能貼近電影中華人對原鄉與異地關係之歷史脈絡的理解。相較之下，「東南亞」作為一個地理與政治概念，乃於二戰時才在西方政治語境與學術圈中中逐漸形成，其空間想像本身即帶有明顯的西方視角。名詞起源的討論參考：Benedict Anderson, The spectre of comparisons: Nationalism, Southeast Asia, and the world. (New York: Verso, 1998), pp. 3-8.關於克里奧爾化（creolization）的討論則參見：松井裕史著，林士鈞譯，〈克里奧化是過去，也是現在，更是未來〉，《文化研究季刊》159(2017):21-24。","陳愛梅、杜忠全，〈番神唐化：馬來西亞拿督公信仰〉，《臺北大學中文學報》30 (2021): 601-634。","李豐楙，〈斯土斯神：土地信仰的「理念性移植」：以桃園市為例的綜合考察〉，《世界宗教學刊》21 (2013): 1-25。","關於南洋華人的大伯公信仰，可以參考謝明達教授的研究：Jack Meng-Tat Chia ,“Who Is Tua Pek Kong? The Cult of Grand Uncle in Malaysia and Singapore.” Archív Orientální 85, no. 3 (2017): 439–60.","關於電影中的田伯爺形象，導演張吉安於相關演講中詳細介紹了其田野採集所得的資料，並對儀式、神話與族群歷史記憶加以說明，本文以下論述可部分參考其說明。可以參考：張吉安，〈稻地守護：田伯爺與 Semangat Padi〉，新紀元大學學院中文大講堂2021「大馬滿天神佛系列」演講，彭安琪主持，2021年7月22日，YouTube 影片，https://www.youtube.com/watch?v=RfsdYJ8gsOs&t=288s（瀏覽日期：2026年1月3日）。","茅草行動（Operasi Lalang）發生於1987年10月。起因是馬來西亞政府依《內安法令》（ISA）發動之大規模政治鎮壓行動。政府以防止族群衝突為由，在無視司法審判之情況下拘捕逾百名反對黨、社運、華教、宗教人士和學者。茅草行動被視為馬來西亞具代表性的「白色恐怖」案例。除了人身拘禁外，政府亦同步停刊多家報紙，使華文與非華文媒體的公共論述空間急遽收縮。","陳中和，〈馬來西亞馬哈迪政府之伊斯蘭政策：政教關係角度之分析〉，（臺北：中國文化大學中山學術研究所博士論文，2008），頁50-72。","胡婷婷，〈台灣民間土地公信仰之研究〉，（臺北：華梵大學東方人文思想研究所碩士論文，2007），頁55-56。","石文誠，〈荷蘭公主上了岸？一段傳說、歷史與記憶的交錯歷程〉，《臺灣文獻》60.2 ( 2009 ) :182-202。","Mitsuko Tamaki, “The Prevalence of the Worship of Goddess Lin Guniang by the Ethnic Chinese in Southern Thailand” G-SEC Working Paper 22 (2007):1-37.","關於臺灣的姑娘信仰研究，可以參見：黃萍瑛，《臺灣民間信仰「孤娘」的奉祀──一個社會史的考察》（臺北：國家教育研究院，2008），頁288。","「過番」一詞大約形成於十八世紀的華人移民潮中。這個詞彙並非只有閩南語獨有，在潮州話、客家話、廣東話、福州話等閩粵方言中都很常見。","柯榮三，〈番平千萬不通行？－閩南「過番歌」中的歷史記憶與勸世話語〉，《民俗曲藝》179（2013）：185-222。","張應龍，〈百年回眸：馬來西亞華人政治史之變遷〉，收於何國忠主編，《百年回眸：馬華社會與政治》，（吉隆坡：華社研究中心，2005），頁8-12","施正鋒，〈馬來西亞的獨立建國〉，《台灣國際研究季刊》14.4 (2018): 1-37。","馬來至上主義（Ketuanan Melayu）是專有名詞，其定義十分複雜，並且有待重新討論。筆者認為陳珍榮論文中的定義有較為完整的詮釋，因此借用其文：「一種把馬來人詮釋為馬來西亞主人的論述，並因此擁有對這個國家的支配權。阿都拉阿末的演講被視為這個論述的濫觴」。詳細的討論可以參考：陳貞榮，〈馬來西亞「馬來至上」之研究〉，碩士論文（南投：國立暨南國際大學東南亞研究所，2011），頁 8。","吳子文，〈僑生教育與中華民國：台灣國族想像的轉變，1951-2008〉，《文化研究》10 (2010): 103-138。","關於南洋華人移民的界定，歷來已經諸多討論。筆者認為莊國土對華人一詞概念史的回顧研究算是完整，而近年研究則可以參考李盈慧的研究：莊國土，〈論東南亞的華族〉，《世界民族》3 (2002):37-48。李盈慧，〈書寫「東南亞華人」：中國政局下的多重表述〉，《中研院近史所集刊》121（112）：153-190。","陳中和，〈馬來西亞馬哈迪政府之伊斯蘭政策：政教關係角度之分析〉，頁80-85。","承弋瀏，〈《南巫》：作為他者的「神、鬼、人」〉，《中山人文學報》51 (2021.7): 181-187。"],"refs":[],"body":"電影《南巫》自2021年上映以來，已經有多篇影評和研究，這些影評的討論大多圍繞於導演透過劇情對於馬來西亞政治現實的隱喻。然而，卻鮮有從電影中神靈為切入點的討論。筆者看來，電影中吉打當地獨特的神靈與信仰是整部電影的核心。若僅僅將其視作文化背景和歷史敘事的鋪陳，便難以窺見張吉安現實關懷的細微之處，因此本文嘗試以《南巫》中的神靈為討論主體，來詮釋張吉安的思考和關懷。\n\n《南巫》片中出現了許多鬼神，經過筆者整理後，依照先後順序排列出來如下：伯公（福德正神）、地主神、拿督公、田伯爺、珂娘和降頭鬼。其中最具符號意義的神祇莫過於拿督公與珂娘，他們是華人在馬來半島透過信仰的調適，建構自身的認同的體現。\n\n對馬來西亞華人宗教信仰稍有了解的人，都知道拿督公對於馬來西亞華人的重要意義，象徵著華人文化在南洋克里奧爾化（creolization）的路徑。[註1]作為一位馬來形象的神祇，華人在祭祀儀式中所扮演的角色是一種嘗試融入當地的外來者。祭拜拿督公的供品也是以馬來人的飲食喜好為主，通常會有咖喱雞、薑黃飯、kopi o（黑咖啡）和專門用來祭祀的薰香：甘文煙。[註2]至於南洋華人的祭祀系統為何出現這位外族的神靈？李豐楙指出華人文化本身就有透過土地神祇的祭祀來劃定文化界域的觀念。這種「理念性移植」並非從原鄉帶來神明的香火或是靈力，而是一種在漢民族傳統中的土地秩序的擴張。如同臺灣的土地公或是伯公，馬來西亞的拿督公亦顯示了南洋華人在拓展漢族世界觀的一種方式。[註3]《南巫》中，拿督公的界域是在主角家屋外，但主角家中就並非拿督公所轄，而是他們的家神大伯公，即從原鄉帶來的土地神。這種邊界的劃定，除了區分土地所有權外，更深層的是族群想像的界線。華人透過拿督公的祭祀，劃分出他們與馬來人、印度人、暹羅人的不同。而克里奧爾信仰所刻畫的邊界遠遠不止華人與華人族群，更多的是社群與原鄉社群的不同。[註4]\n\n《南巫》中田伯爺信仰。在學界現有的研究中非常少見，是張吉安將採集的田野成果，融入為電影敘事的一環。[註5]據張吉安所述，田伯爺並非華人獨有的神靈，最早出現於暹羅人和馬來人對於稻米神的信仰，更追溯自於二、三世紀馬來半島北部「布殃谷」稻米文明的底蘊。暹、巫二族各有祭祀田伯爺的民俗儀式和神話敘事，在近代田伯爺則成為華人、暹羅人以及華暹混血共同祭祀的對象。\n\n田伯爺的神龕是主角阿昌田邊的一座木材搭建的神棚（Jelapang Padi），祭祀他時的供品有七樣，分別是胭脂、鮮花、稻穗、紗籠布、檳榔荖葉、米漿水粉、鏡子。供品中間插著一把羊指甲（Kuku Kambing），羊指甲是過去農民插秧所用的儀式工具，用來插下播種的第一支秧苗。在播種完後，農民會將羊指甲插在神棚中，直到收成時才取出。田伯爺在電影中是沒有形象的，當有災難即將來臨時，田伯爺會化身成長髮的男子；當為五穀豐收、國泰民安時，田伯爺則會化身成美麗的女子。在電影中，田伯爺的形象是以男子的身份出現，出場時皮影戲配樂的唱詞是歌頌印度教中掌管死亡的神祇閻魔Yama，歌詞之中充滿著警告以及詛咒的意味，暗示著人們若是不避開他，便會遭遇到詛咒。在導演所安排的時空背景中，這個即將發生的災難就是1987年馬哈迪政府所發動第二次白色恐怖「茅草行動」。[註6]\n\n黎明時分，田伯爺在水稻田中舞蹈後，緊接著的下一個片段就是阿安在學校的場景。如同戰後臺灣的國語運動，馬來西亞也曾經歷過統一華人方言的華語運動。電影中，阿安因為在學校說方言，因此被老師以「掛狗牌」的方式懲罰。馬來西亞發起學華語運動的原因除了受新加坡的政策影響之外，本地政治環境的影響才是最為關鍵的因素，政府長期對華人的差別政策，使得華人群體必須更加團結，抗衡以巫統為首的巫裔政府。而語言在此時的馬來西亞，從原本的生活工具轉化為集體認同的符號。\n\n馬來西亞獨立後，民族國家的意義至今仍為定義完善。當代馬來西亞所追尋的究竟是以馬來人文化為主的民族國家，還是多元種族共構的移民國家？儘管後者的論述是馬國華人、印度人所期待的，但回顧馬來西亞的政治史。以馬來人為強勢的政府長期將國族敘事推向以馬來文化、伊斯蘭為優先的論述。1970年代，伊斯蘭復興運動席捲穆斯林世界，馬來西亞也受到影響。1980年代後的馬來領導者，逐漸將馬來西亞定位為伊斯蘭國家。華人面對這樣的處境，除了透過非官方的共通語言「華語」建構族群的凝聚力，更將宗教提升為文化識別符號，以此為自己的認同發聲。這演變出一個棘手的問題，當我們討論馬來西亞的華人認同時，究竟要將他們放在什麼脈絡討論？是家鄉還是千里外的原鄉？[註7]\n\n田伯爺的死亡意象不只於符號意義上的厄運，他更是當地管理亡者的死神。在片中，阿南的招魂隊伍一路將燈燭排列到田伯爺的神龕旁，而阿南的母親Kaew姨在此呼喚阿南的亡魂回來。果然在儀式後的深夜，斷頭的阿南重新出現在神龕旁，Kaew姨感應到後便過去和兒子重逢，相擁而泣。在華人的傳統中，亦有一說。人在死亡後，靈魂會不知去處地隨處遊蕩。一直飄泊到第六天，住家境內的土地公會引導亡靈，帶其去「洗手」，也就是讓亡魂知道自己已經死亡，並且在第七日帶亡魂返家。[註8]\n\n電影中的招魂儀式，Kaew姨作為乩身，透過靈附來演出皮影戲，以戲劇來完成兒子的招魂儀軌。其皮影戲音樂具有其寓意，Kaew姨招魂的歌詞內容是印度教《摩訶婆羅多》中的故事，內容大致是天神對他的兒子Surya的讚頌，這些讚詞歌頌Surya飛越七重天，並且與他的仙女妻子們團聚。Surya作為太陽神，最為知名的故事是和人間公主貢帝生下孩子，貢帝的丈夫無法生育，因此她便過向敝衣仙人學習到的咒術，召喚了Surya，在保持貞節的條件下，產下了半人半神的兒子Kramer。張吉安安排此段音樂於此，莫過於要刻化出Kaew姨希望阿南得以「重生」的渴望。Kaew姨便是以皮影戲為媒介，透過咒術使自己的兒子得以重生。\n\n而本片政治隱喻最為鮮明的角色，莫過於象嶼山的山神珂娘。在片中，珂娘的背景是一位泉州的公主。熟知閩南民間信仰的人對於「公主」這個詞彙就會有一定的敏感度。被供奉為公主的神祇很多都是陰神，尤其是客死異地的單身女性。這個案例在臺灣或是泰國的案例看到。在臺灣南部有一座八寶公主廟，這個公主的來歷便是因船難漂流到恆春，被排灣族人出草殺害的歐洲女子。[註9]而在有一座林姑娘廟，與珂娘同樣，都是作為當地華人信仰的主神，相傳祂的來歷是海盜林道乾的妹妹，遠赴南洋尋親無果，便上吊自殺。[註10]由這些案例以及電影中的傳說來推測，珂娘應該是屬於「孤娘信仰」的一種，以一種含怨的形式被人供奉著。[註11]有趣的是孤娘成為了象嶼山當地的守護神，筆者推測他是當地聚落的境主神。\n\n作為一位被困於當地的「泉州公主」，珂娘的形象可視作華人對原鄉想像的具象化。從中國歷史的脈絡來看，泉州本身並非皇室政治中心，亦鮮少作為皇室成員。這個設定，可能源自華人對原鄉的整體想像，並且被投射到可以辨識的地名與身分之上，形成歷史與符號層次混雜交錯的敘事結構。正是因為這種想像機制，泉州被賦予了虛幻的歷史身份。珂娘神話成為了維繫華人與原鄉的情感連結。\n\n珂娘在片尾說他永遠無法回到他的老家，原因會是什麼？可能是因為「老家」早已不存在。在下南洋的歷史脈絡中，十六世紀以來的數波移民潮，讓南洋華人這個族群產生出獨特的自我認同。閩南語中有一個詞叫做「過番」，是指到外族之地（尤其是南洋）討生活的移居行動。[註12]在閩粵一帶，當地人會將旅外的華僑稱為「番仔」，儘管他們知道在文化和語言上這群離鄉的人和自身有共同記憶，但出了帝國的疆界後，這群便被視為捨棄了原有的身份，烙印上一個象徵異文化的符號。明、清兩代的海禁政策之下，過番討生活的人多是偷渡出境者，被視為背叛國家，若是回國便會遭到判刑。在傳統中國的疆域觀念中，南洋華人始終是一群不受到認同與接納的「他者」，但這群人在面對與外族共同生存、競爭之下，卻極力想要保留自身的語言與文化，這便是珂娘所說掙扎的「邊界」，他永遠回不到他的老家，也永遠無法成為當地人，當地的居民準備馬來供品祭祀祂，祂卻在山洞向阿燕述說他並非外族的無奈。[註13]\n\n電影中，主角阿燕三次的求神經歷，也都各有隱喻。阿燕本身不信宗教以及傳統的民間信仰，但因為丈夫阿昌被下降頭，求醫無法的她只能選擇透過靈界的方式來解決。阿燕最先是求助拿督公，透過拿督公的扶乩，得知丈夫因為在山邊小便，得罪了珂娘，才受到懲罰。拿督公給她一袋符水，交代她返家讓丈夫服用。不過，阿燕因為對符水有衛生疑慮，因此打算煮滾再讓丈夫服下。不料，符水讓粗心的阿燕燒乾了。\n\n象嶼山是第二次的求神。阿燕在拿督公的諭示之下，到象嶼山向珂娘賠罪。她帶了供品到山洞內祭拜，但珂娘只是向他吐苦水，並沒有直接解決阿燕的問題。這裡暗藏了伏筆，一直到結尾，阿燕的祈願才被回應：珂娘直接現身幫阿燕處理掉降頭。在第二次求神後，阿昌身上的降頭非但沒有解決，反而身體的狀況更加嚴重。\n\n在經歷過種種磨難之後，阿燕終於才放下自身對於理性科學的執著，以謙卑的身段向馬來巫師伯Tam尋求幫助，而伯Tam因為官方所倡導的伊斯蘭政策，已經決定不再使用傳統的馬來巫術。但在阿燕苦苦的請求之下，他決定最後一次使用巫術，並且在儀式結束後，將法器全數交予阿燕，從此之後就收山。\n\n若把阿燕的性格投射到馬來西亞華人的糾結之上，這三次求神便可以被視為張吉安對於歷史的解釋，這些行動揭示了過去華人面對本地族群時，應對和調適的方法。前文說到，拿督公在本片中是馬來族群的象徵，同時也象徵著巫統所代表的馬來人至上主義。第一次向拿督公的問卜，隱喻華人在馬來西亞獨立前後，嘗試以通過漢文化本土化的觀點建構一個多元族群國家。\n\n馬來西亞在1954年爭取獨立時，由三個政黨聯合向英國談判。分別是第一任首相東姑．阿布拉都曼所領導代表馬來人的巫統、代表華人的馬華工會以及代表印度人的國大黨。[註14]不過，1980年代後，巫統的政策越發偏向以馬來人的利益為優先考量。因此在扶乩的過程，張吉安所飾演的拿督公才會質問阿燕兩個問題：一是為何不拜拿督公，二是為何不説馬來語。這兩個問題直指馬來西亞社會最敏感的問題，也就是國族意識的巫化（馬來化）。戰後馬來西亞的華人面對的兩個身份認同，一是華人，另一是僑胞。這兩個認同背後的支撐勢力都是新興的民族認同。一是東南亞伊斯蘭世界的馬來文化，另一是中華民國或中華人民共和國的中華文化。這讓南洋華人不得不在國族和種族的拉扯之間，發展出靈活的協調能力。[註15]\n\n馬來語作為國語，是馬來西亞的公立教育機構所使用的官方語言。然而，在戰前南洋就已經出現許多華人所開設的私塾以及教育機構，而承襲這個體系，戰後馬來西亞華人將這些機構轉型成中小學，成為私立的獨立學校。片中所影射的白色恐怖事件「茅草行動」的導火縣就是如此，教育部長安華將四名不諳華語的教員派駐到華語學校擔任高職，引起華人的不滿。事實上，這是透過政府的公權力，從事文化侵略的方式。拿督公扶乩的劇情，便是投射著阿燕所象徵的華人嘗試和馬來人溝通，進而解決當時種族的政治矛盾。遺憾的是，協調之下的結果華人並不滿意。這造成電影劇情中的下一個隱喻：珂娘。\n\n珂娘所代表的是華人對原鄉牽掛的終極投射，在華巫之間的矛盾漸深的發展之下，華人對於族群歸屬感的認同一方面尋求在國家框架下的在地化，另一方面卻需要一個文化識別上的依歸。這樣的情節下，中國民國和中華人民共和國這兩個代表中國話語權的政權就成為了他們的投靠。在國家政策的偏袒之下，高等教育的福利和機會大多由馬來人取得，大批的華人學生就選擇到異地就讀大學。當時中華民國的僑務委員會積極透過提供僑胞的各類福利和權利，用以作為打擊共產中國的手段。\n\n「華僑」一詞在戰前作為國民政府抗日的精神象徵，南洋華人移民最多之處，則是海外民族主義之代表。戰後在土著政府的同化壓力之下，馬來西亞華人許多選擇到臺灣延續他們華文教育。這使得電影中的珂娘扮演著一種原鄉認同，也就是馬來西亞華人所寄望的中華民國政府，或是中華人民共和國政府。在珂娘的怨嘆投射出華人對於馬來政府的不諒解，她不希望人們用紗籠、檳榔荖葉來供奉她，只因她不是土著，映照出當時馬來至上主義（Ketuanan Melayu）的影子。這樣的政策顯然未能奏效，華人的語言、文化、商業優勢與學校體系仍被完整保留下來。[註16]相較之下，馬來西亞的鄰國印尼，經歷了血腥的排華運動，並配合對華人文化與語言的全面禁絕政策，則顯然取得了效果。[註17]其他東南亞國家，同樣發生了政府主導的排華慘案，亦或是文化和語言上的閹割。這使得馬來西亞成為當今南洋華人的文化中心。\n\n透過比較可以看到拿督公象徵著馬來政府，而珂娘象徵著中國政權。無論是中華民國或中華人民共和國。馬來人作為土著政府，具有政治上的優勢地位，試圖透過政策來同化華人，在劇中以拿督扶乩時的威嚴和憤怒來刻劃：珂娘對於家鄉的想像，則是以哀怨和不甘的心理狀態來呈現。\n\n如果進一步討論，從更具有時間性的歷史視角，可以有下一層面的解釋。若不將拿督公視為馬來人的象徵，而是前文所提到華人克里奧爾化的歷程，拿督公便成為南洋第一波移民潮的書寫。從十六世紀開始到十九世紀中葉這個時段。在民族國家意識以及伊斯蘭復興主義未在馬來半島發芽前，華人和馬來人共存的生態中，衝突和矛盾並沒有當代嚴重。這時候華、巫通婚也較為普遍，峇峇娘惹（Baba Nyonya）或是Peranakan大多在此時開始出現。這時段的移民群體被稱為土生華人，從閩南語的詞彙來說被稱為「土生仔」，這群華人大多為從事貿易的商人，和馬來人之間相比於競爭關係，更多地反而是貿易、婚姻關係，他們也大多容易融入當地的文化。\n\n十九世紀開始第二波因應英國殖民政府的開發需求，加上中國內部的人口壓力、天災人禍。大量的華人移民至南洋討生活，大多從事勞力工作，包括開採錫礦、種植熱帶植物等，這群華工被稱為「新客」（sengkek）。\n\n二十世紀開始的第三波移民，同為「新客」，但這批移民中有許多人並非成為廉價的勞動力，而是因為看準當時的商業機會而下南洋打拼。當時候馬來西亞的產業結構已經發生根本性的變化，除了基礎的勞動工作大量被華人取代之外，英國人更開放許多商業權利給華人，使得馬來人的生存空間受到擠壓，埋下未來族群矛盾的伏筆。珂娘之於拿督公，就像新客之於土生華人，在心裡狀態之上，這兩個族群呈現著具有微妙的認同差異，後者相比於前者，更加能夠融入當地文化。[註18]\n\n那阿燕第三次去求助伯Tam象徵著什麼呢？先論第一層暗示，這顯然是張吉安在述說近代馬來西亞伊斯蘭政策的歷史，1980年代開始馬哈迪政府所推動的伊斯蘭復興主義，禁止了馬來人一切的偶像崇拜以及民俗信仰。自12世紀開始多位馬來蘇丹皈依後，經過幾世紀的時間大部分都馬來人都成為了穆斯林，但馬來半島上本身存在的泛靈信仰始終和伊斯蘭信仰共存。直到這時，這些過去習以為常的傳統忽然間被禁止，使得馬來人的底層文化逐漸消失。[註19]\n\n伯Tam將法器託付給阿燕就是象徵著這些文化只能由其他族群接手，現實中最為知名的案例便是拿督公的科拉邁信仰，儘管其中許多神靈都是原本馬來人的信仰對象，現今卻只有華人在祭祀。第二層暗示則是，不論是土生華人還是新客，華人在馬來西亞獨立後，都在積極尋找與政府對話的空間，但似乎一直得不到合理的回應，長期下來只能在彆扭的地位下生活著。阿燕便是如此，在多次尋醫求神未果之下，原先不相信神靈的她，實在毫無辦法，只能與「巫」共存。\n\n張吉安在一次訪談中，談到片名中「巫」的意義並非只是指巫術，同時象徵著巫統。華人的處境就如同阿燕一樣無助，儘管嘗試了多種方式，仍然難以解掉丈夫阿昌身上的降頭。最後是珂娘帶阿燕出海，將其沉入海底封印。\n\n至於降頭鬼所象徵的意涵，便是國族創傷的具現化。影片中的拿督公持馬來短劍（Kris）刺穿草人的意涵便是如此，這隱喻著茅草行動時，當納吉所領導巫統青年團所提出的口號「用華人的血洗馬來短劍」。而這個降頭至今一直是馬來西亞不可提起的禁忌，同時也是華人的陰影。若是提起此事，容易被貼上分裂族群的標籤，因此在當下的馬來西亞的政治環境中，想要進行轉型正義並非一件容易的事。珂娘才會告訴阿燕「千萬不可回頭」，暗示著此事成為一個難以解開的結，國家的傷口只會隨著時間沖淡疼痛，而始終沒有結痂痊癒的一日。[註20]這流溢著片中所說「邊界」的意象，片中充斥著許多邊界。從現實世界來看，故事背景吉打的象嶼山是馬來半島的最北方，是與泰國的交界。阿燕的娘家柔佛新山則是馬來西亞的最南方，是與新加坡的交界。\n\n從馬來西亞的地理來觀察，出身吉打（馬來半島國境之北）的阿昌對於信仰傳統的堅持，體現在他對拿督公和田伯爺的敬畏。吉打是人類和神靈共居的土地，同時也是人類和傳統的邊界，象嶼山的人生活在這個由傳統秩序規範的界域之中。相比之下，阿燕對於科學理性的追求則是受新加坡影響，新加坡講求理性、現實和科學，這類務實、功利的精神間接影響了一旁的新山（馬來西亞國境之南），這是人類與現代性的邊界。十八世紀末以來，受西方殖民現代性的影響，馬來半島上的人們在傳統與現代之間生存，始終免不了在兩個端點之間游移。阿燕和阿昌便是這兩個端點，在電影中，張吉安透過劇情的安排，以阿燕子為媒介，述說著邊界在二十世紀中葉所產生的流動漂浮。對邊界上人們掙扎與調適的描寫，來自張吉安最真實的生命觀察，並最終在片尾化為一句致謝：獻給邊界上的父母\n\n《南巫》以鬼神信仰作為敘事隱喻，緩慢而陰鬱地鋪陳馬來西亞華人身分認同的困境。在族群矛盾與制度壓迫交織之下，華人既無法真正成為當地主體文化的一部分，也早已失去返回想像中原鄉的可能。片中反覆出現的「邊界」，既是族群與國家的界線，也是傳統、現代性與歷史記憶相互牽制的場域。邊界不只區隔，也不斷滲透，讓人始終處於介於融入與排除之間的懸浮狀態。其實電影並未回答問題最終如何被解決，而是完成了一項階段性的工作：將那些被遺忘，或被假裝遺忘的魂魄招回。影片所留下的不是答案，而是揭開一個清楚卻無法迴避的現實：身分認同的邊界無法消失，族群的傷口也尚未癒合。這段歷史被穿刺在拿督公的馬來短劍上，緩緩沉入深海，成為被時間與國家遺忘的存在。\n\n---\n\n*附記：本文原為「宗教靈性與電影」課程報告，2025年1月18日初稿，2026年1月3日修訂。*\n\n"},{"title":"東京散策（トンキン散策）","subtitle":"","author":"","cat":"life","date":"2026-04-24","slug":"tonkin-sanpo","source":"","notes":[],"refs":[],"body":"「東京」（Tonkin）是河內的古稱，也是法國人對於河內通用的稱呼，這個名字一直延續到1945年法國結束殖民統治後，才被更改。相比於日本江戶的東京，河內自七世紀以來就使用東京，早了江戶一千多年。「散策」在日語中指悠閒漫步、閑晃的意思，近來日本旅行者流行以「散策」來紀錄他們的旅程，因此我也詼諧地以「東京散策」來書寫我在河內十天所看到的種種。\n\n> 河內對外地人具有一種特殊的吸引力。在遙遠村落的深巷盡頭，或在山林深處的密林裡，黃昏時分，仍有許多人朝著某一個方向凝望，努力想看見河內的燈光映照在雲層上的微微亮色。為了那些嚮往京城的人，也為了居住在河內的人，我們應當鼓勵彼此更加熱愛河內，談論河內一切獨特的地方，讓三十六街坊中的每一個變化，都能在各處激起回聲。\n>\n> ——石嵐，《河內三十六條街》1944\n\n如同二十世紀中期河內文學家石嵐所說，河內對於外地人而言，是有一種無法抗拒的吸引力。作為本地人，他以富有鄉情的視角透視這座千年京城的情感紋理。不過，石嵐之所以厲害，是他還敏銳地捕捉到了旅人的感受，她發現外地人同樣在盡力捕捉對河內的記憶以及文學性的想像。作為一位北方島嶼來的旅客，我想像若是這位英年早逝的才女還在世（根本不可能），他會發現河內變得十分不同，他或許會厭惡、會失落。不過，作為一位北方來的異鄉客，我會告訴她在眩人耳目的霓虹燈招牌和擾人的喇趴聲下，仔細地去觀察，仍然能清楚聽到聖若瑟座堂中的鐘聲，始終迴盪昇龍城的回音。\n\n造訪河內，也是我初次到越南。若要問我對於對越南感受是什麼，只能説這座城市如同在美術館所看見法屬時期越南畫家印象派的畫作一般，河內是一座無法以寫實風來描繪的一座古城，他交錯著越南、中華和法蘭西的意象，並且這些元素都很自然地在充滿柚香的空氣中雜揉。會稱為古城除了他真的很老之外，我總覺得無論多新的事物，彷彿一定會被昇龍或是法殖時期的記憶，刷上一層仿古色調。\n\n一到河內機場，刺鼻的焦味和粉塵的顆粒感隨即竄入鼻竅。早聞河內的空氣品質是世界第一差，但真正經過機場通往城區的日新大橋，還是被霧濛濛的城景所震撼。究竟是多少的人、多少的煙火才能讓城市染上這一層厚重的簾幕，後來我發現這並不是簾幕，我早已身處其中。頭一天晚上到河內，這座城市讓我顯得十分不安。惡劣的空氣、施工的粉塵、人煙稀少的街弄，讓我有些失望。我無法想像十天之後我竟會對這座城市產生巨大的戀慕。\n\n由於到了住處已晚，在河內的第一餐，我和Ko只是在住所附近的poke草草了事。隔日一早起床，我和旅伴便前往老城區探索。老城區是河內自古以來的商業區，自李朝遷都昇龍以來，便是萬商雲集之地。十七世紀已降，由於中國商人的進入（主要來自閩粵二省），使得這裏的貿易達到鼎盛，法屬時期又有印度和法國商人進入，是當時亞洲最為繁榮的城市之一。老城區古稱三十六坊，保存了出自《周禮》的街坊制度。便是以皇城為中心，將市集向左右兩邊擴展的設計。若以昇龍皇城的座標，其實當前的老城區只保留了一半的街坊。老城區的街坊中儘管在觀光化之下，過去安排有序的街道分工，已經些許交錯，不過主要仍然可以看見當地居民的專業化分工，毎條街道都販售著不同的商品\n\n在老城區的第一餐，我們找了一間網路評價甚高的素食餐廳。分別點了河粉、番茄米線、春捲和香腸。在微冷的早晨，望著梧桐、洋樓和摩托車交錯的街景，吃一碗溫熱的河粉，無疑是人生最為享受的事。\n\n河粉作為世界對越南的第一印象，其實成為國菜是相當晚近的事。越南史家武紅蓮指出，河粉是法屬時期出現於北越的產物，有兩派說法，一是當時小販挑著扁擔賣給熬夜執勤法國衛兵的早餐．二則是受到法餐的食牛文化影響，發展出來的越南飲食而大家所熟知的牛肉河粉，則是法國殖民所帶來的產物。受中國文化影響，以農業為主的越南，本身其實並不食牛肉．在法國人帶入食牛文化後，這種肉類才大為流行。\n\n不同於臺灣常吃到會加九層塔、檸檬的南越河粉，北越河粉的口味較為清淡，以牛肉為主。通常就只有蔥和香菜作為佐料，湯頭也以清淡甘甜為主。（武紅蓮，越南美食史第六章）\n\n\n\n![煎杏鮑菇河粉](/assets/uploads/posts/tonkin/01.jpg)\n\n\n\n> **店家**：Chayfood\n\n> **地址**：66 P. Nguyễn Hữu Huân, Hàng Bạc, Hoàn Kiếm, Hà Nội\n\n對於這趟旅程的想像和設定，我們以看廟為優先，因此並沒有像大多數人一樣，安排到鄰近的下龍灣或是寧平去看自然風景。而是完全深入這一座城市。這趟旅行的探索藍圖，主要是以昇龍城的範圍為主，我參考了阮朝的文獻《河城靈跡古錄》中所描繪的四鎭祠，作為主要的活動範圍。這四座廟分別鎮守皇城的四方，四方之內也是皇城居民主要的活動範圍。\n\n\n\n![河內古地圖](/assets/uploads/posts/tonkin/02.jpg)\n\n\n\n我們首先參訪了鎮守東方的白馬祠。白馬祠興建於九世紀，主祀龍肚神。龍肚是河內本土的神祇，據說在唐朝時，十世紀，丁部領率軍平亂之際，曾至大羅城東之白馬祠祈禱神明庇佑國家，隨後便成功平定十二使君之亂。統一天下，丁皇夜夢一神自稱白馬神，告曰：「臣奉皇天之命，隨陛下征討群敵。如今天下已定，而陛下尚未行報謝之禮，實非禮制。」帝醒後，知其神靈顯赫，遂賜美號，命民眾於皇后楊氏月之故里另建白馬神祠以奉祀，名為靈郎白馬神祠。\n\n另一個傳說是李朝開國君主李公蘊定都昇龍城後，城牆屢次崩塌。他便到白馬祠祭拜龍肚神，祭拜之際，白馬祠衝出一隻白馬，並且循著昇龍留下了足跡，李公蘊於是在白馬留下的足跡上建築城牆，城牆便堅固屹立。李公蘊經歷神跡顯現後，便將龍肚封為昇龍的城隍。因此在白馬祀中，還可以見到供奉白馬的雕像。\n\n\n\n![白馬祠的白馬神像](/assets/uploads/posts/tonkin/03.jpg)\n\n\n\n白馬祠一旁，就是知名的粵東會館。當代代河內不同於西貢，唐人街已經沒有居住華人。在1970年代的排華政策之下，大多的華人皆已經離開河內。然而，早期華人的足跡卻仍然保存完善。越南的華人族群複雜，有明末因政權更替而移民的明鄉人，以及清代因商業貿易移居的清人。兩者雖然都是華人，不過族群認同卻不一樣。位於老城區的華人，主要是在黎朝後期遷入。雖然早期有明鄉人和清人之分，不過到了近代，其實已經看不見兩者的差異與痕跡，除了籍貫之外，早已混居。\n\n在阮朝的《大南一統志》中就記載河內唐人街的樣貌：\n\n> 河口庯，在壽昌縣地，商戶清人問處，列賣書籍、北貨、藥材，亦名行帆。\n>\n> 粵東庯，明鄉客戶舊處新居，殖貨居其之所。\n>\n> 福建庯，列賣銅器\n\n老城區的華人街，主要有兩條，一條是粵人聚居的行帆街，早期主要販售帆布。一條則是閩人聚居的懶翁街，法國時期稱為福建街（），早期主要販售藥材。\n\n從建築上來看，粵東會館的規模較福建會館的規模大得多，反映了廣東人在分佈上的優勢。按華人的移民分佈來看，十七世紀以來河內的商業貿易以廣府人以及潮州人為多，福建人較少。研究顯示，潮州商人主要販售\n\n目前的粵東會館已經被改造為展覽館的形式，裡頭展出各種現代的藝術品。不過，若是細心繞到後面的兩個院落，可以發現，這裏奉祀著粵人的海神媽祖，一旁還有千順將軍的神像。在神壇的一旁，有重修會館的碑文，從碑文的姓氏來判斷，粵東會館應是同時有潮州與廣府的商號。碑文上的保存狀態並不好，受到越戰的破壞，上面還卡著一顆戰爭時所留下的子彈。不起眼的碑文中，道出河內華人百年的心酸史，從十七世紀的華人移民，到越戰，一直到越共建國後華人的驅除。\n\n粵東會館曾經是孫文流亡越南的根據地，據傳他在此處規劃了黃花崗起義以及惠州起義，並且結識了越南的維新義士潘佩珠，在東亞近代的政治史中，粵東會館的歷史若是詳細爬梳似乎足夠牽起了日、中、越各國維新義士的網絡。\n\n\n\n![充滿彈孔的石碑](/assets/uploads/posts/tonkin/04.jpg)\n\n\n\n\n\n離開粵東會館，我們繞到了胡志明故居。這次的旅程並沒有進入胡志明廟以及其在皇城的故居，反倒是在逛老城區時參觀了他起草《獨立宣言》時的居所。這棟房子原先屬於河內鉅富鄭文寶，鄭氏出生於商業世家，具有橫跨歐亞的商業網絡，同時他也是一名愛國商人，捐贈了大筆的財富支持胡志明的革命事業，在晚年更把居所捐予政府。這棟房子不寬，但倒是非常的長。通風順暢、採光良好，並且有精緻的傢俱和庭院造景。二樓保留了胡氏起草獨立宣言的房間，三樓祭祀著胡志明靈位，以及政府開會議事和鄭氏夫妻的生活。良好的採光以及越法折衷的長樓建築十分吸引我，在逛完整棟樓以後，我和旅伴說道：「要是我有一棟這樣的樓，我就滿足了」\n\n\n\n![胡志明起草獨立宣言的房間](/assets/uploads/posts/tonkin/05.jpg)\n\n\n\n\n\n![祭祀胡志明的神壇](/assets/uploads/posts/tonkin/06.jpg)\n\n\n\n作為閩人後裔，上回旅遊檳城時我曾打趣說道：「我們華人下南洋第一件事就是找會館」。不過說來慚愧，福建會館卻是當天的最後一個景點。福建會館位於懶翁街，建立於1815年，規模明顯小於粵東會館。這裏不需門票。會館前庭有一個亭子，類似於鹿港龍山寺的風格，藻井十分漂亮。內部同樣供奉海神媽祖，其千順將軍的造像也和臺灣更為相似。會館的另一側則供奉三官大地。當我正興起拍照時，顧廟門的阿伯跑來阻止我，因此在這裏我沒有留下太多的照片。\n\n根據一旁相片的記載，福建會館除了商貿社交的功用之外，本身還有學校的功能。早期福建人將子女送到這邊接受華人教育。越南排華後，福建會館原本的學校，曾經被改為紅河學校。直至近年，才又改回古蹟來保存。\n\n按重修福建會館的捐題錄可以發現福建會館中的族群型態，儘管有少數的福州人，不過會館成員主要仍是以閩南為主，財力也遠超福州人。祖籍地以同安為最多，晉江則最為富有。\n\n繞出福建會館，我們嘗試了在地人的路邊小攤。不同於早上是賣觀光客的精緻餐廳。這間店是當地人最尋常的美食。\n\n我在英文菜單上，糊里糊塗地點到了河內最知名的烤肉米線，旅伴則同樣點了番茄米線。並且我們吃到了我吃過最好吃的越南麵包。\n\n烤肉米線是河內的特色,不同於湯米線，他是清爽的沾麵。原始的版本是將烤豬肉和肉丸浸泡在沾醬中，再以一小團一小團的米線沾著吃，並且會搭配生菜、紫蘇和薄荷。素食的版本我則是吃到類似豆包的素肉丸。我十分喜愛這道菜，一是本身就喜歡米線有嚼勁且彈牙的口感，二是不同於葷食的魚露帶有厚重的腥味，素食沾醬酸甜清爽契合我的口味。\n\n同時我們叫了兩條七塊錢的粉卷，臺灣越南餐廳賣的春捲通常是用米紙所包的腩卷。粉卷的外層則是腸粉，相較於口感較硬的米紙，我更中意粉卷扎實的勁道。越南麵包酥脆的外皮包裹清脆的生菜、酸甜的越氏泡菜以及素火腿，讓我馬上就嗑了一個，原本還想説兩人分著吃，後來都加點了。\n\n\n\n![烤肉米線與粉卷](/assets/uploads/posts/tonkin/07.jpg)\n\n\n\n> **店家**：CHAY TÂM KHỞI\n\n> **地址**：70 Hàng Điếu, Phố cổ Hà Nội, Hoàn Kiếm, Hà Nội\n"},{"title":"伍廷芳及其素食思想析論：衛生、養生與修身","subtitle":"收錄於《史轍》第十七期","author":"許原綸","cat":"academic","date":"2026-07-27","slug":"wu-tingfang-vegetarianism","source":"","notes":["伍廷芳，字文爵，號秩庸，廣東新會人，1842年生於南洋海峽殖民地（一說新加坡，一說麻六甲）。清末民初的知名外交家與改革派人物。早年於香港學習英文與法律，後赴英國倫敦大學留學，取得法學博士學位，並成為中國第一位具有律師資格者。學成歸國伍氏歷任香港律師、李鴻章幕僚、中國鐵路公司總辦等職，後受清廷派任駐美、西、秘魯等國公使。1910年，伍廷芳藉病辭官，退居上海。辛亥革命後任臨時政府外交代表，主持南北議和，後轉任司法總長。袁世凱死後出任段祺瑞內閣外交總長，1917年短暫代理國務總理。護法運動時赴廣州任外交、財政部長，並一度代理非常大總統。1922年任廣東省長時，卒於廣州。","梁其姿演講、于穎整理，〈「素食中國」在民國時期的兩個意義〉，《豆瓣小組》，2021年10月5日，豆瓣，<https://www.douban.com/group/topic/248887935/?_i=91330769vVa92l>，檢索日期：2026年2月23日。此文為梁其姿於2016年7月29日在復旦大學演講之摘要。","Angela Ki Che Leung, “To Build or to Transform Vegetarian China: Two Republican Projects,” in *Moral Foods*, ed. Leung Angela Ki Che, et al. (Honolulu: University of Hawaii Press, 2019), pp. 221-240.","長與專齋（1838-1902），日本明治時期醫學官僚。早年於長崎學習蘭學。明治維新後，擔任文部省醫務行政職務。1871年，隨岩倉使節團出使歐美，於歐洲考察醫療與公共衛生體系。返國後任文部省醫務局長，兼東京醫學校校長，創設東京司藥場。又出任首任衛生局長、元老院議官、貴族院勅選議員等職，為日本近代公共衛生制度的奠基者。R. Rogaski, *Hygienic Modernity: Meanings of Health and Disease in Treaty Port China* (Berkeley: University of California Press, 2004), pp. 136-144.","R. Rogaski, *Hygienic Modernity: Meanings of Health and Disease in Treaty Port China*, pp. 20-21.","John Kieschnick,“Buddhist Vegetarianism in China,” in *Of Tripod and Palate: Food, Politics, and Religion in Traditional China,* ed. Roel Sterckx (New York: Springer, 2005), pp. 186-212.","Chün-fang Yü, “Syncretism in Action: Morality Books and The Record of Self- knowledge”*The Renewal of Buddhism in China: Zhuhong and the Late Ming Synthesis* (New York: Columbia University Press, 2020), pp. 106-139.","高明芳，〈豐子愷與《護生畫集》的編繪〉，《國史館學術集刊》13（臺北，2007.9），頁209-239。","Shuk-wah Poon, “Buddhist Activism and Animal Protection in Republican China,” in *Volume Iii Key Concepts in Practice*, ed. R. Katz Paul and Travagnin Stefania (Berlin, Boston: De Gruyter, 2019), pp. 91-112；范純武，〈清末民初女詞人呂碧城與國際蔬食運動〉，《清史研究》2（北京，2010.5），頁105-113。","Nikolas Broy, “Moral Integration or Social Segregation? Vegetarianism and Vegetarian Religious Communities in Chinese Religious Life,” in *Volume Iii Key Concepts in Practice*, ed. R. Katz Paul and Travagnin Stefania (Berlin, Boston: De Gruyter, 2019), pp. 37-64；師復，〈素食主義淺説〉，《民聲》（廣州），1914年4月25日，第7張1-4頁。","丁賢俊、喻作鳳，《伍廷芳評傳》（北京：人民出版社，2005），頁257。","李石曾（1881-1973），原名煜瀛，字石僧，河北高陽人，著名政治家、教育家、文物學家，為故宮博物院首任院長，亦列國民黨四大元老之一。其長期提倡素食主義，1909年在巴黎創辦中國豆腐公司，並與吳稚暉、張靜江、蔡元培等人推動勤工儉學運動、進德會等社會運動。","黃秀伯，本名黃慧中，生卒年不詳。實業家黃思永之子，光緒年間任秘魯嘉里約領事，曾與伍廷芳出使美國華盛頓。","楊愷齡，《民國李石曾先生煜瀛年譜》（臺北：臺灣商務印書館，1980），頁20-21。","楊愷齡，《民國李石曾先生煜瀛年譜》，頁24。","〈醫事新聞：慎食衛生會〉，《中西醫學報》（上海），1910年，第3張。","〈紀慎食衛生會開議事〉，《紹興醫藥學報》（紹興），1910年，第23期 ;〈慎食衛生會章程〉，《申報》（上海），1910年10月2日，第2張。","〈慎食衛生會章程〉，第2張。","楊愷齡，《民國李石曾先生煜瀛年譜》，頁23。","Leung, “To Build or to Transform Vegetarian China: Two Republican Projects,” p. 224.","李煜瀛，《李石曾先生文集（上冊）》（臺北：中國國民黨黨史委員會，1980），頁266-270。","傅家倩著，羅亞琪譯，《豆漿：小小的豆子如何成為近代中國救亡圖存的靈丹妙藥》（臺北：畢方文化，2025），頁64-69。","傅家倩著，羅亞琪譯，《豆漿：小小的豆子如何成為近代中國救亡圖存的靈丹妙藥》，頁154-182。","Mary Foote Henderson（1842-1931），美國社會改革者與作家，國會議員John B. Henderson之妻。早年以小說創作出名，後投入素食、禁菸酒和衛生改革運動。著有*Diet for the Sick, Diet for the Well, The Aristocracy of Health, Substitutes for Flesh Foods*等書。","Tingfang Wu, *America, through the Spectacles of an Oriental Diplomat* (New York: Frederick A. Stokes Company, 1914), pp. 117-118.","Mary Foote Henderson, *The Aristocracy of Health: A Study of Physical Culture, Our Favorite Poisons, and a National and International League for the Advancement of Physical Culture* (Colton, 1904), pp. 635-718.此書談到素食和少食的篇幅主要集中於以下幾章：Comparative Strength–giving Qualities of Animal and Vegetable Foods, Dr. Kellogg's Dietary, The Influence of a Meat Diet on Mental Activity, The Relation of Meat–eating to a Craving for Stimulant, Eating too Much and too Often。另外，值得注意的是The Obligation of Kindness to Animals一章在談素食的動物保護意義。伍廷芳的《延壽新法》中對於素食理由的分類亦有提及，伍氏的架構可能參考亨德森之作。","John Harvey Kellogg (1852-1943)，美國醫師與社會改革者，長期主持巴特克里克療養院，提倡素食、禁菸酒與自然療法，同時亦為家樂氏早餐玉米片的發明者之一。著有*The Home Handbook of Domestic Hygiene and Rational Medicine*, *The Natural Diet of Man*, *Plain Facts for Old and Young*等書。","Wu, *America, through the Spectacles of an Oriental Diplomat*, pp. 149-150.此章寫道“he told me that he worked sixteen hours daily without the least fatigue”由此推測兩人應該相識。","Wu, *America, through the Spectacles of an Oriental Diplomat*, p. 115.","伍廷芳，《伍廷芳證道學說》（上海：上海證道學會，1923），頁34-35。","伍廷芳，《伍廷芳證道學說》，頁35。","李煜瀛，《李石曾先生文集（上冊）》，頁265-266。","李煜瀛，〈論大豆工藝為中國製造之特長〉，《申報》（上海），1910年3月18日，第18張。","李煜瀛，《李石曾先生文集（上冊）》，頁271。","李煜瀛，《李石曾先生文集（下冊）》（臺北：中國國民黨黨史委員會，1980），頁177。","李煜瀛，《李石曾先生文集（下冊）》，頁94-97。","伍廷芳，《延壽新法》（上海：商務印書館，1916），頁 道、李石曾（1881-1973）強調黃豆的營養價值、孫中山（1866-1925）認為蔬食有助於調理身體，皆是以「衛生」為由論之。[註3]\n\n「衛生」一詞在中國古代文獻中早已出現，不過在近代以前，「衛生」的意義更多是意味著「保衛生命」的日常養生之道，而非具有公共性的身體治理。具有西方意義的「衛生」一詞則是由日本人所創。十九世紀末，日本醫療官員長與專齋（1838-1902）以《莊子》中的「衛生」一詞翻譯德文Hygiene，並將此譯語傳回中國。[註4]Rogaski指出，「衛生」一詞在中國社會逐漸流行之後，其定義並未形成明確界線，內涵多元而鬆散。當時中國知識界對「衛生」的理解，仍深受古典文獻中的意涵影響。因此，當西方科學中涉及公共性的身體治理知識進入中國社會時，中國社會一定程度地與傳統養生觀念交織融合，逐步形塑出一種兼具中西特質的身體觀。[註5]\n\n在詞彙意義尚未定型的狀態下，各種對於衛生的詮釋彼此交疊，飲食領域對衛生的理解也是如此。強調無肉飲食的素食主義，時常援引中國傳統膳食養生的解釋，其預防肉食中毒和消化障礙的特質，又被以西方醫學知識框架來解讀。因此，「衛生素食」在二十世紀初的中國社會，大抵上被理解為既有傳統養生膳食底蘊，又帶有現代醫學特色的新潮飲食理念。其意涵更是隨著提倡者的知識背景與思想資源，而被賦予不同的解釋途徑，成為中國社會對於西方現代性所追求的詮釋。\n\n其二是「護生素食」，這和中國佛教的戒殺傳統相關，可以追溯至梁武帝（r. 502-549）所制定斷除酒肉的規範。[註6]近代以前，這種素食的實踐大多以出家僧人為主。到了明末，因功過格盛行，加上雲棲祩宏（1535-1615）大力提倡戒殺與放生，素食才逐漸成為士大夫階層的風氣。[註7]清末民初，因傳播技術革新，佛教徒如印光（1862-1940）、李圓淨（1894-1950）、弘一（1880-1942）、豐子愷（1898-1975）等僧俗，透過佛教印刷品的出版，將護生的教義以更廣泛的方式流通。[註8]同時，如呂碧城（1883-1943）者，透過參與國際西方的動保運動和翻譯文章，將當代動保思想引入中國，並創辦中國保護動物會，以動物保護的觀念提倡素食。[註9]此外，民間宗教的發展和無政府主義者的提倡，亦一定程度造成素食主義在民初的流行。[註10]\n\n思想來源複雜的素食風潮，參與了當時社會中對於醫學、動保、宗教與政治層面等諸多議題的討論。大體上，「衛生」與「護生」是兩條最主要的脈絡。而這波風潮中，中國第一個本土素食組織「慎食衛生會」創立者之一的伍廷芳，被視為中國現代素食主義的先驅。作為一名清末民初的政治精英，伍廷芳創立素食會，並且撰書推廣素食，其思想來源及其對素食主義的詮釋值得深入探討。\n\n## 二、慎食衛生會的成立\n\n慎食衛生會是一個以推廣素食為宗旨的聚會型組織，關於它的成立，可以從伍廷芳的引退生涯談起。1910年3月，伍廷芳卸任駐美大使，返國銷差後，8月便以病為由辭官，退居上海。[註11]慎食衛生會雖成立於1910年，但其構想可追溯至更早。根據李石曾自述，1908年他在與伍廷芳的會面中，便已經決定要成立慎食衛生會。[註12]李石曾在當時因創辦巴黎豆腐公司而返國募款，在上海短暫停留的期間，他經黃秀伯（生卒年不詳）的引薦結識伍氏。[註13]兩人相談後，發覺志向相同，便決定籌辦衛生會。[註14]然而，伍廷芳早在1907年9月便已接下第二次出任美洲四國大使的任務，長期駐外；而李石曾則在1909年前後返回法國，繼續經營其豆腐事業，致使計畫擱置。[註15]\n\n目前能找到慎食衛生會最早公開紀錄，見於《浙江醫藥學報》刊載的〈醫事新聞：慎食衛生會〉。[註16]同年，《中西醫學報》與《申報》亦刊出相同章程。[註17]文件章程中，較為重要的前六條如下：\n\n1. 本會以改良食品，研究衛生，俾免病苦而登壽域爲宗旨。廷芳等就學識所及，身經親歷者，箸說發明，隨時刊布，以餉同志。\n2. 食品改良以不食血肉毒品爲綱，他若費財傷生之烟酒等物，皆在應戒之列。本會同人，各舉所知，另刊耑書，以廣勸告。\n3. 肉食之害，甫經發明。衛生家雖不乏知者，而每苦於素食，或難戒絶。本會特别研究於代肉物料，選備頗多。將來擬編印書報，開會演說。並應特設一食品售賣處，改良烹飪，俾戒肉者漸入佳境，而無所苦。現暫指定法界密采里爲本會改良食物之所，並備有無酒精之葡萄佳釀，專爲便於同人宴會起見。凡發起諸君，及本會出力之人，皆另贈餐劵，取價格外從廉。\n4. 本總會暫借設上海愛文義路一百號觀渡廬伍寓，分會設法京巴黎生物學會。凡有志入會或不即入會而欲研究此事，皆可通信賜敎。互換知識，再來函請逕寄上海馬霍路德福里三百八十二號半門牌。本會書記朱君總收。彚交廷芳等分别函答，或登報總覆。如有面詢事件，亦請先向朱君接治。\n5. 凡入本會。永不食血肉毒品者，即爲本會會員。\n6. 凡深知毒食之害而不能遽絶肉食者，亦可附入本會，爲本會之贊成員。[註18]\n\n慎食衛生會的會務自1910年9月7日正式展開，由伍廷芳任會長，李石曾任副會長。每隔兩週舉行一次聚會，時間固定於下午二時至三時，地點設在伍廷芳的上海寓所觀渡廬。分會則設在巴黎的生物學會，由李石曾所主持。事實上，李氏大多時間待在法國，直至隔年夏天才返國。因此大多事務，乃是由伍廷芳所主持。[註19]\n\n伍廷芳主持之下，他提倡吃素目的是能夠「免病苦而登壽域」，這和他在兩年後所出版的《延壽新法》宗旨相同，都希望能夠以素食、戒菸酒等方法，落實衛生健康的理念。過去研究多著重於素食運動整體的形成脈絡，對伍氏自身觀點的獨特性關注並不多，但其素食思想與當時代知識份子有許多相異之處，其獨特性必須透過比較才能顯現。梁其姿就指出伍廷芳對於素食的解釋偏重於生理學；李石曾則是從食物中的營養成分來詮釋。[註20]這個解釋大致把握了兩人的觀點。兩人同樣都反對肉食，但更細緻地分析，伍廷芳傾向將素食視為一種養生法；李石曾則將其視為幫助民族富強的國家工程。[註21]\n\n傅家倩的研究指出，二十世紀初，隨著西方營養學知識傳入中國，牛奶在西方飲食文化中被視為營養學的基礎食品。透過身高與體重等生理測量數據，部分科學論述認為中國人體態上的源於牛奶攝取不足。然而，中國自古以來生產和食用牛奶的文化並不發達。在此背景下，知識界開始尋求替代方案。十九世紀以來西方農業技術和食品化學的發展，使黃豆的種植與加工技術日益成熟，讓中國知識圈開始關注到本土產的黃豆或許可以成為替代方案。[註22]\n\n在農業生產與營養科學交織的知識脈絡下，學習農業化學的李石曾主張中國本土所生產的黃豆應成為飲食中蛋白質的主要來源，並且更應推廣至全世界。傅氏認為李石曾推動黃豆的主要目的在於解決中國科學現代化的課題，其論述從黃豆生產與加工的技術效益出發，延伸至國民體質與國家強盛。由此脈絡來看，李石曾的素食主張並非單純的飲食選擇，而是以黃豆生產與加工技術為核心，在營養學論證的支撐下，回應食物生產技術現代化的問題，並將素食納入其政治論述之中。[註23]\n\n經過知識背景與推廣目的之比較，便可以發現伍、李二人對於素食的理解有根本上的差異。伍氏的知識來自於中國的養生傳統和西方的衛生知識，李氏則來自於對於農業技術革新和國民體質提升的追求。\n\n而伍廷芳的素食觀點具體受誰影響？從伍氏在1914年所出版的《美國視察記》（*America: Through the Spectacles of an Oriental Diplomat*）中或許可以找到答案。伍氏自言他的觀念乃是受到亨德森（Mary Foote Henderson，1842-1931）的啟發。[註24]出使美國期間，伍氏在閱讀亨氏所著《健康貴族》（*The Aristocracy of Health*）一書後，開始關注衛生議題。亨德森主張透過節制飲食與自我管理，來推動社會的進步將衛生、健康視為道德實踐的觀念，對伍廷芳影響深遠。伍氏自言此書讓他成為戒酒者和「衛生家」（sanitarian），並開始勸人奉行這套理念。[註25]\n\n但伍氏的觀念也並非只受到這種衛生道德觀的驅動。駐美時期，他進一步去尋找人類應當茹素的其他論證。[註26]在《美國視察記》中，他提到當時美國著名的醫生、營養學家開洛洛博士（John Harvey Kellogg，1852-1943）對他的影響。[註27]伍氏在舉出多位素食運動員的例子，以反駁吃素會削弱體力的偏見，指出開洛洛博士曾透過醫學的理論告訴他素食的優點，以及自己親身食素以至於在老年還能保持良好的體力。[註28]亨德森的著作主要啟發了伍氏對衛生與節制生活的理念，而開洛洛則是這一理念提供了醫學上的實證基礎。\n\n此外身為外交官，伍廷芳常常需要出席許多宴會場合。書中有一章〈宴會〉，專門討論中西宴會在禮儀、食物與風俗上的差異。他提到美國的食物仍有改進空間，衛生部門應參考中國佛寺的齋食，那是世界上最健康、衛生的飲食。[註29]\n\n這說明伍氏對素食的根本信念並非出於宗教信仰，而是基於一套以醫學與養生為依據的衛生理想。可以發現伍氏所推崇的素食不僅是個人衛生，也被視為推動公共衛生與改善飲食風氣的重要途徑。他不僅在中國倡導素食，並且將其視為可以擴展為世界性議題的實踐。這也說明了他為何選擇在密彩里西餐廳設立慎食衛生會的食物改良場所。伍氏希望西方的素食思想可以融入中國的文化語境中，同時讓中國傳統素食所蘊含的文明價值得以彰顯。這樣的考量，或許就能視為他日後以養生作為素食推廣核心動機的原因。也體現出與中國本土宗教的素食觀、李石曾的科學素食之間的不同。\n\n伍廷芳對於素食的定義也有其獨特之處。在《證道學說》中，他就以一個案例回答中國素食和西方衛生素食的差別：\n\n> 我以一事案之，汝則明矣，有一老人食不消化……精神由此薄弱，因而老疾纏身，苟能食素？非中國之冬菇腐竹之素，乃衛生素食，則食必消化，夜必安睡，而精神強壯，老疾自減矣，故我謂食素不獨仁於物，而亦仁於己者也。[註30]\n\n他對「衛生素食」下的定義是「衛生素食乃外國人之素，以雞蛋、牛奶、奶油、乳餅為君，以蔬果穀粟為臣。」[註31]可見伍廷芳所推崇素食乃是蛋奶素，而非純素。這種分類並非伍廷芳自己的想法，更有可能是受到當時西方素食主義的影響。若要更清楚理解伍氏所言「衛生素食」與後來科學素食論之間的異同，可以參考李石曾提出的分類。李氏在〈肉食論〉一文中，透過素食這個詞在法文中的不同，將素食分為純素、蛋奶素二類：\n\n> 不食肉者亦有數派：一曰Végetarisme，讀作「衛食達宜斯母」，猶言衛生之意，普行於世也。此派主張不食血肉，而乳卵不在禁戒之列，因二者無血肉之流弊，可以補素食之不足，又如茶酒咖啡均有刺激腦筋之力，亦宜戒也；二曰Végetalisme，讀作「衛食達力斯母」，猶言專食植物之意，此派則純食植物，並乳卵而去之矣。以上二派名義具常混而不辨，其名僅別於宜力二字，其實則有乳卵取捨之分，言者聞者恆易分別，必加言食乳卵與否而後明了。然則第一派者，亦恆有不實乳卵之時，故二者終無嚴明之界限，亦可視此派為肉食素食之過渡也。[註32]\n\n認為蛋奶素是肉食和素食的過渡方式，同時他也提倡黃豆的營養價值勝過牛乳：\n\n> 則大豆之價最廉，與他國同類之豆相比，其價減至一倍乃至五倍。若以豆中所含之四合乳質（或卵白質），與肉中、乳中、卵中，以及各種菽粟中之四合質相比，其價則減二倍以至數十倍不等。由此可見，大豆之特長實可信矣。[註33]\n\n李氏對於植物性蛋白質的營養抱持勝過肉、乳、卵的態度，不過也並非完全排斥蛋奶，文中又提到「凡患神經症，皆應戒肉，雞子本系良品，惟性稍刺激，故亦不宜多食，以植物與牛乳食品為最佳。」在治病的前提下，蛋奶的食用可以被接受的。[註34]透過李石曾的理解，可以發現伍廷芳認為適合中國人的素食是蛋奶素，而非所謂的純素。蛋奶素主張可攝取乳卵以補充營養，後者則排除一切動物性食材。伍氏要強調的重點是飲食的消化性與營養均衡。兩人雖同樣都提倡素食，但思想重心並不相同。這種理念上的差異，也反映在他們各自推行素食運動的實際形式上。\n\n慎食衛生會作為中國第一個現代化的素食組織，其設立理念正體現了這一思維。伍廷芳以自身的衛生觀念為藍本，將素食視為改善國民健康、延年益壽的實踐方式。李石曾的素食思想則逐漸轉向具有政治與倫理訴求的層面。1912年他和汪精衛（1883-1944）、吳稚暉（1865-1953）等人在上海成立的道德促進組織「進德會」，強調參與的知識分子要戒除生活中許多不良的習慣，並且把戒菸、戒酒、戒肉，視為組織內會員最高層級的規範。[註35]1941年，李氏又於上海、重慶等地成立世界素食聯合同志會，希望透過素食的護生理念，來反對弱肉強食的風氣，已求世界和平之願景，用以回應當時的世界上的戰爭問題。[註36]從這點來看，伍廷芳初期的素食主義，所追求的面向並沒有太多在道德人文上的連結，而是將健康狀況推己及人而已，如他在《延壽新法》中所述他的願景是：\n\n> 以告世人，俾同登老子春臺，如游大雄世界，大地眾生，毋忘斯詣。尤願生富貴而負長才者。宏其功業，掃除疾苦，各葆遐齡，悠遊大同，豈不懿歟。[註37]\n\n儘管伍廷芳推動素食的意願十分積極，慎食衛生會的運作卻十分短命，僅持續一年多便停會。這可能和實際執行上的困難有關。根據會章規定，會員不僅需斷除肉食，還需禁菸酒並繳納會費。對當時上海的城市精英而言，這樣的規範在日常生活中難以落實。隨時間推移，會務逐漸低迷，慎食衛生館在後來甚至為了因應大眾需求，還供應葷菜。願景與現實的落差，最終導致慎食衛生會停辦。[註38]辛亥革命後，伍廷芳的生活重心也不在推廣素食，而是重新回到官場，開啟了他在民國政壇的政治生涯。一直到1941年，慎食衛生會才由聞蘭亭（1870-1948）、丁福保（1874-1952）等人重新復會，不過聲勢也不如以往。[註39]\n\n## 三、《延壽新法》中的素食觀念\n\n主持慎食衛生會的同時，伍廷芳將素食和養生的方法撰寫成《延壽新法》一書。在1914年由上海商務印書館出版，翌年再版。該書由瞿鴻禨（1853-1918）題序，並刊載於丁福保所辦的《中西醫學報》上，其版本源流高雨已撰有一文，進行詳細考證。[註40]據丁福保所記載，伍氏早在1903年即開始茹素，在主持慎食衛生會時，就已經有七年的素食經驗。[註41]其著書動機，依伍氏所述，乃是因為十年前因病纏身、藥石無效，在改變作息並實踐素食後，最終獲得康復。《延壽新法》結合了中國傳統養生知識、西方醫學知識，以及自身實踐與體悟的經驗。以衛生學的理論闡釋素食與養生，並引介傳統中國養生學較少見的觀點，例如強調運動、心理衛生的重要性等，與慎食衛生會所倡導的理念大致接近。\n\n《延壽新法》全書共有十三章，以飲食、飲水、睡眠、太陽與天氣五大要素建構出伍氏的養生體系。書中依次討論〈人身之功用〉、〈飲食宜忌〉、〈飲食方法與時機〉、〈飲水〉、〈睡眠〉、〈日光〉、〈天氣〉、〈風氣〉、〈衣著〉、〈感觸〉、〈運動〉，以及〈菸酒之害〉。其中關於飲食的篇幅尤為突出，單獨佔據三章。伍氏強調少食與素食，並將之視為延年益壽的核心。\n\n此書之中伍氏對於素食的提倡，主要出現在第一章到第四章。在伍廷芳的養生觀念裏，人類的壽命可以長達二百歲，不過因為欠缺保養，因此多為短命。延壽新法之目的，即是要透過日常保養的實踐，延長壽命。\n\n《延壽新法》的第一章〈論人身之功用〉主要解釋人類的身體機制。伍廷芳認為人體最為重要的是血脈的運行，若是血脈阻塞，人便會生病，而滯塞的原因來自於飲食的不節。因此養生的首要方法便是少食。在這個大原則之下，伍氏分析了食物本身的性質，其引用西方衛生學的知識指出各種肉品消化時間的長短，「豬肉需待至五時十五分，雞鴨四時，牛肉四時，羊肉三時。飯與菜蔬。亦須遲至三四時，方能消化。」[註42]\n\n在少食的大原則之下，伍廷芳從機械式的身體觀，來解釋食物的優劣好壞。在第二章〈論食物之所宜〉中對於食物性質的分類則更加詳細，提出「五端」，認為天氣、太陽、空氣、水和食品，乃是五種人體不能缺的要素，五種元素提供血脈順暢地運行。而血脈好比「氣機垂罏」，食物則是提供機器運作的煤薪，為血脈的運作提供動力。因此食物的選擇必需以量少為宜，才不會使得機器無法運作：並且食物的品質從「質清而易消化者，以充飲料」為原則。[註43]渣滓少為優先考慮，否則會導致消化的運作阻塞。在這個觀念之下，食物的分類方面，伍廷芳認為植物性食品優先於肉類，而肉類中亦有排序：\n\n> 若果蔬、穀豆之類，無一不藉太陽而生，固其品質最為稱人生增益。此等品質，入口腹，易消化而少渣滓，為機器爐碳之最良自非肉食重滯之所能比擬。誠以牛羊牲畜、肥甘膩滯，魚蝦鱗介、腥雜污泥，自異輕清之品。渣多難化，更非腸胃流通之所宜。[註44]\n\n伍氏對於食物的選擇，並非以營養成分多寡作為標準。反倒是從消化的容易程度來判斷是否適宜，這體現他將食物視為是一種負擔，而非一種滋補。可說他將素食定義成一種減輕負擔，而非增加能量的方式。後續他又將吃素的理由歸納為五點：一者，食品不可過多，若飲食過量便會使人體運作失調，導致機能失靈；次者，應選擇質地清純且易於消化的食物，因為肉類在宰殺過程中夾帶過多雜質，往往使消化效率降低；三者，植物因直接受太陽照射而富含能量，人若食用即可直接獲取。肉類則經由動物轉化，相當於多了一障礙，效率不及植物；四者，食用肉類存在罹患傳染疾病與中毒的風險，影響健康；五者，基於生命倫理，人類應避免屠宰生靈，以此體現對生命的尊重。[註45]\n\n《延壽新法》中伍廷芳對於素食的看法，對比於李石曾的營養觀念，偏重的是肉類所帶來的負擔。若説李石曾的素食觀是站在黃豆的營養價值上建立的，伍廷芳的素食觀便是建立於肉類對身體的負擔上，其所體現可以説是一種治療方針。如〈總序〉中所述：「邇聞各國研究素食，其風漸廣，而生息亦日藩。益信延壽怯病之方，素食為無上妙藥矣」。[註46]\n\n然而，這樣的素食論述，也在當時引發了不同的回應與期待。伍廷芳雖然關注到部分護生觀念，但並未積極探討。1920年代素食運動的重要推手呂碧城，在慎食衛生會成立時，曾經致信伍廷芳，希望他可以從護生的人道關懷來推行素食，然而這個想法卻被伍氏給拒絕。[註47]\n\n> 予髫齡寓津，見滬報紀伍廷芳氏之蔬食衛生會。即涵陳衛生義屬利己。應標明戒殺，以宏仁恕之旨。伍公復涵。謂原蘊此義。唯恐世俗斥為佞佛。故託衛生之說。以利進行云云。[註48]\n\n依照呂氏的說法，伍廷芳以衛生為旨，主要在意社會大眾的觀感，避免素食被誤解為單純出於宗教動機。透露他最初或許帶有戒殺的考量，但與李石曾合作後，遂轉而強調衛生。不過，呂碧城提出了素食主義究竟是要基於生命關懷還是個人健康的問題。從伍廷芳個人的思想發展來看，這個議題其實貫穿了他的生命後期的思考。雖然他在公共領域中刻意以「衛生」作為推行素食的語言，但宗教信仰與的追尋始終是他關懷的核心。伍廷芳晚年轉向靈學思想，並試圖透過玄學與科學、東西文明對話，來尋找生命的方向。\n\n## 四、宗教與生命關懷\n\n伍廷芳晚年生活很大一部分關注於玄學。爬梳伍氏對證道學詮釋，能夠找到他以另一種方式詮釋素食的證據。伍廷芳晚年信仰靈學，並且成為證道學會（Theosophy society）在中國的重要推廣者。1910年代開始，中國知識界流行靈學。黃克武的研究指出，1910年代上海所流行這類結合西方催眠、心靈學及東方扶乩術的組織，其特質在於以扶乩的方式來解決當代社會中學術、道德問題。[註49]伍廷芳作為留學生和外交官，長期穿梭於東西之間，對於文明的比較有深刻的體會和洞察。他希望從宗教思想上，來尋求對話空間，且找到中國文化的地位。這個性格顯著地體現在他的宗教信仰上，出身於基督教家庭的他，並沒有選擇信仰基督教，也不像辜鴻銘（1857-1928）一樣，成為極端的文化保守主義者。[註50]嚮往世界主義思潮的他，反倒是深信當時發跡於美國的新興宗教。\n\n證道學會在1875年由布拉瓦茲基（Helena P. Blavatsky，1831-1891）等人在紐約創立，1879年將總部移至印度亞德雅（Adyar），逐漸發展為跨國性的宗教與靈性運動。該會以促進人類大同、推動比較宗教與哲學研究、以及探索自然與人類潛能之隱秘法則為宗旨，在十九世紀末至二十世紀初影響深遠，並且以推動西方對東方宗教與神祕主義最為顯著詳細。[註51]\n\n1908年，伍廷芳第二次出使美洲。在此期間，他接觸到證道學的思想，並由此對靈魂存在等問題產生關注。此後，他開始陸續撰寫靈學相關著作，討論通神與精神層面的議題。胡學丞的研究揭示，至少在1910年前後，伍氏就已經成為天人明道會（Theosophy Society）的成員。[註52]1920年在上海成立的「證道學會土星分社」（The Saturn），是中國境內第一個證道學組織，該組織在初期被稱為「道德通神會」。伍廷芳在組織的成立給予許多的支持，並且被推舉為創會名譽會長，可見其在證道學會中的地位。[註53]\n\n伍廷芳所倡導的衛生素食，在證道學中又是如何被詮釋？可以從他的宗教著作來看。1922年所著的《證道學會要旨》一書，主要是作為介紹證道學會教義的傳道功用。第七章〈修道〉一篇中，伍廷芳就將素食作為與靜坐並列的兩種修道方法，伍氏指出：\n\n> 第一慎飲食。宜清潔。宜素食。豬羊牛等動物，其平日所食之原料，皆極污穢。吾人每日服食其肉。則身體漸變豬羊等之原質。獸性日形發達矣。蓋肉食知人，與真食素之人，性情良善，不作惡事。而食葷之人，往往好勇鬪狠，貪圖權利。甚而殺人強盜，無非食肉之輩。不聞是食素之人。此可為明證也。故人類欲德性向上。斷宜食素。飲料亦宜清潔。第二空氣之緊要。人類之呼吸，必得天地之清氣。濁氣不宜。即住所一節。亦不宜關閉自封在稠人廣眾之中。尤應注意。蓋必身體完整可修道也。[註54]\n\n由此觀察，伍廷芳在接受證道學的信仰之後，素食思想有些許向宗教道德層面的擴張。承襲《延壽新法》之中的衛生觀念，伍廷芳進一步將素食的衛生潔淨視為人修養性情的基底，不僅僅是對於身體有所傷害，污穢的肉類更是滋長暴力、貪欲的源頭。這與布拉瓦茨基對素食的態度有一定程度的貼近。在布拉瓦茨基的對話錄《證道學之鑰》（*The Key to Theosophy*）中，可以發現她鼓勵信徒吃素，其理由是肉食會增長動物性，不過教內並沒有立下強制的規定。布氏同樣對於肉類的種類做出排序，她認為大型動物影響人類最多，鳥類次之，魚類和冷血動物則較少。另外，布氏也認為吃肉會導致疾病，並且阻礙內在力量的發展。不過，儘管認為素食比較好，但布氏並非站在動物倫理的立場思考，認為吃肉沒有任何罪過，只是對於自身發展有礙。[註55]\n\n關於殺生與素食的問題，《伍廷芳證道學說》中有一篇寫道：\n\n> 問：既是有因果萬物之生死，必有因果，然則殺生而食，必無罪耳，此論是否得當，請為開導。\n>\n> 答：萬物之生殺，是有因果在內，此即是有數存焉。如古人所謂一飲一啄，事皆前定。又如耶教聖經云，雖麻雀之死，上帝亦必知之。其死也是數，其食也亦是數必矣。惟是不殺生者，仁也。見其生不忍而忍見其死者，不仁也，則不同耳……故殺生而食之，其物之死於汝口腹，是定數，則食之者無罪也，惟不忍見其死而為汝所食，是仁也。仁者是天地之生機，擴而充之，聖賢仙佛，可冀於今生來世也。[註56]\n\n伍廷芳對於素食的觀點大致前述布拉瓦茨基的觀點相仿，不認為吃肉本身有道德疑慮，只是強調會能否達成儒家中「仁」的標準而已，並且這個仁可以成為修行的基礎。後續又延伸到證道學的信徒是否一定要吃素的問題：\n\n> 問：先生此論果是的當然，則證明道學者之食素是純然為仁乎？\n>\n> 答：是不獨仁於物又實仁於己，我以一事案之，汝則明矣，有一老人食不消化，夜不能安睡，老疾纏身，自覺做人無樂趣，自願速死。不知人身既老，消化力不足，以致不能安睡，精神由此薄弱，因而老疾纏身，苟能食素？非中國之冬菇腐竹之素，乃衛生素食，則食必消化，夜必安睡，而精神強壯，老疾自減矣，故我謂食素不獨仁於物，而亦仁於己者也。[註57]\n\n伍廷芳透過故事舉例，以食用蛋奶的衛生素來回答。鼓勵發問者能夠吃素最好。並且提出吃素是「不獨仁於物又實仁於己」，可以發現，伍廷芳的素食觀點是由自身而擴展至動物，並非純粹只考慮衛生科學而忽略對於動物的關懷。這可以從《美國視察記》來佐證，在〈運動〉（Sport）一章中，討論完素食者的體力問題後，伍廷芳緊接著是大力批判打獵，認為透過獵殺動物尋歡作樂是野蠻的行徑，同時他也舉出射殺鳥類、虐待老鼠等行為是暴行，不符合為文明的價值，更可能成為戰爭的源頭。[註58]伍廷芳的素食思想雖然以衛生與養生為核心，但並不僅止於此。當時西方素食主義本就涵蓋廣泛的範疇，而在伍氏的論著中，亦能窺見宗教與生命關懷的意涵，只是這些層面在既有研究中常遭忽略。這樣的詮釋展現出伍廷芳更深層的關懷，即如何在東西文明之間尋找一種共通話語，並藉此回應當下世界的問題。正因為不受清廷重用以及對袁世凱稱帝的失望，伍氏更傾向於反思文明的意義，並在這段時間選擇以素食作為改革的途徑，以回應知識分子對國家未來的焦慮。\n\n不過，伍廷芳選擇以「衛生」作為理論依據，勢必有所考量。一是這契合他作為中西橋樑的身份。在當時語境下，衛生被視為先進科學知識，象徵著中國社會渴望追求的西方現代性；二是在當時，衛生概念本身的定義模糊，使伍氏能夠結合傳統養生思想加以擴充，並得以回應更多的社會議題。作為熟悉中西文明的知識分子，他以此概念回應時代問題，成為一種策略性的選擇。回到個人生命經驗，伍廷芳追求中西文明的對話，並強調民族自信，由此推廣素食的實踐不僅是生活方式的提倡，中西文明交流、玄學與科學對話。這種模式後來也被延續到民初的素食運動，使之展現出兼具開放性與多樣性的思想生態。\n\n## 五、結論\n\n考察伍廷芳的素食思想，可以發現其觀念主要源自西方衛生學著作，尤以亨德森與開洛洛二博士的影響最深。1910年創辦的「慎食衛生會」，即體現了他個人生命經驗的投射。伍廷芳希望素食不僅能藉由衛生學的理念而現代化，更能走向精緻化，成為足以登上國際宴會桌的飲食方式。1914年，他出版《延壽新法》，系統地整理了其素食觀。其論點在於以機器式的生理機能論，強調肉食所造成的毒害與負擔，藉此彰顯素食的價值。他推崇的核心不在於營養補益，而在於「少食」與「食之有方」，認為唯有透過減輕身體負擔，方能達致延年益壽。這與李石曾以化學分析證明素食可提供豐富營養效益的論述，形成鮮明對比。\n\n在接觸證道學之後，他更將這種延壽取向的飲食方式，上升為修道的基礎，並與德性修養相結合。儘管在伍廷芳的思想中，動物倫理並非他推行素食的主要動機，但他仍然在一定程度上展現其人道關懷，並且附加於素食之上。以素食為主軸的組織結社，也為1920年代中國佛教界的護生素食運動埋下伏筆。由此可見，民初素食主義的第一波風潮，其核心並非戒殺或宗教因素，而是以追求衛生、延壽為重。伍廷芳雖以衛生為素食思想的核心，但並未局限於此。他的論述同時觸及宗教與生命關懷，折射出他在東西文明之間尋找共通語言的企圖。透過衛生這一兼具科學象徵與傳統延伸性的概念，不僅回應了時代焦慮，也開創出民初知識分子與西方文明對話的一條路徑。\n\n---\n\n*附記：本文作者許原綸，國立臺灣師範大學歷史學系碩士班研究生。感謝匿名審查人指出初稿之缺失並提供修改方向，亦感謝編輯團隊協助指正格式、文字和資料細節的錯誤。上述建議使本文得以更加完善；惟本文一切文責由筆者自行承擔。*\n\n"},{"title":"護生碎碎念001","subtitle":"","author":"","cat":"life","date":"2025-10-26","slug":"huseng","source":"","notes":[],"refs":[],"body":"最近剛追完一部很久之前出的的《擁有超常技能的異世界流浪美食家》。劇情雖然俗套，但在異世界作品裡算有趣。主角擅長料理，他的能力是能從異世界叫到現實世界超市的外送。靠著這項技能，他用料理收服了一隻武力強大的魔獸菲爾（外型明顯抄襲《幽靈公主》的山犬）。這隻魔獸靠牠狩獵高等魔物，幫主角快速地升等、賺錢。 有一幕是主角叫了黑毛和牛給菲爾吃。菲爾驚訝這肉竟如此美味，後來才知道在人類世界，牲畜是被特別飼養來吃的；而在異世界，肉類全靠打獵取得，並沒有畜牧文化。這情節讓我想到一個問題：「肉」作為商品，在現代資本主義社會中，是否仍帶有宗教性的神聖意味，或階級結構中的稀缺象徵？還是早已成為日常習慣的一部分？當屠殺變成社會的「描述性常態」（descriptive norm）時，還有人會覺得這不道德嗎？\n\n我承認自己有反社會的傾向，而吃素本身就帶著一點反社會，因為這會阻礙人類「共食」的習性。認識我的人都知道，我在生活中盡可能吃素。儘管我因為身體因素，本身仍剝削蛋雞和奶牛，離全素還有距離，但我相信這是一種漸進的練習。只要持續嘗試，終究能越來越接近心口無異的實踐。我的碩論也關注動物保護問題，不過我不是那種高舉道德旗幟的動保魔人。我反對的其實不是「吃肉」本身，而是現代肉品來源幾乎都來自工業化畜牧（factory farming）。在這體系裡，動物不僅在死亡時受苦，連活著都得經歷極端的虐待。\n\n漁獵採集時代的肉是靠狩獵得來的；農業時代，肉則屬於祭祀或權力階層的特權食物，平民吃肉的機會微乎其微。工業革命之後，畜牧逐漸工廠化，動物成為可販售的商品。牠們從出生到死亡都被控制、餵食、強制交配、與幼崽分離，被注射激素，終年關在潮濕污穢、無日照的空間。這些細節之殘酷，讓我不得不去想一些問題：生命的邊界到底在哪裡？孟子所謂禽獸之辨要如何去判準？獸、人、神邊界要怎麼去界定？\n\n目前願意正視這問題的，大概只剩宗教與少數哲學流派。如果要對抗資本主義這個恐怖的利維坦型宗教還有消費主義這個眾人遵守的「戒律」，傳統宗教反而可能是少數的出路。佛教、基督教、道教、儒教、印度教、耆那教，都曾提出過各自的素食論證。我是希望能從亞伯拉罕諸教、印度諸教、中華諸教的宗教對話中，去看宗教如何共同處理這個世界性的危機。\n\n我們從小就被教導不要傷害生命，這是幼稚園小孩都懂的道理。可是在現代社會，暴力與剝削生命的行為卻被合理化，成為日常。我說句傷人的，不關注這個問題，就是共犯。歷史上，那些默許暴力的人，也不都一樣？十五世紀以降的黑人奴隸主、二戰時支持納粹集中營的德國群眾。從後設角度看，他們當然可惡，但當下他們會這麼想嗎？社會有定他們罪嗎？挪移到當下，我們不也是默許生命被系統性屠殺與利用嗎？\n\n人為何飼養動物？人為何吃動物？無論從學術或生活角度，這都是值得窮盡一生去思考的問題。許多學者研究動物倫理、寫動物研究的文章，但卻怎麼都不願意放下手上的雞腿、餐盤裡的牛排，然後再理直氣壯地找藉口開脫。很荒謬吧\n\n![image.png](/assets/uploads/image-8.jpg)\n\n"},{"title":"印度又一件女大生輪姦案","subtitle":"","author":"","cat":"life","date":"2025-10-13","slug":"bunchiunn01","source":"","notes":[],"refs":[],"body":"印度又發生了憾事。這樣的事情一再重演，也很可能還會繼續發生。\n\n2012年，德里一名醫學院女學生 Jyoti Singh 被姦殺，整個過程光是想像就讓人坐立不安。為什麼這樣的事在印度會屢次發生？以Uma Chakravarti 為首的印度女性主義學者，把原因歸咎於種姓制度下的宗教父權體系。不過，原因真有那麼簡單？我覺得不一定。前幾天和宗怡談到種姓制度時，我說那其實是現代人對吠陀經典的誤讀。從我的角度看，把性暴力直接歸因於宗教文化（例如把強暴合理化與濕婆的陽具崇拜或性力派思想連在一起），這種說法我總抱持懷疑。我的直覺告訴我，殖民所造成的結構性問題才可能嚴重，但目前沒有證據。因此按照無罪推定原則，我也不能隨便扣帽子，只能暫時留著這個問題。\n\n交叉性（Intersectionality）自第三波女權以來影響甚巨，但真正落實在社會卻有限。多數討論仍集中在西方已開發國家的女性，關心她們在種族、宗教、階級位置中受到的壓迫。但是，對印度這樣女權極度低落的地方，我們該怎麼「看見」這些女性的處境？那些被媒體報導的受害者，多半因為有大學背景，才被注意。還有千萬個無法被看見的女性，她們面對的壓迫、暴力與剝削，我甚至連想都不敢想。這正是1980年代以來，交叉性視野始終沒有真正落實的證明。當我們想到女權時，腦中浮現的總是歐洲街頭或美國法庭，但在亞洲、非洲、拉美的開發中國家，乃至於日、韓、中（沿海已開發地區）這些經濟發達卻被父權文化所狹持的國家，這些女性的痛苦又有誰看到？誰又能去承擔、去救贖？\n\n可悲的是，我常聽到有人以輕蔑的語氣，拿印度的性別不平等現狀來開玩笑。不論網路或現實，這樣的話語隨處可見。那些女性的苦難，在一些已開發國家的年輕人口中，反而變成了消費印度的題材，甚至成為攀比國族優越的工具。就像對岸，徐州鐵鍊女事件至今還沒個公眾的交代，小粉紅就拿印度的性平落後來消費。同理，台灣的網民拿鐵鍊女來取笑大陸的態度，也是一樣可悲。這樣的種族雙標和有意無意的忽略，才是最令我氣憤的事。願所有性別暴力消失，所有受苦的女性得以解脫。乙巳桂月廿二 (已編輯) \n\n++[https://timesofindia.indiatimes.com/city/bhubaneswar/my-daughter-did-not-go-out-after-midnight-girls-father/articleshow/124508017.cms](https://timesofindia.indiatimes.com/city/bhubaneswar/my-daughter-did-not-go-out-after-midnight-girls-father/articleshow/124508017.cms)++"},{"title":"關於Cannibalism","subtitle":"","author":"","cat":"life","date":"2025-11-07","slug":"bunchiunn02","source":"","notes":[],"refs":[],"body":"> 噉屍飲血之空氣，充滿於天地之間，吾人生存於此，兒童成長於此，潛移默化於Cannibalism主義之中，試問何能維持和平之精神？僅憑印刷品紙上之法律，及國際數紙之條約乎？吾人之侵略殺害，惟力是視，但屈服於強權，猶群狼之蒙罩人皮，以假面目相誑，尚得靦顏自詡其文明乎？\n>\n> ーー呂碧城，〈呂碧城在維也納之演說〉May, 1929\n\n1945年3月，太平洋戰爭尾端。小笠原群島的父島上發生恐怖的食人慘案：「父島事件」（Chichijima incident），前後由日本陸軍與海軍共同犯罪。以森國造與立花芳夫中將為首的軍官，在食物充足的情況下，殺了八名美國戰俘。這些俘虜被斬首後，屍體遭製作成壽喜燒、肉湯和串燒食用。日本兵不僅吃戰俘的肉和內臟，甚至把屍體剖開，把內臟逐一掏出，作為醫務兵的教學展示。（美國總統布希是該隊中少數成功逃生者）戰後，遠東軍事法庭沒辦法將食人罪判刑，因為食人這件事情根本沒有寫在日內瓦公約裏面。這些日本軍官只能用殺人罪處理，在上訴時的一個理由是「東西道德不同」（文明），很荒謬吧。呂碧城在戰爭發生前十五年，就預料到人類的底線，所以才孜孜不倦向人勸導。當知識份子在提出批判時，千萬不要當成故事，或只是聽聽而已。這可能會是未來發生在身邊的災難。對了，日文資料甚少，如果要看可以直接找英文的。\n\n++[https://bunshun.jp/articles/-/39584](https://bunshun.jp/articles/-/39584)++\n\n++[https://www.9news.com.au/world/chichijima-incident-george-hw-bush-extraordinary-wwii-survival-story/b8edd905-c63b-409f-971b-23f08e533389](https://www.9news.com.au/world/chichijima-incident-george-hw-bush-extraordinary-wwii-survival-story/b8edd905-c63b-409f-971b-23f08e533389)++"},{"title":"護生碎碎念002","subtitle":"","author":"","cat":"life","date":"2025-11-03","slug":"huseng02","source":"","notes":["我想大多數的反素食者根本沒真正讀過一篇有關植物痛覺的生科論文，詳見：Hamilton, Adam, and Justin McBrayer. \"Do plants feel pain?.\" Disputatio: International Journal of Philosophy 12.56 (2020)."],"refs":[],"body":"破解反素食的荒謬言論。吃素的人最常遇到的批評就是「植物也有生命，為什麼要吃植物？」通常會說出這種言論的批評者，本身其實根本不在乎動植物痛苦的本身，思路十分地單純，甚至是一種沒有思考的直覺反對。比從文化禮俗反對素食還蠢。\n\n首先，這些人很常會拿網路上隨手可得的農場科學文，指出某某科研機構、科學家指出植物可以感覺到痛覺。然而，從目前最前研的科學研究來看，科學家仍然沒有找出植物有痛覺的依據，因為植物雖然會溝通、有刺激反應，但最重要的是植物沒有神經系統、大腦和神經元。而反素食者的論據通常就是拿植物有反應作為痛覺，根本就是邏輯死亡，或是連基本的常識都沒有。而動物有痛覺、神經、大腦這件事幾百年前就已經由科學家證實了。所以提出這個問題的人，根本就是反邏輯、反科學。\n\n第二，如果植物哪天被研究出有痛覺，這個命題成立的話。那反素食者便會面臨到另一個問題，他們所吃經濟動物的飼料來源是什麼？從效益論的視角來看，我們大部分的植物糧食，幾乎全部都拿去餵養食用動物，大量的玉米、黃豆作為飼料被消耗，那請問肉食整體來看不是殘害更多生命，除了植物之外，還讓動物受苦。\n\n第三，從人類本身的情感來看的話，人本身一定都是雙標，也就是有分別，這無可厚非。從直覺問起，請問大部分的人覺得切一顆蘋果？還是把一把刀插入牛的氣管？的傷害比較可怕。我想應該是後者吧！如果有人認為後者不嚴重，那個人如果不是純粹詭辯，就是社會人格失常。\n\n進一步問，大饑荒時，你覺得殺一隻雞來吃你可以接受，還是殺你的家人來吃？我想當然是前者。可是在現實環境中，人類做出的選擇卻是不理性的。明明殺動物是極為嚴重的事，但根本沒人在乎。\n\n其實說白了，提出這個批評的人，本身毫不在乎動物的痛苦，只是在詭辯。除非他可以不吃，或是只吃礦物而活。食肉就食肉，並沒有什麼可恥，因為當代社會是一個生病的社會，受環境影響無可厚非。但把食肉講得冠冕堂皇，並且批評食素的人，本身就是人類中心主義者，並且在進行赤裸裸的物種歧視，這才是荒謬至極的。\n\n"},{"title":"野餐日","subtitle":"","author":"","cat":"life","date":"2026-03-20","slug":"picnic","source":"","notes":[],"refs":[],"body":"自從我旅居臺北城，才發覺講一年當中，宜人的天氣有夠少。今仔日罕至是好天，氣溫涼爽，閣有日頭。我著恰三个友人佇文山森林公園野餐。阮一面食便當、餅乾、飲料恰水果，一面佇草地面曝日頭，拍抐涼。佇這个節奏緊迫的城市裏底，按呢款的時間真少。短短仔的休憩（きゅうけい），予人會使暫時脫離日常的壓力恰煩惱。食飯飽，阮爬上公園的小山崙，去跙流籠（溜滑梯）。恰逢無人，才會使耍恰盡興。兩點鐘，假若像完全脫離了世俗的生活。我想可能都市仔的日常著是按呢，便是佇這款閬縫當中，尋著一時半刻个心適，今仔日的好天，當是愛感謝天公伯仔个成全。  \n\n![LINE_ALBUM_2026320_260320_1.jpg](/assets/uploads/linealbum20263202603201-2.jpg)\n\n![image.png](/assets/uploads/image-1.jpg)\n\n![image.png](/assets/uploads/image.jpg)\n\n![LINE_ALBUM_2026320_260320_4.jpg](/assets/uploads/linealbum20263202603204-2.jpg)\n\n"},{"title":"學鳩齋slack群第二次聚會","subtitle":"","author":"","cat":"life","date":"2026-03-08","slug":"slack02","source":"","notes":[],"refs":[],"body":"剛剛才想起來是第二次聚會，第一次是去年聖誕節去看寒食帖。第二次聚會花了兩天，第一天我和眾魁、宗恩去德貴學苑參加新春茶敘到下午，結束後又會合旻翰去迪卡儂採購。晚上去艋舺吃麵，到龍山寺逛逛，看看站壁街，又回到萬隆小房間繼續喝茶談天。第二天我們在政大郵局集合，簡單吃了點豆漿飯糰後，就出發爬山。從指南宮上去，爬完二格山，在山上吃完另一顆飯糰。由於天氣突然下雨，擔心危險，決定不爬筆架山，所以我們從南天宮下山。一路經過華藏的靜修中心回到深坑市區吃臭豆腐。本想去樟山寺喝鐵觀音，後來不小心做錯站，只能回文山森林公園喝茶，沖了一支貴妃美人、一支瑞里高山。最後吃了大福利餐廳（全臺北我覺得最好吃的餐廳）當作晚餐，還續攤一碗燒仙草，非常過癮。  \n希望之後大家可以參與活動（可能北中南都會有），來認識人，或介紹朋友來。 \n\n![image.png](/assets/uploads/image-2.jpg)\n\n![image.png](/assets/uploads/image-3.jpg)\n\n![IMG_6454.jpg](/assets/uploads/img6454.jpg)\n\n![image.png](/assets/uploads/image-9.jpg)\n\n![image.png](/assets/uploads/image-6.jpg)\n\n![image.png](/assets/uploads/image-7.jpg)\n\n"},{"title":"【史學文章翻譯】長頸鹿的法國之旅（1826–1827），進入另一個世界","subtitle":"","author":"艾瑞克・巴拉泰","cat":"life","date":"2026-11-03","slug":"ericbaratay","source":"Eric Baratay，〈The Giraffe's Journey in France (1826–1827): Entering Another World〉，收錄於 Clemens Wischermann、Aline Steinbrecher、Philip Howell 編，《Animal History in the Modern City: Exploring Liminality》，Bloomsbury，2018，頁 91–104。HAL 開放典藏編號 hal-04776575（2024 年 11 月 11 日上傳）。","notes":["G. Dardaud, *Une Girafe pour le roi* (1985), Bordeaux, 2007；M. Allin, *Zarafa*, London, 1999.","Éric Baratay, *Le Point de vue animal, une autre version de l'histoire*, Paris, 2012；\"Geschichtsschreibung von Seiten der Tiere. Leben und Sterben im Ersten Weltkrieg\", *Tierstudien*, 5, 2014, 30–43；\"Building an Animal History\", in: Louisa Mackenzie et al. (eds.), *French Thinking about Animals*, East Lansing, 2015, 3–14.","Julius Bräuer, \"What Dogs Understand about Humans\", in: Juliane Kaminski et al. (eds.), *The Social Dog*, London, 2014, 295–317；Monique Udell et al., \"A Dog's-Eye View of Canine Cognition\", in: Alexandra Horowitz (ed.), *Domestic Dog Cognition and Behavior*, New York, 2014, 221–240.","專題 \"Does History Need Animals?\", *History and Theory*, 52-4, 2013.","Adam Miklósi et al., \"The Personality of Dogs\", in: Juliane Kaminski et al. (eds.), 前引書，191–222.","Adam Miklósi, *Dog*, Oxford, 2014.","省長維勒紐夫－巴爾尚蒙（Villeneuve-Bargemon）的信件，ADBR, 4 T 53；Salze, \"Observations faites sur la Girafe envoyée au Roi par le Pacha d'Egypte\", *Mémoires du Muséum d'Histoire Naturelle*, 14, 1827, 68–84；É. Geoffroy Saint-Hilaire，信件，ADBR, 4 T 53，及（原文此處不完整）。","為避免註釋過多，本文的動物行為學資料均出自國際權威著作 Anne Dagg, *Giraffe: Biology, Behaviour and Conservation*, Cambridge, 2014。","L. D. Ferlus, *Nouvelle notice sur la girafe*, Paris, 1827, p. 4；Salze，前引書，p. 71–72；Étienne Geoffroy Saint-Hilaire，前引書，p. 210–211, 223.","Salze，同上，p. 68–69（引文）；ADBR, 4 T 53，省長致海關關長函，1826 年 11 月 14 日。","Salze，同上，p. 82–83；ADBR, 4 T 53，帳目，1826 年 11 月 10 日；省長信件，1826 年 11 月 8 日及 18 日、1827 年 2 月 12 日。","Salze，同上，p. 80–83；Meredith Bashaw et al., \"A survey assessment of variables related to stereotypy in captive giraffe and okapi\", *Applied Animal Behaviour Science*, 73-3, 2001, 235–247.","Salze，同上，p. 78, 81–82（引文）；ADBR, 4 T 53，省長信件，1827 年 2 月 12 日。","ADBR, 4 T 53，省長信件，1827 年 3 月 3 日及 19 日（引文）、1827 年 4 月 28 日、1827 年 6 月；L.-F. Grognier, *Gazette universelle de Lyon*, 1827 年 6 月 14 日，p. 1。","Salze，前引書，p. 76, 82；ADBR, 4 T 53，省長信件，1827 年 2 月 12 日。","Salze，同上，p. 82（引文）；ADBR, 4 T 53，省長信件，1827 年 2 月 12 日及 4 月 28 日；博物館信件，1827 年 7 月 4 日。","Salze，同上，p. 77, 79（引文 1–4）；Étienne Geoffroy Saint-Hilaire，前引書，p. 216, 220（引文 5–7）。","Robert Dantzer, *Le stress en élevage intensif*, Paris, 1979.","Étienne Geoffroy Saint-Hilaire，同上，p. 214–215；Graham Mitchell et al., \"The origin of mean arterial and jugular venous blood pressures in giraffes\", *Journal of Experimental Biology*, 209, 2006, 2515–2524.","Salze，前引書，p. 73–76, 83（引文）；ADBR, 4 T 53，開支報告，1826 年 11 月及 12 月；省長信件，1827 年 2 月 12 日。","ADBR, 4 T 53，Étienne Geoffroy Saint-Hilaire 信件，1827 年 5 月 21 日及 24 日（引文 1）、6 月 2 日（引文 3）；Étienne Geoffroy Saint-Hilaire，前引書，p. 214（引文 2）、219。","ADBR, 4 T 53，省長信件，1827 年 6 月 23 日；艾克斯副省長信件，1827 年 6 月 23 日（引文 1）；Saint-Hilaire 信件，1827 年 6 月 24 日（引文 2、3）；《艾克斯儀典》（Cérémonial of Aix），1827 年 5 月 20 日，載於 É. Aude, *La Girafe à Aix*, Aix, 1934, p. 10–12；Louis-Furcy Grognier，載於 *Gazette universelle de Lyon*，6 月 6 日 p. 2、6 月 7 日 p. 2、7 月 9 日 p. 1（引文 4–5）；里昂市檔案館（Archives Municipales de Lyon），1 I 65，市長信件，1827 年 6 月 6 日。","ADBR, 4 T 53，Saint-Hilaire 信件，1827 年 5 月 23 日及 24 日（引文 2）、6 月 2 日及 5 日（引文 1）。","ADBR, 4 T 53，博物館信件，1827 年 7 月 4 日；Saint-Hilaire 信件，1827 年 7 月 12 日；Louis-Furcy Grognier，載於 *Gazette universelle de Lyon*，1827 年 7 月 15 日；L. Ferlus, *Dernière notice sur la girafe contenant la relation de son voyage à Saint-Cloud*, Paris, 1827.","ADBR, 4 T 53，Geoffroy 致省長函，1827 年 10 月 22 日；L. Ferlus，同上，p. 9（引文）。","P. Bernard et al., *Le Jardin des plantes*, Paris, 1842, I, p. 41–43；M. Boitard, *Le Jardin des plantes*, Paris, 1842, p. 442."],"refs":[],"body":"## 導言\n\n這頭長頸鹿是埃及帕夏（總督）贈予法國國王查理十世的外交禮物，1826 年抵達馬賽，並在當地度過夏天以適應環境。每天下午，人們會牽著牠在民眾之間散步；晚上則有為牠舉辦的社交活動。1827 年 5 月 20 日，長頸鹿在馴獸師、警員和後勤車隊的陪同下啟程前往巴黎。沿途群眾蜂擁而至，給予牠凱旋般的歡迎。這是一樁令人難忘的盛事，起因是這種動物所激起的強烈好奇心、想像與熱情。報紙刊登了旅途的紀實，並隨時向國王報告。6 月 30 日長頸鹿踏上巴黎土地後，於 7 月 9 日在聖克盧（Saint-Cloud）晉見國王。直到 12 月為止，共有 60 萬名來自全國各地的訪客湧入巴黎植物園（Jardin des Plantes），只為親眼看看牠的午後散步。這股熱潮來自事件本身，這是西方世界許久以來第一次見到活生生的長頸鹿。牠吸引的人潮，大概就像今天一個外星人在公園裡散步一樣。\n\n牠也引發了一股狂熱。牠的肖像點綴著年曆、月曆和版畫。長頸鹿甚至成為戲劇、小冊子（《長頸鹿，或野獸的政府》，1872〔譯註，原文如此，應為 1827〕）、滑稽小書（《長頸鹿夫人在巴黎》，1827）、歌曲與音樂（鋼琴圓舞曲〈長頸鹿〉）的主角。大量印有奇想式長頸鹿圖像的餐具被製造出來，女性時尚也為之瘋狂，仿長頸鹿的配色、袖子、飾邊、項鍊、緞帶、陽傘，乃至長頸鹿式的髮型都出現了！這些在文獻中無所不在的「人類視角」面向，正是歷史學家對這段冒險主要記得的部分。他們聚焦於法國與埃及的關係、這份禮物的政治意義、官方的勤勉作為、旅途中相關人物的曲折經歷，以及它所引發的時尚潮流[註1]。\n\n然而，這個故事並不只屬於人類。民眾來看的不是一件標本，而是一個以其行動與反應引起轟動的生命。這首先是兩個不同世界（動物與人類）之間的相遇。一方發現另一方、感到驚訝並以自己的方式做出反應；雙方各自建立起一種關係，而這種關係需要被完整地審視，雙方都必須被納入考量，尤其是長頸鹿這一方，而這是一種不尋常的做法。就此而言，「閾限性」（liminality）的概念可能頗有助益，因為它能闡明從一種狀態到另一種狀態的過渡。更有意思的是，范・傑內普（Van Gennep）與特納（Turner）所界定的三個階段，在這頭長頸鹿身上都能找到。起點是在蘇丹被捕時與原生世界的粗暴「分離」，終點是抵達巴黎植物園動物園後最終「整合」為動物園動物；其間則是一段漫長的「過渡」期，從蘇丹到埃及（步行或搭船），接著從亞歷山卓搭船到馬賽，最後從馬賽步行到巴黎，一路上這頭動物不斷面對變動不居的人類世界。因此，我們有理由追問，這種原本用來描述人類的閾限處境與狀態，能否用在這頭動物身上？藉此提出問題，留意那些原本可能被忽略或低估的跡象與行為，並呈現此一案例（如果它確實是一個案例的話）的特殊、獨特與個體面向。那麼，在被捕這場震撼經驗中的被遺棄感呢？心理上的迷失呢？其既有經驗的瓦解、習慣的中斷呢？在這段漫長、漸進且充滿變數的過渡中，那種緊張、壓力與恐懼的狀態又如何？此外，在較小程度上，人類這一方呢？我們關注的是驚訝不已的歐洲人，而非早已熟悉這種動物的蘇丹人或埃及人。\n\n然而，在我們一向只處理人類故事的情況下，又該如何針對一頭動物提出這些問題？自「動物」研究計畫開展以來，人文學科（尤其是歷史學）幾乎只關心其人類的一面，亦即人類對動物的利用、作為與再現。我們的做法彷彿人與動物的關係領域只剩下單一的端點（人）與單一的方向（人朝向／施加於動物），這在我們研究的核心造成了一個黑洞。動物作為會感受、會反應、會行動、會主動出擊的生命，常常被遺忘，或被化約為研究的藉口，成為人類的再現、知識與實踐施加其上而不產生任何後果的純粹客體。三十年來發展起來的動物史，實際上是一部「人類的動物史」，作為真實生命的動物在其中反而缺席；這一現象使得動物史大部分的真實與複雜性被遺忘或擱置。因此，有幾個認識論與方法論的面向需要加以闡述。\n\n## 前言　我們該如何從長頸鹿的視角看待事件？\n\n我主張完全從長頸鹿的視角來看待這些事件，以便更加了解這個「行動者／生命」。牠本身就值得研究，而且回過頭來看，也能讓我們更深入理解牠與人類的關係。從動物的角度看問題，意味著試圖站在牠們身旁，採取牠們的地理視點，理解牠們所經歷、所承受的事物，以及牠們如何行動與反應。這也意味著試著把自己投射到牠們身上，去發現牠們的心理視點，也就是牠們看到什麼、感受到什麼。這不過是一種意願、一種投射的努力、一種方法，卻能幫助我們轉換焦點（民族學家長期以來一直嘗試這麼做，如今動物行為學家也接續了這一做法），對我們的研究可以有深刻的貢獻。\n\n為了在本章有限的篇幅內專注於長頸鹿的案例，關於這一研究取徑的一般性面向，請讀者參閱我先前的著作[註2]。這些面向包括擴展歷史的定義；超越文化研究取徑，這種取徑常將我們侷限於解構論述，把這個至關重要的前提變成了牢不可破的目的；有必要重新尋求真實，並依靠「情境化知識」（situated knowledge）的概念，它允許我們在意識到知識生產脈絡的同時建構知識；有必要拋棄西方將動物視為被動存在的觀念（這是一種歷史建構），並以另一種觀念取而代之，將動物視為會感受、會體驗、會行動、會適應的生命；而動物行為學也越來越強調個體行為、群體的社會性與文化，並開始處理「動物視角」的問題[註3]。要尋找、見證與呈現，我們需要這樣的前提。動物不僅是影響人類的行動者，不僅擁有能動性（agency）並與人類協商出各種安排，如同目前英語學界的研究所處理的那樣（這種取徑主張觀察雙方的互動，看看動物能讓人做什麼，但認為無須深入研究這些動物，也無須賦予牠們太多能力[註4]）；牠們還是具有獨特個性的個體，甚至可以被視為擁有自身行為模式的「人格」（persons），乃至做出選擇的主體，而這些觀念在動物行為學家之間已不再是禁忌[註5]。\n\n從動物的視角看待事件，還需要其他學科的支援。生態學用以重建所研究的環境並評估其對動物的影響；神經科學用以探討動物的認知能力；動物行為學則用以理解牠們的行為，尤其是那些願意在物種、社會與個體等不同尺度上考察動物的學派[註6]。\n\n這些跨學科的聯繫對於處理現有文獻至關重要。我們的目的不是用後者（科學知識）來證實前者（史料），儘管依我們今天的立場去排斥或曲解史料的誘惑很大；而是要將各種情境化的目光與知識交織在一起，因為這些文獻絕大部分是人類的。不消說，它們的可靠性、它們不完整、有限且帶有偏見的問題隨之而來。人類只對少數幾個面向感興趣，而且對這些面向也幾乎沒有記下所有事實，只記得自己能看到、想看到的東西，並以自身的想像與利益，扭曲了他對某個物種、某個社會、某個時代所抱持的確信。但這些問題在人類歷史的研究中同樣存在。在這裡，困難較大，但並沒有那麼不同。\n\n關於我們的長頸鹿，我們從羅訥河口省（Bouches-du-Rhône）省長以及兩位博物學家那裡取得了大量資訊。一位是馬賽醫學院教師薩爾茲（Salze），他為巴黎博物館撰寫了一篇論文；另一位是該博物館教授、當時最著名的博物學家之一艾蒂安・若弗魯瓦・聖希萊爾（Étienne Geoffroy Saint-Hilaire），畢竟要到馬賽迎接這頭非凡的動物，就需要一位非凡的科學家。他在旅途中寫了許多信件，抵達巴黎後並發表了對整個過程的分析[註7]。他們都優先關注這頭動物的解剖構造、動作與飲食，但也考慮到了牠的行為與反應。他們並不如人們擔心的那樣拘泥，這種新奇動物激發了他們的好奇心，他們的頭腦不受既有知識束縛，眼睛也能自由觀看。當然，他們只寫下自己想說的，只是他們所見或自以為所見的一部分，而這又只是實際發生之事的一部分。儘管如此，只要我們把這些文獻翻轉過來、從中尋找動物的那一面，它們仍能讓我們一窺事件的開展。同時也要將它們與關於長頸鹿科動物的行為學知識相對照，相關研究儘管仍然稀少，這些知識仍讓我們得以解釋、補充並提出推測。\n\n## 回到長頸鹿，令人不安地抵達馬賽\n\n然而，關於旅程在非洲與地中海的前兩個階段，文獻只提供了零星而簡短的線索。這頭長頸鹿於 1824 年底至 1825 年初生於蘇丹，四個月大時被當地人捕獲，步行到尼羅河畔，再被放在船底艙中運到亞歷山卓，頭從甲板上的一個洞裡探出來。牠確實活了下來，儘管脆弱的長頸鹿幼獸在被捕時死亡率極高，儘管同時被送往奧地利與英國的兩頭同類都很快死去。事實上，野獸進入人類世界總是代表著極端程度的閾限性，讓牠們的生命危在旦夕。這頭長頸鹿之所以撐了下來，或許是因為牠被捕時年紀夠小，還能找到替代的母親角色（照顧者、駱駝與馬），但又夠大，足以承受接連不斷的變化，因為在母親們外出覓食時，牠已經與其他幼獸在一起學會了獨立。這頭個體是雌性，天生過著群居生活，因此比單獨遊蕩的雄性更能忍受擁擠雜處[註8]。在野外，這些群體往往會自行重組，就像牠在旅途中所經歷的一樣。捕獲者把牠賣給一位總督，總督將牠送給帕夏，帕夏又將牠贈給法國領事，領事再把牠交給一位船東！但牠那獨特而非凡的性情（根據習於比較各批獵物的阿拉伯馴獸師的說法），才是牠能熬過這些磨難的原因。牠沉穩溫馴，被捕後並未試圖逃跑，這與其他個體不同。牠柔順而配合，很快就習慣與捕獲者一起自由行走。「行走時，牠從未表現出任何逃跑的念頭；反而常常像年輕的馬一樣顯得愉快。」牠會人立、跳躍，表達出一種想要活動的需求，而這種需求壓倒了壓力與抑鬱，正是這些壓力與抑鬱，使其他個體日漸衰弱[註9]。\n\n因此，我們的研究真正的起點，是與歐洲民眾的那次歷史性相遇。那是 1826 年 11 月 14 日檢疫期滿之時，人們刻意選在夜色掩護下進行，因為擔心「有巨型怪物抵達」的謠言不脛而走，也擔心引起民眾恐慌。長頸鹿「毫無懼色」地走出來，也就是說沒有抗拒；馴獸師們手中拉緊的牽繩讓牠打消了念頭，而牠大概也受到一種想要活動的欲望驅使（稍後我會再談）。牠穩穩地走著，因為牠並不真正看得清這片可能令人不安的新景象；為免驚嚇牠，周圍的人不多；前方還有一匹馬，由一位想正式向全城介紹這頭動物的馬賽知名人士騎乘。這匹馬似乎讓長頸鹿安了心，馬是牠自被捕以來就熟悉的物種。\n\n護送的人們在城門口明白了這一點。長頸鹿在那裡「突然停下，既不肯前進，也不肯後退；牠顯得害怕，又帶著焦慮。」牠對這條黑暗的通道感到恐懼（許多動物都是如此），拒絕踏入，四腿撐地，抵抗著人們一次次先往前、再往後的拉扯；最後，人們無計可施，只好讓牠轉身。這時牠看見了那匹被派到前頭開路的馬。牠先前一直看不到那匹馬，而馬的缺席讓牠心神不寧。騎士帶著馬回來了解狀況，並建議讓這匹馬當領頭者，就像羊、馬、牛等群居動物所用的領頭獸一樣。「長頸鹿一看到那匹馬 [……]，便平靜下來。」牠「緊緊地」跟在馬後面進了城，就這樣抵達省長官邸[註10]。這段插曲顯示，牠自被捕以來與之相處的那些動物，對牠的生存與適應是何等必要。這些動物構成了一條通往牠最初在草原上的經驗的紐帶。在草原上，長頸鹿群不穩定的群聚本能，以及與斑馬、羚羊等其他物種的接觸，使長頸鹿能接受甚至主動尋求其他動物的陪伴，雌性尤其如此。這讓長頸鹿熬過了在省政府一棟附屬建築中等待的六個月。那棟建築為此特地改建成馬廐，裡頭還住著兩頭幫忙哺餵長頸鹿的乳牛、兩頭要送往國家博物館的羚羊，以及兩匹用來替房間保暖的挑馬[註11]！\n\n但長頸鹿仍未真正安心，因為牠從未採取那種獨特的熟睡姿勢，也就是腹部著地趴臥，頭向後擱在右後腿上。若牠採取過這種姿勢，觀察者應該會注意到；即使在野外，這個物種為了避免暴露於掠食者面前，每晚也只會保持這種姿勢幾分鐘。然而，如今這種缺失被視為壓力極大的徵兆。長頸鹿「幾乎不躺下」，因此只是站著打盹，每次時間很短，並始終保持警覺，動用了這個物種極少睡眠的極限能力；而這種特徵在年長個體身上比在幼獸身上更明顯，幼獸理應需要更多睡眠。白天，牠似乎為房間的狹窄所苦，無論是高度還是面積都是如此，因為人們總是依自己手頭有的空間來安置動物，而不是依動物的需求，而他們對這些需求也幾乎一無所知。事實上，牠身高 11 英尺 5 英寸（約 3.5 公尺），距離 13 英尺（約 4 公尺）高的天花板並不遠，也無法真正隨意來回走動。牠還「幾乎不停地動來動去」。牠會踏步蹦跳，以減輕因頸部高度而壓在後身的負擔，這種負擔在不活動時非常累人。牠前前後後地走動，大概是出於無聊，而無聊引發了這種刻板行為[註12]。因此，這些歐洲人所觀察到、並為之狂熱不已的，是一頭行為異常、非比尋常的長頸鹿。\n\n## 恐懼、不理解與調適\n\n不活動的時候，長頸鹿會對每天聚集在牠住處前的受邀訪客產生興趣。牠常常低下頭打量他們，或把頭探出窗外，「偶爾會舔舔陌生人，也樂於嗅嗅靠近牠的人」；但當牠受到驚嚇、聽到叫喊，或察覺到那些被牠的舉動嚇到的人做出急促動作時，牠就會退縮。儘管建立在彼此的好奇心之上，這兩個世界的相遇只帶來了局部而短暫的發現，以及不理解。它也促成了雙方的相互調適，從省政府庭院裡最初的幾次散步便可見一斑。這頭動物常常拔腿奔馳，伸展四肢，把看管牠的馴獸師們一併拖著走，但很快就對用繩索拖著他們到處跑感到厭倦，尤其長頸鹿身體重心不平衡、頸子又長，奔跑本就不舒服。從此以後，牠會「高高躍起，再落下，四腿一動不動地站定」，以彌補無法奔馳的遺憾。牠會上下跳躍，或在兩步之間蹦一下，人們也由著牠；之後，牠才慢慢與他們磨合出一種雙方都能接受的節奏，也就是步行[註13]。\n\n同樣地，自 1827 年 3 月起，當人們帶牠到馬賽街頭及城外散步時，牠感到六個看管人的繩索對牠的束縛。他們阻止牠失控、也慢慢打消牠失控的念頭，並控制牠的一舉一動。隨著牠表現出相對的溫馴，牠感受到的壓力也越來越小。人們已從當初入城時學到教訓，在前頭安排了乳牛，牠很快就習慣並努力跟隨它們。牠會「聽從它們的引導」，因而對這些同樣溫馴的反芻同伴產生強烈的親近感。牛屬於牛科，就像牠在草原上接觸過的羚羊，以及馬廐裡的那兩頭羚羊。牠不只對那兩頭特定的牛感興趣，也對沿途遇到的每一頭牛感興趣。這些牛毫無懼色；相反地，馬和騾子則顯得不安，耳朵豎直，若得原地等待就用蹄子刨地，一有機會就快速走開（馬科動物對長頸鹿的氣味極為敏感），而長頸鹿則仔細地觀察、嗅聞它們，試圖跟上去，目送它們離開[註14]。牠那帶著不安的好奇心，可不只是針對人類！\n\n牠對樹木情有獨鐘。牠會仔細審視每一棵樹，拉著繩索停在樹前，逼得人們讓牠嗅一嗅、嚐一嚐樹葉。他們也照辦了，因為他們對這種自然行為（他們能觀察到的少數自然行為之一）感到好奇，雙方在這裡找到了共同點。野生長頸鹿（主要是雌性）這些細嚼慢嚥的動物整天忙於這項活動，牠藉此得以從事，但在圈養狀態下，牠卻被剝奪了這項活動。因此，在其餘時間裡，牠便透過一種後來被深入研究的刻板行為來表達挫折。牠會舔馬廐的牆壁，或在散步時用長長的舌頭捲住路人的手，路人們不明所以，還以為這是牠的尋常行為[註15]。\n\n牠對人類的喜好視情況而定。牠「樂於嗅聞」在街上和小徑上看到的、離牠最近的圍觀者，也很容許他們靠近；他們爭先恐後、吵吵嚷嚷、交談、大喊，有人驚訝、有人狂喜、有人害怕。但這頭動物「不喜歡被觸碰」，「似乎很膽怯，對聲音特別警覺」，因此會全身繃緊，擺出察覺危險時的典型姿勢，「受到干擾或驚嚇時把頭抬得很高」，頸子和耳朵都挺得直直的。然而，隨著季節更迭，牠漸漸習慣了人群的景象與嘈雜。12 月時還報導牠害怕的記者們，到了 4 月便不再提起，可能是他們不再留意，但更可能是牠克服了恐懼，從而展現出牠非凡的個性；而早已見慣的馬賽居民，也不再那麼急著趕來看長頸鹿了[註16]。\n\n不過，那些趕在牠可能死去之前聚集過來研究牠的博物學家們，則令牠感到厭煩。牠數度被繩索固定住，從臀部到耳朵被摸了一遍，以便他們替牠繪像、測量尺寸並觸診身體。當科學家們對牠的頭部產生興趣時，牠會變得緊張，牠的頭「不輕易讓人碰」，會甩來甩去。當牠感覺到嘴唇被揭起、嘴巴被掰開時，牠會試圖掙脫，並把嘴閉得又緊又固執，以至於「要數清下顎的門牙相當困難」，而對牠的「臼齒」則「根本無從得知」。當這些人試圖觸摸牠的耳朵、角以及後腦的一個突起時，牠抵抗得更加激烈，因為牠害怕遭到掠食者攻擊。於是他們只能得到粗略的測量數據。另一些時候，人們看到牠「被激得想逃」，好讓牠展示牠的動作。牠會「加快腳步、失去控制」，也就是受到驚嚇，很快便跑得上氣不接下氣。另外，當他們試圖觀察牠的防禦機制時，牠會「惱怒」到人立起來，把這些煩人的傢伙嚇跑。還有一些時候，牠會伸長頸子、抬起頭，把舌頭完全伸出來去捲人們在牠面前晃動的樹枝，而這些樹枝又被慢慢抽走，以便測量牠可及的高度、觀察牠的動作方式。牠也因此感到舌頭被人抓住、觸摸，起初這想必令牠害怕，後來則令牠厭煩[註17]。\n\n當兩個世界無法理解彼此時，牠也會感到「壓力」（stress；這個詞在動物行為學中已使用約三十年，涵蓋從焦慮到疼痛的各種狀態[註18]）。牠常常必須彎下身來，去取人們刻意放在地上的樹枝，以展示牠那古怪的姿勢。人們以為這對牠來說是平常而輕鬆的，因為他們認為在地上吃東西理所當然。「牠會先用一隻前腿把一小堆食物撥到一旁，再用另一隻，然後重複這套儀式；如此嘗試好幾次後，牠才肯彎下頸子，把嘴唇和舌頭湊到所供的食物上。」事實上，牠焦慮到只肯去吃牠最愛的含羞草，因為在野外，這種姿勢很危險，掠食者會趁著長頸鹿彎頸時發動攻擊；長頸鹿只在快速喝水時採取這種姿勢（一次吞下十五公升的水），從不用它來進食，甚至可以毫不猶豫地三四天不喝水，改以樹葉補充水分〔譯註，原文寫「不進食」，依文意應指飲水〕。牠在身體上也受到妨礙，需要花費大量時間、小心翼翼地張開前腿、收縮臀部、露出肩膀、伸長頸子；而反覆採取這個姿勢，會擾亂牠用以調節血壓劇烈變化的生理機制，因為牠的頭會從高於心臟六英尺（約 1.8 公尺）變成低於心臟同樣距離，反之亦然[註19]。\n\n飲食是這場相遇最重要的環節之一，這頭長頸鹿不斷被邀請品嚐各種食物，雙方彼此不解，一方是猶豫而驚訝的探詢，另一方則是懷疑。牠會「多少」嗅一嗅歐洲的水果和蔬菜，但不會去碰，即使是新鮮的也一樣，而對許多西方人來說，這些可是稀缺珍貴的東西。「牠吃了一點鹽，又吐了出來」，而馬和牛則最愛鹽了！人類大量食用的麵包，牠只吞了「一點點」！牠甚至拒絕異國水果，就算那些水果來自非洲、就算人們以為牠應該會順應其原本天性！牠對綠草地（當時仍很稀少）不屑一顧。長頸鹿（尤其是雌性）極少踏入草地，因為那意味著必須採取危險的姿勢；而歐洲的牲畜則對草地垂涎三尺。牠幾乎不碰隨處可見的白蠟樹，對椴樹和櫻桃樹（較為稀少珍貴）也只是淺嚐即止，卻「總是欣然回頭」去吃紅豆杉〔譯註，原文作 if，即法文 if，紅豆杉〕和崖柏，儘管它們又硬又苦！\n\n自被捕以來，牠先是喝駱駝奶，後來喝牛奶。這些奶不如長頸鹿的奶濃郁，但同樣來自反芻類動物，因此容易消化，成為牠心理穩定與生理存活的重要支柱。「一般而言，牠不喜歡冷的牛奶」，因此需要微溫的奶，也就是剛從乳房擠出來的那種，可見牠仍依戀著哺乳，就像今天許多過早與母親分離、靠奶瓶餵養、較晚才斷奶的長頸鹿幼獸一樣。牠因此迫使人們調整作法、更加用心；但牠也吃得越來越多穀物，尤其是玉米（當時仍稀少昂貴）。牠「最偏好」玉米，「單獨餵食時總是吃得很起勁」，甚至會「從大麥中一粒一粒地挑出來」；大麥、麩皮和蠶豆，牠想必也吃，而人們仍然餵給牠這些，因為它們較便宜，這是節約開支的需要。而且因為牠喜歡那些乳牛，牠在 2 月開始吃起先前拒吃的乾草，想要模仿牛，從而在某種程度上讓自己的世界向別人的世界靠攏[註20]！\n\n## 從艾克斯到巴黎的旅途折磨\n\n牠良好的表現促成了自 5 月 20 日起步行前往巴黎的遠征。牠適應了下來，習慣了每天行走的節奏。早在 24 日，牠「一看到牛準備出發，也決定動身，甚至先於馬夫的指令。」牠就這樣加強了與其他動物的聯繫，並因與人類的接觸而變得「更加親近」。牠變得「溫馴」、「完全順從」，以至於只需兩名馴獸師就能拉住繩索。牠也習慣了在戶外、在眾目睽睽之下進食喝水，而在馬賽時，牠只會在馬廐的安靜中這麼做[註21]。行經之處，牠看見、聽見、感受到周遭的一切。護送隊伍的警員們把拖車的牲口（騾、馬、閹牛，它們或多或少都不太安心）攔在路旁停住，讓牠有時間盯著它們看、嗅它們。匆匆趕來的人群比前幾個月馬賽的人群更吵更亂，讓長頸鹿全身繃緊、抬高身子，再度陷入焦慮。\n\n牠主要在人口眾多的驛站城市感到壓力。在艾克斯（Aix），牠從當時狹窄的街道進城，看到大批人潮在牠身旁奔走，爭先恐後地跑上樓房高層，探出窗外揮手，只為看得更清楚。牠聽到他們在牠頭部周圍大喊、鼓掌，而頭部正是牠最敏感的部位。牠總是被安置在一家旅店的倉庫裡，但必須出來滿足巨大人潮的好奇心，以免出發時生事。在艾克斯，牠一天之內遊行了兩次；在里昂則六次，走過街道、主要大道與廣場，好讓最多的人看到牠。在艾克斯，「好奇的人多得難以置信」，早上牠一出門，只聽到「一聲大喊，如此一致、綿長而響亮」。牠感到自己被一波波的驚呼、一陣陣爆發的驚訝包圍著，周圍全是混亂的人，警員們勉強圍住並保護隊伍，抵擋著推擠上前的圍觀群眾。\n\n牠沒有狂奔，因為看得到前方的牛而安了心，但也感受到馴獸師手中拉緊的繩索所施加的強大壓力；最後，牠被林蔭大道與廣場上的枝葉吸引。選擇這些路線，正是為了讓人看牠如何進食，並提供一場「立體」的表演，讓離得較遠的觀眾也無需推擠就能看到。牠專注於尋找好吃的葉子，忘了腳邊的聲響與騷動帶來的壓力。牠也會順口吃掉窗台上的花或棚頂上長的草，甚至沿路舔了幾隻手。牠似乎並「未因湧到牠腳邊的人群而驚慌」，這使護送者得以展示牠，觀眾得以興高采烈。其實牠確實擔心且充滿壓力，只是沒有表現出來，許多草食動物都是如此，以免引來掠食者。唯一的跡象是挺直的頸子和高高抬起的頭，而這個姿勢當時被誤讀，人們以為這是一種「威嚴」的從容。\n\n牠在里昂的白萊庫廣場（place Bellecour）最後一次遊行時驚慌失措。為了應對 6 月 9 日早上湧入的人潮，人們用一支開路的騎兵分隊取代了牛，使長頸鹿失去了主要的參照。「好奇的人群湧到牠身邊，這頭動物受到了驚嚇」，牠大概是把他們誤當成了掠食者。牠拔腿就跑，馴獸師們只好放開繩索；牠驚嚇了前頭的馬，馬又把圍觀者往前推；牠看到人群便加速，試圖避開他們；牠察覺到警員們為安撫民眾而手忙腳亂，也聽到身後有人奔跑追趕，想看牠奔馳，他們以為這是刻意安排的表演，要向他們展示這個奇觀。牠繞著路易十四的雕像〔譯註，原文誤作 state，應為 statue〕跑了一圈才停下，一方面是跑累了，又被仍緊抓繩索的第四名馴獸師的體重拖著，另一方面大概也是因為人群同時放慢了腳步，牠才平靜下來[註22]。\n\n牠的壓力大到連若弗魯瓦・聖希萊爾都察覺到了，他談到「公開展示的疲憊」，就像在艾克斯，「居民貪得無厭，長頸鹿在休息時的應酬比白天的行走更令牠疲倦。」他們因此決定在伯恩（Beaune）之後穿越莫爾万（Morvan）山區，以避開前往巴黎途中的其他大城市[註23]。牠於 6 月 30 日抵達，狀況較好（這要歸功於身體的緩慢適應），而且非常平靜，只需兩名馴獸師帶領。於是牠在沒有牛的陪同下（牛被認為太過平凡）被帶往聖克盧接受國王接見；牠走在兩位博物館教授所騎的兩匹馬後面，周圍是照顧牠的人和警員；人群或站在兩旁，或跟在長頸鹿後面，熱鬧卻無害地歡迎牠，來來去去。在庭院前，牠仍得做出一些動作，讓歐洲人對牠的行為有個（少得可憐且錯誤的）概念。在照顧者的牽拉下，牠加快了腳步，儘管長頸鹿從不小跑。牠嗅了嗅人們獻上的珍貴花瓣，這些花瓣就像牠自己一樣珍稀；當牠想品嚐時，就得彎下身子。\n\n他們大概利用了牠表面上的平靜，例如牠在巴黎植物園植物學校圍起的庭院中最初幾次兩小時的散步，牠聽得到聚集在大門口的人群大聲喊叫，牠抵達的第二天就有超過一萬人。聖克盧之行以後，牠外出的次數減少了，以確保牠得到休息，也避免牠因吃了民眾帶來的花而消化不良。民眾想模仿國王，也想看這頭動物靠近他們；而牠則貪婪地吃著那些花，長頸鹿就是這樣[註24]。\n\n要走出閾限狀態，靠的是環境的穩定與活動節奏的規律。1827 年 10 月，牠來到了越冬的住所，也就是巴黎植物園圓形館舍（rotunda）中一間狹窄的六角形隔間。這象徵著牠正式進入動物園動物的生活。牠幾乎動彈不得，尤其牆上襯著乾草，而且一名馴獸師和負責餵養與安撫牠的乳牛也住在裡面，還有一座爐子，可以讓室溫比外頭高出六度。這大概就是牠重新出現刻板動作與舔舐行為的原因！在這方面，牠外出時不被允許去吃珍貴的外來樹木，這使牠「用舌頭舔拭嘴唇來彌補這種剝奪」[註25]。儘管如此，牠似乎正在適應，只是關於這頭動物的文獻與資訊變得稀少[註26]，使我們對這第三階段的了解僅限於少數幾點。牠撐過了動物園中常在第一年發生的極高死亡率，並享受到公眾壓力的減輕，尤其在 1830 年查理十世倒台後，長頸鹿便退流行了。牠習慣了巴黎的海洋性氣候，習慣了圓形館舍裡一個接一個的鄰居，尤其是大象，以及氣味與吼叫令人不安的野獸，也習慣了其中幾頭牛的死去。1839 年，牠迎來了另一頭長頸鹿，終於可以透過次聲波進行交流。牠長到 16 英尺（約 4.9 公尺）高，1845 年以二十歲之齡死於結核病（癆病）。這種結核病的桿菌來自牛，很可能是其中一頭牛透過牛奶傳染給長頸鹿的，因為牠始終沒有改變最初的飲食。\n\n## 結語\n\n從上述各個面向浮現出一種獨特的閾限狀態，它不是連續的，而是起伏不定的，擺盪於壓力與適應之間。抵達馬賽時是劇烈的斷裂；停留馬賽期間是逐漸習慣；旅程之初，在人口與城市密集的羅訥河走廊，焦慮與疲憊再度爆發；在里昂之後，尤其是穿越寧靜的莫爾万山區時，進入緩和期；在巴黎又一次經歷壓力；最後才在巴黎植物園完成最終的適應。從動物對旅程的感知來看，我們離人類眼中那場歡慶的展示相去甚遠，轉而面對一場兩個世界之間更為微妙的相遇，其中充滿了恐懼、疑慮、不理解、學習與適應。這些在初來乍到的動物一方要重要得多，但在接納長頸鹿的人類一方也仍清晰可見。他們有時害怕、常常興奮，卻並未因此更理解牠，甚至後來連試著理解都放棄了。\n\n*〔譯註〕為譯者補充；註釋編號依原文。書目保留原文寫法；「cit.」表示本文引文出處，「op. cit.」為「前引書」，「ibid.」為「同上」。ADBR = 羅訥河口省檔案館（Archives Départementales des Bouches-du-Rhône）。*"},{"title":"關於出坡","subtitle":"","author":"","cat":"study-talks","date":"2026-11-03","slug":"grove001","source":"","notes":[],"refs":[],"body":"這幾個月下來，做事好像比較沉得住氣了。不論做什麼，心裡總會有個念頭提醒我該幹麼就幹麼。幾年前修習葛印卡老師的內觀禪，我常常只專注在呼吸上，忽略了體驗當下的各種覺受。第四次參加十日課程時，有一天，教禪的王老師突然走到我旁邊，邀請我一仝散步，他緩緩教我走路的方法。我是到那時才知道，原來自己連路都不會走。學佛大約三年，漸漸明白，平日若沒有覺照，讀再多的經論、知識也是枉然，其實正確的用功，不懂教相也無妨。\n\n六月，常妙法師回到禪林，與他相識後，我才發現要用功的地方還很多。吃飯、喝茶、走路、打掃，這些日常的事，很多時候心是散亂的，做起來模模糊糊，並不清楚。有次搬東西，他便問我怎麼把身心放在事情上，我答「我在觀察呼吸」，妙師曰「你這樣是錯的，做事就好好做事，不用觀察呼吸。真正的禪修不是這樣，如果喪失了對於當下事情的覺察，便不是禪修，到時候事情做不好，受傷了更麻煩，不要這麼笨」\n\n喝茶時，我常散心，有時候一不小心茶壺上的蓋子便會掉下來，還因此摔了幾支。也會時常讓水溢出來。一次喝茶時，妙師曰：「你連蓋子都拿到掉下來，還想要改變世界，去死一死吧。」這句話，讓我反省學佛究竟是在學什麼？他真是一位大善知識。我想，先不談名相，學佛的目標和方法大概是一體的，而且很樸實，就是「把人做好，把事做好」。真正要清楚，就得時時覺照，提醒自己該怎麼做就怎麼做，而不是讓注意力一直停在過去、未來，或當下的別處。\n\n時間和空間，大概是人最大的幻覺，卻也是最真實的感受。這樣的幻覺讓人迷惑、讓人顛倒。因為有連續性，人便以為事物是實有的。歷史學希望藉由時間的連續性，以人的想像串起證據，找出人類文明的法則，或者只是留下紀錄。地理學則先劃分出空間，思考場域中人與環境的關係，再把空間串連起來。說到底，這兩門學科各以專業知識，分析了人類幻覺的兩個面向。這種虛假的實有，造成無盡的貪愛與嗔恨，進而引發身體與心理上的種種病徵。若要破除這種實有，慧根不足的人很難直接體悟，只能藉假修真。方法上全然進入當下的種種所緣，安住其中，沒有預測，也沒有記憶，才能進入下一層的理解。\n\n當我撈水溝撈得越來越清楚時，才終於體會打掃、吃飯、飲茶、睡覺，都是在修持儀軌，差別只在當下是否用心而已。  \n\n![638950375940162030.jpg](/assets/uploads/638950375940162030.jpg)\n\n"}],"quote":"蜩與學鳩笑之曰：「我決起而飛，槍榆枋，時則不至，而控於地而已矣，奚以之九萬里而南爲？」\n適莽蒼者，三湌而反，腹猶果然。適百里者，宿舂糧。適千里者，三月聚糧。","quote_src":"《莊子・逍遙遊》","intro":"學鳩齋是許原綸的書齋，位於許宅東護龍，與茶寮「知了間」隔院相望。\n\n齋內設有四個櫃子：「自反軒」放學術論文，「拈花記」記學佛感悟，「大樹跤」收生活片段，「獺祭魚」藏圖書史料。\n\n書齋搬上網路，只是想讓腦中的想法有個安放之處，不至於散落閒置，並不是特別寫給誰看，所以請不要特別轉傳。網站可以隨意翻閱，看累了也可以坐在藤椅上發呆。\n\n有緣人路過，歡迎進來食茶。","music":[]}</script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ---------------- data ---------------- */
const rawData = document.getElementById('data').textContent.trim();
const preview = rawData === '__DA'+'TA__' || rawData === '';
const D = preview ? {
  books: [], posts: [], hou: [],
  quote: '應無所住而生其心', quote_src: '金剛經',
  intro: '學鳩齋位於左護龍，與右護龍知了間隔著天井相望。前大廳與後大廳居於中軸，四棟由轉角廊道相連。你可以到書架前看看，也可以坐在藤椅上望向庭院。'
} : JSON.parse(rawData);
const BOOKS = D.books; // [title, author, year, publisher, top, sub, kind, lang]
const POSTS = D.posts;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k){ try{return localStorage.getItem(k)}catch{return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch{} } };
const isTouch = matchMedia('(pointer:coarse)').matches;
const S = isTouch ? 0.6 : 1;                     // texture scale
function hash(s){ let h=2166136261; for (const ch of String(s)) h=Math.imul(h^ch.codePointAt(0),16777619); return h>>>0; }
function rnd(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s^=s>>>17; s^=s<<5; return ((s>>>0)%100000)/100000; }; }

/* Taipei time, day/night like the website (06–18 day) */
const now = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}));
const NIGHT = location.hash==='#night' ? true : location.hash==='#day' ? false : (now.getHours()<6 || now.getHours()>=18);
const CN = '〇一二三四五六七八九十';
const cnNum = n => n<=10?CN[n]:(n<20?'十'+(n%10?CN[n%10]:''):CN[Math.floor(n/10)]+'十'+(n%10?CN[n%10]:''));
const HOU = (()=>{ const m=now.getMonth()+1,d=now.getDate(); let cur=D.hou[D.hou.length-1] || [0,0,'','','節候資料待匯入'];
  for (const h of D.hou){ if (h[0]<m || (h[0]===m && h[1]<=d)) cur=h; } return {term:cur[2],hou:cur[3],yu:cur[4]}; })();
$('#today').textContent = `${cnNum(now.getMonth()+1)}月${cnNum(now.getDate())}日・${HOU.term}${HOU.hou}・${HOU.yu}`;

/* ---------------- renderer / scene ---------------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch?1.25:1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = NIGHT ? 1.05 : 1.0;
renderer.xr.enabled = true;
const MAXANI = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(NIGHT?0x1a2236:0xd8d7d0, 30, 85);
const fovFor=a=>a<1?82:68;
const camera = new THREE.PerspectiveCamera(fovFor(innerWidth/innerHeight), innerWidth/innerHeight, 0.05, 220);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);

/* ---------------- procedural textures ---------------- */
function ctex(w,h,draw,{rep=[1,1],color=true}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); if(color) t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); t.anisotropy=MAXANI; return t;
}
function speck(g,w,h,n,cols,a,r=[1,3]){ const R=rnd(n*7+w); for(let i=0;i<n;i++){ g.globalAlpha=a*R(); g.fillStyle=cols[Math.floor(R()*cols.length)]; const s=r[0]+R()*(r[1]-r[0]); g.fillRect(R()*w,R()*h,s,s);} g.globalAlpha=1; }
const shade = (hex,f)=>{ const c=new THREE.Color(hex); c.offsetHSL(0,0,f); return '#'+c.getHexString(); };

const T = {};
T.brick = ctex(512,512,(g,w,h)=>{
  g.fillStyle='#ded6c9'; g.fillRect(0,0,w,h);
  const random=rnd(11);
  const colors=['#985740','#92503b','#a2644c','#8e4938','#a86a50'];
  for(let row=0;row<12;row++){
    for(let col=-1;col<4;col++){
      const x=col*128+(row%2)*64,y=row*h/12;
      g.fillStyle=shade(colors[Math.floor(random()*colors.length)],(random()-.5)*.075);
      g.fillRect(x+1.5,y+1.5,125,h/12-3);
      g.fillStyle='rgba(235,183,150,.22)'; g.fillRect(x+2,y+1.5,124,1);
      g.fillStyle='rgba(78,45,34,.15)'; g.fillRect(x+2,y+h/12-2.5,124,1);
    }
  }
  speck(g,w,h,8500,['#724839','#e3ad90','#765e50'],.20,[1,4]);
});
T.white = ctex(512,512,(g,w,h)=>{ g.fillStyle='#e8e2d4'; g.fillRect(0,0,w,h); const R=rnd(5);
  for(let i=0;i<60;i++){ const x=R()*w,y=R()*h,r=20+R()*90; const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(150,135,110,.08)'); gr.addColorStop(1,'rgba(150,135,110,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r);} speck(g,w,h,1500,['#b9ae98','#fffaf0'],.25); });
T.tile = ctex(512,512,(g,w,h)=>{ g.fillStyle='#7c3a2b'; g.fillRect(0,0,w,h); const R=rnd(3);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){ g.fillStyle=shade('#b05a40',(R()-.5)*.1); g.fillRect(i*256+4,j*256+4,248,248);

function tiledRoof(parent,width,halfDepth,eave,rise,tip){
  const roof = std(T.roof,width/1.24,halfDepth/2.1);
  const underside = std(T.boards,width/2.2,halfDepth/2,{side:THREE.BackSide});
  const across=64, down=16;
  const mainRoof=tip>.3;
  const height=(u,v)=>eave+rise*(1-v)**1.26+
    tip*Math.abs(u)**8*(mainRoof ? (1-v)**2 : 1-.78*v)+
    (mainRoof ? .29*Math.abs(u)**10*v**3 : 0);
  const point=(u,v,side,lift=0)=>new THREE.Vector3(u*width/2,height(u,v)+lift,side*v*halfDepth);
  function edging(points,radius,material){
    const path=new THREE.CatmullRomCurve3(points);
    parent.add(new THREE.Mesh(new THREE.TubeGeometry(path,40,radius,8,false),material));
  }
  for(const side of [-1,1]){
    const positions=[],uvs=[],indices=[];
    for(let i=0;i<=across;i++){
      for(let j=0;j<=down;j++){
        positions.push(...point(2*i/across-1,j/down,side).toArray());
        uvs.push(i/across,j/down);
        if(i<across&&j<down){
          const a=i*(down+1)+j,b=a+down+1;
          indices.push(...(side===1?[a,a+1,b,b,a+1,b+1]:[a,b,a+1,b,b+1,a+1]));
        }
      }
    }
    const geometry=new THREE.BufferGeometry();
    geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
    geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    const outer = new THREE.Mesh(geometry,roof);
    parent.add(outer);
    const inner = new THREE.Mesh(geometry,underside);
    inner.position.y=-.11;
    parent.add(inner);
    const eaveLine=Array.from({length:65},(_,i)=>point(i/32-1,1,side));
    if(mainRoof){
      const fasciaPositions=[],fasciaIndices=[];
      eaveLine.forEach((tile,i)=>{
        fasciaPositions.push(tile.x,tile.y,tile.z,tile.x,tile.y-.20,tile.z);
        const a=2*i;
        if(i>0) fasciaIndices.push(a-2,a-1,a,a,a-1,a+1);
      });
      const fascia=new THREE.BufferGeometry();
      fascia.setAttribute('position',new THREE.Float32BufferAttribute(fasciaPositions,3));
      fascia.setIndex(fasciaIndices);
      fascia.computeVertexNormals();
      const fasciaMaterial=new THREE.MeshStandardMaterial({
        color:0x553529,roughness:.9,side:THREE.DoubleSide
      });
      parent.add(new THREE.Mesh(fascia,fasciaMaterial));
      edging(eaveLine.map(tile=>tile.clone().add(new THREE.Vector3(0,-.19,0))),.043,M.woodDark);
    }
    edging(eaveLine,mainRoof ? .105 : .085,ridgeClay);
    for(const end of [-1,1]){
      edging(Array.from({length:13},(_,j)=>point(end,j/12,side,.055)),.09,trim);
    }
  }
  edging(Array.from({length:41},(_,i)=>point(i/20-1,0,1,.07)),.13,ridgeClay);
  edging(Array.from({length:41},(_,i)=>point(i/20-1,0,1,.18)),.043,trim);
  if(mainRoof){
    // Extrude the continuous ridge-end profile so the fork reads in silhouette.
    for(const end of [-1,1]){
      const base=point(end,0,1,.07);
      const profile=new THREE.Shape();
      profile.moveTo(-.28,-.12);
      profile.bezierCurveTo(.05,-.16,.52,-.06,.91,.24);
      profile.quadraticCurveTo(1.05,.35,1.16,.50);
      profile.quadraticCurveTo(.83,.37,.55,.33);
      profile.bezierCurveTo(.72,.48,.88,.77,.94,1.03);
      profile.bezierCurveTo(.62,.74,.34,.36,-.28,-.02);
      profile.closePath();
      const tail=new THREE.Mesh(new THREE.ExtrudeGeometry(profile,{
        depth:.17,bevelEnabled:true,bevelThickness:.028,bevelSize:.022,bevelSegments:2,curveSegments:18
      }),ridgeClay);
      tail.position.set(base.x,base.y,-end*.085);
      tail.rotation.y=end===1 ? 0 : Math.PI;
      parent.add(tail);
    }
  }
}

    const ring=new THREE.Mesh(new THREE.TorusGeometry(.045,.008,8,20),iron); ring.position.set(-side*.86,1.25,.04); pv.add(ring);
    const plate=cylinder(.03,.03,.01,iron,-side*.86,1.29,.035,pv); plate.rotation.x=Math.PI/2;

  DOORS[key]={leaves,bar,open:true,k:1,barK:0,rest:key==='S'?{x:1.95,y:.82,z:3.78}:{x:1.9,y:.04,z:3.7}};

  const b=d.bar, t=d.barK, r=d.rest; b.position.set(r.x*(1-t), r.y+(1.25-r.y)*t, r.z+(3.89-r.z)*t); }

function updateSky(){
  const [hour,minute]=taipeiClock.format(new Date()).split(':').map(Number);
  const time=location.hash==='#night'?0:location.hash==='#day'?12:hour+minute/60;
  const angle=(time-6)*Math.PI/12;
  const altitude=Math.sin(angle);
  const day=THREE.MathUtils.smoothstep(altitude,-.15,.23);
  const warm=day*(1-THREE.MathUtils.smoothstep(altitude,.08,.44));
  skyTop.set('#0b1428').lerp(new THREE.Color('#227fc4'),day);
  skyHorizon.set('#27334d').lerp(new THREE.Color('#b8dcf1'),day).lerp(new THREE.Color('#f6aa74'),warm);
  scene.fog.color.copy(skyHorizon);
  daylight.position.set(-29*Math.cos(angle),Math.max(2,29*altitude),courtAxis+11);
  daylight.intensity=1.55*THREE.MathUtils.smoothstep(altitude,0,.30);
  daylight.color.set('#fff5e6').lerp(new THREE.Color('#ffa760'),warm);
  ambientSky.intensity=.53+.68*day;
  ambientSky.color.copy(skyHorizon);
  sunDisk.visible=altitude>0;
  sunDisk.position.copy(daylight.position).sub(skyCenter).normalize().multiplyScalar(86).add(skyCenter);
  sunDisk.material.color.copy(daylight.color);
  cloudMaterial.color.set('#60708e').lerp(new THREE.Color('#f6f5ec'),day);
  cloudMaterial.opacity=.36+.36*day;
  starMat.opacity=Math.max(0,1-day*1.6); moon.visible=day<.5; moon.material.opacity=1-day*2;
  daylight.castShadow=daylight.intensity>.02; renderer.shadowMap.needsUpdate=true;
}

// colour temperature (Kelvin) to an RGB light colour
function kelvin(k){ const t=k/100; let r,g,b;
  r=t<=66?255:329.698727446*Math.pow(t-60,-.1332047592);
  g=t<=66?99.4708025861*Math.log(t)-161.1195681661:288.1221695283*Math.pow(t-60,-.0755148492);
  b=t>=66?255:(t<=19?0:138.5177312231*Math.log(t-10)-305.0447927307);
  const c=v=>Math.max(0,Math.min(255,v))/255; return new THREE.Color().setRGB(c(r),c(g),c(b),THREE.SRGBColorSpace); }
const ctemp=$('#ctemp'), ctempValue=$('#ctempValue');
{ const v=LS.get('hk-ctemp'); if(v&&/^\d{4}$/.test(v)) ctemp.value=v; }
ctemp.addEventListener('input',()=>{ LS.set('hk-ctemp',ctemp.value); applyLighting(); });

}

function plaque(text,w,h,{font='Reisho',bg='#1f1915',fg='#c9a45c',size=.62,frame='#7a5a2e'}={}){
  text=[...text].reverse().join('');   // 匾額一律右起，一律日本隷書
  const pw=Math.round(1024*S*w/Math.max(w,h)*1.0), ph=Math.round(pw*h/w);
  return textCanvas(pw,ph,(g,W,H)=>{ g.fillStyle=frame; g.fillRect(0,0,W,H); g.fillStyle=bg; const b=Math.max(6,H*.07); g.fillRect(b,b,W-2*b,H-2*b);
    g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle'; let fs=H*size; g.font=`${fs}px Reisho`;
    const chars=[...text.replace(/歷/g,'歴')], gap=chars.length<=4?1.3:1.02, cell=ch=>(ch==='　'||ch==='・')?fs*.5:fs*gap;
    let total=chars.reduce((a,c)=>a+cell(c),0); if(total>W*.9){ fs*=W*.9/total; g.font=`${fs}px Reisho`; total=chars.reduce((a,c)=>a+cell(c),0); }
    let x=(W-total)/2; const y=H/2+fs*.04;
    for(const ch of chars){ const cw=cell(ch);
      if(ch==='跤'){ g.save(); g.translate(x+cw*.27,y); g.scale(.5,1); g.fillText('足',0,0); g.restore(); g.save(); g.translate(x+cw*.73,y); g.scale(.56,1); g.fillText('交',0,0); g.restore(); }
      else if(ch!=='　') g.fillText(ch,x+cw/2,y);
      x+=cw; } });
}

function tickZhiliao(dt){ const now=Date.now(), tt=performance.now()/1000;
  // shoji follow the shared state
  { const want=doorState('Z'); SHOJI.open=want; const t=want?1:0; if(SHOJI.k!==t){ SHOJI.k+=Math.sign(t-SHOJI.k)*Math.min(Math.abs(t-SHOJI.k),dt*1.6); shojiPose(); } }
  // window light follows the sky; the fireplace flickers
  { const day=Math.min(1,daylight.intensity/1.4); winLight.intensity=1.2+16*day; winLight.color.set(day>.1?0xfff2dc:0x9fb2d8); winSky.color.set(0x1c2638).lerp(new THREE.Color(0xe8eef0),day);
    if(fireplace.light){ const f=fireplace.on?1:0; fireplace.light.intensity=f*2.2*(.85+.1*Math.sin(tt*9)+.05*Math.sin(tt*21)); fireFlame.opacity=f; fireFlame.map.offset.x=(tt*.05)%1; } }
  // gongfu
  const GF=sharedLatest('gf',myGF), gel=GF?(now-GF.at)/1000:1e9;
  const glow=gel<0?0:gel<5?gel/5:gel<TEA_LAST?1:Math.max(0,1-(gel-TEA_LAST)/600);
  emberGF.emissiveIntensity=glow*(1.4+.4*Math.sin(tt*7)+.2*Math.sin(tt*13)); brazier.light.intensity=glow*1.4*(.9+.1*Math.sin(tt*11));
  const boilK=gel>6&&gel<TEA_LAST?Math.min(1,(gel-6)/6):0;
  for(const s of brazier.steam){ s.t=(s.t+dt*.5)%1; s.sp.position.set(brazier.spout.x+s.t*.05+Math.sin(s.t*8)*.01,brazier.spout.y+s.t*.3,Math.sin(s.t*6+s.sp.id)*.015); s.sp.material.opacity=.35*boilK*Math.sin(s.t*Math.PI); s.sp.scale.setScalar(.03+s.t*.1); }
  const served=gel>=22&&gel<TEA_LAST; const col=GF?TEAS[GF.t][2]:0;
  for(const c of GF_CUPS){ c.visible=served; c.userData.tea.visible=served; if(served) c.userData.tea.material.color.setHex(col); }
  for(const c of PINZI){ c.userData.tea.visible=served; if(served) c.userData.tea.material.color.setHex(col); }
  if(GF&&gel<40&&(GF.mine||GF_SEATS.includes(ME.seat))){ const idx=GF_STEPS.filter(([t])=>gel>=t).length-1; const sk=GF.at+':'+idx;
    if(idx>=0&&sk!==gfStepSeen){ gfStepSeen=sk; toast(GF_STEPS[idx][1](TEAS[GF.t][0]),6000); if(idx===0) crackle(4); if(idx===1) noiseBurst(5,300,.6,.05); if(idx===4) pour(1.6); if(idx===5) pour(1.2); if(idx===6) bell(); } }
  // irori
  const IR=sharedLatest('ir',myIR), iel=IR?(now-IR.at)/1000:1e9;
  const want=irMode==='on'||(irMode==='auto'&&irSeason())||(iel<TEA_LAST&&irMode!=='off')?1:0;
  irori.fire+=(want-irori.fire)*Math.min(1,dt*.6);
  const fl=irori.fire*(.85+.1*Math.sin(tt*9)+.05*Math.sin(tt*23));
  ember.emissiveIntensity=1.6*fl; irori.light.intensity=3.2*fl;
  for(const s of irori.steam){ s.t=(s.t+dt*.4)%1; s.sp.position.set(irori.spout.x+s.t*.06,irori.spout.y+s.t*.35,Math.sin(s.t*6+s.sp.id)*.02); s.sp.material.opacity=.3*Math.max(0,irori.fire-.3)*Math.sin(s.t*Math.PI); s.sp.scale.setScalar(.04+s.t*.12); }
  const iserv=iel>=12&&iel<TEA_LAST;
  IRORI_CUPS.forEach(c=>{ c.visible=iserv; c.userData.tea.visible=iserv; if(iserv) c.userData.tea.material.color.setHex(TEAS[IR.t][2]); });
  if(IR&&iel<30&&(IR.mine||IRORI_SEATS.includes(ME.seat))){ const idx=IR_STEPS.filter(([t])=>iel>=t).length-1; const sk=IR.at+':'+idx;
    if(idx>=0&&sk!==irStepSeen){ irStepSeen=sk; toast(IR_STEPS[idx][1](TEAS[IR.t][0]),5000); if(idx===0||idx===2) pour(1.4); if(idx===3) pour(1.0); if(idx===4) bell(); } }
  // my snack in front of me
  const st=ME.seat>=0?SEATS[ME.seat]:null, sp=st&&SEAT_SPOT[st.kind];
  mySnackMesh.visible=mySnack>=0&&!!sp&&sp[0]>0;
  if(mySnackMesh.visible){ const [fx,fz]=lookY(st.yaw); mySnackMesh.position.set(st.x+fx*(sp[0]+.08)+fz*.2,sp[1]-.04,st.z+fz*(sp[0]+.08)-fx*.2); mySnackMesh.rotation.y=st.yaw; }

function tickExtras(dt){

  if(brewing){ const k=(performance.now()-brewing.t0)/brewing.dur;

    const sp=dt*1.4;

    else { if(d.k>0) d.k=Math.max(0,d.k-sp); else d.barK=Math.min(1,d.barK+sp*1.6); }

  // breeze
  { const t=performance.now()/1000, gust=.5+.5*Math.sin(t*.23)*Math.sin(t*.61);
    if(PINE){ PINE.rotation.z=Math.sin(t*.9)*.008*(1+gust); PINE.rotation.x=Math.sin(t*.7+1)*.006*(1+gust); }
    LANTERNS.forEach((l,i)=>{ l.rotation.z=Math.sin(t*1.3+i)*.05*(.4+gust); l.rotation.x=Math.sin(t*1.1+i*2)*.03*(.4+gust); });

  tickZhiliao(dt);

  // cigarette smoke

  // record player: shared state, spatial volume, spinning platter
  syncT+=dt; if(syncT>.5){ syncT=0; syncRecord(); }
  trySeek();

  const inOtherRange = axisZ>=0 || Math.abs(x)>Math.abs(axisZ);

  if(!(inRoom||inYard||inDoor||inMatchingRoom)) return false;
  if(zlBlocked(x,z)) return false;
  for(const o of OBST) if(x>o.x0-0.22&&x<o.x1+0.22&&z>o.z0-0.22&&z<o.z1+0.22) return false;
  return true; }

// straight line if it is clear; otherwise a grid search (A*) over walkable cells, then pull the path tight
function clearLine(a,b){ const n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/.06)); for(let k=1;k<=n;k++){ if(!walkable(a.x+(b.x-a.x)*k/n,a.z+(b.z-a.z)*k/n)) return false; } return true; }

    const k=id(i,j); if(done[k]) continue; done[k]=1; if(k===goal) break;
