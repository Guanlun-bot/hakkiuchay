      <h2>關於這個名字</h2>
      <div class="body">
        <blockquote class="quote">孟春之月……東風解凍，蟄蟲始振，魚上冰，獺祭魚，鴻雁來。<cite>《禮記・月令》</cite></blockquote>
        <p>水獺捕得魚，先排在岸邊，像是祭祀。後人借來形容寫作時把書冊攤滿一桌、多用典故，相傳李商隱便有此號。這裡收的，就是攤在桌上的那些書與摘句。</p>
        <p class="sample-note">獺祭魚另設專站，即將開放。</p>
