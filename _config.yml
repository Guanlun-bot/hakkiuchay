title: 學鳩齋
# 網站網址：https://hakkiuchay.space/ （網域記在根目錄的 CNAME 檔）
# 若改回 https://guanlun-bot.github.io/hakkiuchay/ ，baseurl 要改回 "/hakkiuchay"、url 改回 "https://guanlun-bot.github.io"，並刪除 CNAME。
baseurl: ""
url: "https://hakkiuchay.space"
lang: zh-Hant
# 新文章電子郵件通知的小程式網址（Cloudflare Worker，見 _notify/）。留空時文章下方不顯示訂閱欄。
notify_url: ""
timezone: Asia/Taipei
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: /posts/:year/:month/:day/:title/
exclude:
  - README.md
  - CLAUDE.md
  - .pages.yml
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
