npc:
  - key: who.yu
    when: "人物：玉姨（甲＝本名，乙＝稱呼）"
    a: "林玉"
    b: "玉姨"
  - key: who.xu
    when: "人物：許總管（甲＝本名，乙＝稱呼）"
    a: "許文欽"
    b: "許總管"
  - key: who.chun
    when: "人物：阿春（甲＝本名，乙＝稱呼）"
    a: "陳春"
    b: "阿春"
  - key: who.shui
    when: "人物：水生叔（甲＝本名，乙＝稱呼）"
    a: "吳水生"
    b: "水生叔"
  - key: who.huo
    when: "人物：火師（甲＝本名，乙＝稱呼）"
    a: "黃金火"
    b: "火師"
  - key: who.cai
    when: "人物：阿財（甲＝本名，乙＝稱呼）"
    a: "蔡進財"
    b: "阿財"
  - key: yu.first
    when: "玉姨：訪客第一次進門"
    a: "您是來吃茶的？前頭廊下那位是許總管。慢一步，門檻有點高。"
    b: "頭一回來吧？先到前廊找許總管。門檻高，腳抬一下。"
  - key: yu.again
    when: "玉姨：再次來訪"
    a: "您又來啦。裡頭請。"
    b: "我才把門埕掃好。來，這邊走。"
  - key: yu.sweep
    when: "玉姨：正在掃地"
    a: "等我把這撮葉子掃到邊上，您再過。"
    b: "一早風大，掃兩遍還有葉子。"
  - key: yu.rain
    when: "玉姨：下雨時"
    a: "下雨了，進門慢些，石頭溼滑。"
    b: "簷下站一下吧。門邊這塊石頭溼了。"
  - key: yu.tea
    when: "玉姨：茶包送到門口，等阿財來搬"
    a: "方才送來兩包茶，我擱在凳旁，等阿財來搬。"
    b: "茶送到了，我已請人去叫阿財。"
  - key: yu.bye
    when: "玉姨：訪客離開時"
    a: "慢走，過門檻留神。"
    b: "改日再來吃茶。"
  - key: xu.first
    when: "許總管：第一次見面"
    a: "您是來吃茶的？若不熟路，我領您去。"
    b: "我姓許。宅裡要找人、找地方，先問我就好。"
  - key: xu.lead
    when: "許總管：開始帶路"
    a: "這邊請。前頭轉角，我等您。"
    b: "沿廊走就到了，您跟我來。"
  - key: xu.wait
    when: "許總管：在轉角等訪客跟上"
    a: "我在轉角這兒，您慢慢來。"
    b: "我在廊柱旁等您。"
  - key: xu.arrive
    when: "許總管：到了茶室"
    a: "茶室到了，您請進。"
    b: "就是這間。若阿春在裡頭，您可以請她奉茶。"
  - key: xu.find
    when: "許總管：回答某人在哪裡（{稱呼}{工作區}{方向提示}會自動換掉）"
    a: "{稱呼}這會兒在{工作區}，沿{方向提示}過去就見得著。"
    b: "要找{稱呼}的話，先到{工作區}看看。"
  - key: xu.today
    when: "許總管：問今日的事（甜粿已上茶席）"
    a: "火師蒸了一籠甜粿，阿春已端去茶室。"
    b: "今日茶席添了甜粿，您進茶室就看得見。"
  - key: chun.ask
    when: "阿春：問訪客想喝什麼"
    a: "您喝濃些，還是我沖淡一點？"
    b: "水剛熱。您平時喝哪一種？"
  - key: chun.served
    when: "阿春：茶已泡好"
    a: "頭一杯還燙，您慢慢喝。"
    b: "茶給您擱這兒，杯子還熱。"
  - key: chun.tray
    when: "阿春：端著盤子時被叫住"
    a: "讓我先把盤子放下，兩手都占著呢。"
    b: "借一借，我把這盞送到裡頭。"
  - key: chun.steaming
    when: "阿春：甜粿還在蒸"
    a: "火師還在顧籠，得等一會兒。"
    b: "您先吃茶。灶腳那邊還沒喊我。"
  - key: chun.cake
    when: "阿春：甜粿端到茶室"
    a: "甜粿來了，切時還有些黏。"
    b: "這碟剛端來，您趁溫的吃。"
  - key: chun.writing
    when: "阿春：在備茶處練寫帳"
    a: "我在練記帳。方才用掉幾盞茶，正好拿來練。"
    b: "許總管教我把數目寫齊，我收完茶盤再寫一遍。"
  - key: shui.water
    when: "水生叔：澆水"
    a: "等我把這株澆完。您看，水要沿根下。"
    b: "這畦乾得快，我清早就得走一趟。"
  - key: shui.bud
    when: "水生叔：含笑還是花苞（晚上）"
    a: "這株搬過兩回，今年才又長花苞。"
    b: "您看葉子底下，那粒白的快開了。"
  - key: shui.bloom
    when: "水生叔：含笑開花（白天）"
    a: "花開了，您靠近些聞。"
    b: "今早開了兩朵，香在這邊。"
  - key: shui.prune
    when: "水生叔：修枝"
    a: "我先找枯枝。這截還有嫩芽，留著。"
    b: "昨夜折了一枝，我剪平就好。"
  - key: huo.noWood
    when: "火師：等柴"
    a: "米漿備好了，等阿財送柴來。"
    b: "灶火弱了些。得等乾柴到了，才好上籠。"
  - key: huo.wood
    when: "火師：柴送到"
    a: "乾柴放灶門邊就好。小心那截木頭有刺。"
    b: "放在右手邊，我挑兩根細的起火。"
  - key: huo.steaming
    when: "火師：正在蒸"
    a: "正蒸著。蒸籠得蓋嚴，再等一會兒。"
    b: "您聽，那水才滾上來，還早呢。"
  - key: huo.handoff
    when: "火師：甜粿出籠，交給阿春"
    a: "阿春，拿布墊著。這一碟先送茶室。"
    b: "粿好了，盤底還燙，端穩些。"
  - key: huo.sent
    when: "火師：甜粿已端去茶室"
    a: "阿春端去茶室了。您在茶桌那邊找她。"
    b: "這一籠已上席，想嚐就往茶室去。"
  - key: huo.rest
    when: "火師：收拾、休息"
    a: "鍋洗完我就歇一會兒，飯還溫著。"
    b: "我替阿財留了飯，他一忙就忘了吃。"
  - key: cai.stopped
    when: "阿財：挑擔時被叫住"
    a: "借過一下，這擔是往灶腳去的。"
    b: "我先把柴擱下。您要找哪位？"
  - key: cai.tea
    when: "阿財：去門口搬茶"
    a: "玉姨說門邊還有兩包茶，我這就搬去庫裡。"
    b: "茶我來扛，您替我留一點走路的地方就好。"
  - key: cai.wood
    when: "阿財：把柴送到灶腳"
    a: "火師，兩捆都乾的。我放灶門右邊。"
    b: "柴送到了。細的在上頭，伸手就拿得著。"
  - key: cai.water
    when: "阿財：挑水"
    a: "桶裝太滿，走兩步就灑，我留一指寬。"
    b: "您先過。我提著水，轉身慢些。"
  - key: xu.todayWait
    when: "許總管：問今日的事（甜粿還沒好）"
    a: "今日火師要蒸一籠甜粿，柴一到就上籠。"
    b: "灶腳正忙著甜粿，等出了籠，阿春會端去茶室。"
  - key: xu.findNone
    when: "許總管：找不到那個人"
    a: "我也在找他，等等再問我。"
    b: "我也在找他，等等再問我。"
  - key: xu.self
    when: "許總管：訪客說自己走走"
    a: "您慢慢走走，有事再喊我。"
    b: "好，您自在些。我在前廊。"
  - key: xu.cancel
    when: "許總管：訪客說不用帶了"
    a: "那我先回前廊，有事再喊我。"
    b: "好，我不跟了。要去茶室，沿廊往裡就是。"
