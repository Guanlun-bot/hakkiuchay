<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>學鳩齋・線上書齋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>

:root{--paper:#f1efe8;--card:#f7f6f1;--ink:#3f3a39;--ink-soft:#6e6866;--rule:#d3cec3;--seal:#a8343a;
--c-academic:#3e5873;--c-talks:#3d6b4f;--c-life:#86683c;--c-taji:#a8343a;--f:"Noto Serif TC","Songti TC","PMingLiU",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1714;color:var(--ink);font-family:var(--f)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:var(--f);cursor:pointer}
.hide{display:none!important}
/* gate */
#gate{position:fixed;inset:0;z-index:50;background:#f1efe8;color:var(--ink);overflow:auto;transition:opacity .6s}
#gate.out{opacity:0;pointer-events:none}
#gate .gwrap{max-width:760px;margin:0 auto;padding:4vh 22px 30px}
#gate .gsky{height:120px;position:relative;overflow:hidden}
#gate .gbird{position:absolute;width:118px;left:50%;top:30px;transform:translateX(-50%)}
#gate .gtitle{font-family:Reisho,ReishoFull,var(--f);font-size:46px;letter-spacing:.12em;line-height:1.1}
#gate .gsub{font-size:14px;color:#6b6358;margin:6px 0 22px;border-left:3px solid var(--seal);padding-left:10px}
#gate .gmain{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
#gate .gprev{flex:0 0 160px;display:flex;justify-content:center;padding-top:6px;border:1px solid var(--rule);background:#faf8f3}
#gate .gform{flex:1 1 320px;display:grid;grid-template-columns:52px 1fr;gap:10px 12px;align-items:center}
#gate .gl{font-size:14px;color:#6b6358}
#gate input{font-family:var(--f);font-size:17px;padding:7px 10px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px;width:100%;max-width:260px;box-sizing:border-box}
#gate input.need{border-color:var(--seal)}
#gate .gopt{display:flex;flex-wrap:wrap;gap:6px}
#gate .gopt button{font-size:14px;padding:5px 12px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px}
#gate .gopt button.on{background:var(--ink);color:#f1efe8;border-color:var(--ink)}
#gate .gsw{display:flex;gap:7px;flex-wrap:wrap}
#gate .gsw button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--rule)}
#gate .gsw button.on{box-shadow:0 0 0 2px var(--ink)}
#gate .gnote{grid-column:1/-1;font-size:12px;color:#857c70;margin:2px 0 0}
#gate .gbtn{grid-column:1/-1;justify-self:start;font-size:17px;padding:9px 34px;background:var(--seal);color:#fff;border:0;border-radius:2px;letter-spacing:.3em;margin-top:6px}
#gate .gbtn:disabled{opacity:.6}
#planlabels{position:fixed;inset:0;pointer-events:none;z-index:9}
#planlabels .pl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;margin:-9px 0 0 -6px;background:rgba(241,239,232,.88);padding:1px 6px 1px 3px;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#planlabels .pl i{width:10px;height:10px;border-radius:50%;display:inline-block}
#planlabels .pl.me{background:var(--ink);color:#f1efe8}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#brand{position:absolute;left:14px;top:12px;background:rgba(241,239,232,.92);padding:8px 14px 9px;border-left:3px solid var(--seal);box-shadow:0 2px 12px rgba(0,0,0,.25)}
#brand .n{font-family:Reisho,var(--f);font-size:26px;line-height:1.1;color:var(--ink)}
#lighting,#ctempRow{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:7px;pointer-events:auto}
#lighting input,#ctempRow input{width:88px;accent-color:var(--seal)}
#ctempRow input{accent-color:#8a7a5a;background:linear-gradient(90deg,#ffb46b,#fff4e6,#cfe0ff);border-radius:4px;height:6px;-webkit-appearance:none;appearance:none}
#lighting output,#ctempRow output{min-width:3em;text-align:right}
#brand .t{font-size:12px;color:var(--ink-soft);margin-top:3px;letter-spacing:.05em}
#people{position:absolute;right:14px;top:12px;background:rgba(241,239,232,.92);padding:8px 12px;font-size:13px;min-width:150px;max-width:240px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#people .h{font-size:12px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#people .p{display:flex;gap:6px;align-items:baseline;line-height:1.7}
#people .dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
#people .st{color:var(--ink-soft);font-size:12px;margin-left:auto;white-space:nowrap}
#bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96vw}
#bar button{background:rgba(241,239,232,.94);border:1px solid var(--rule);color:var(--ink);font-size:14px;padding:8px 14px;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.22);letter-spacing:.08em}
#bar button:hover{background:#fff}
#bar button:disabled{opacity:.5;cursor:default}
#planbar{position:absolute;right:14px;bottom:70px;display:flex;flex-direction:column;gap:6px}
#planbar button{background:rgba(241,239,232,.94);border:1px solid var(--rule);color:var(--ink);font-size:14px;padding:7px 12px;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.22)}
#hint{opacity:0;position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(30,26,23,.78);color:#efe8da;font-size:13px;padding:8px 14px;border-radius:2px;line-height:1.7;text-align:center;max-width:92vw;pointer-events:none;transition:opacity .8s}
#drink{position:absolute;left:14px;bottom:14px;background:rgba(241,239,232,.94);padding:6px 10px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.22);display:flex;gap:8px;align-items:center}
#drink button{font-size:12px;padding:3px 8px;border:1px solid var(--rule);background:#fff;border-radius:2px;color:var(--ink)}
.menu li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.vol{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}
.vol input{flex:1;accent-color:var(--seal)}
#timer{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(241,239,232,.95);padding:10px 16px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.25);border-top:3px solid var(--c-talks)}
#timer .lab{font-size:12px;color:var(--ink-soft);letter-spacing:.2em}
#timer .clk{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1.2}
#timer .row{display:flex;gap:6px;margin-top:6px;justify-content:center}
#timer button{font-size:13px;padding:5px 10px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px}
#timer button.pri{background:var(--c-talks);color:#fff;border-color:var(--c-talks)}
/* side panel */
#panel{position:fixed;right:0;top:0;bottom:0;width:min(400px,100vw);background:var(--paper);z-index:20;box-shadow:-6px 0 24px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s cubic-bezier(.22,.61,.36,1)}
#panel.open{transform:none}
#panel .ph{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
#panel .ph h2{font-size:18px;margin:0;font-weight:600;flex:1;line-height:1.4}
#panel .x{border:0;background:none;font-size:22px;color:var(--ink-soft);padding:0 4px;line-height:1}
#panel .pb{overflow:auto;padding:12px 16px 24px;flex:1;-webkit-overflow-scrolling:touch}
.srch{width:100%;font:15px var(--f);padding:9px 10px;border:1px solid var(--rule);background:#fff;border-radius:2px;outline:none;margin-bottom:8px}
.meta{font-size:12px;color:var(--ink-soft)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 2px;border-bottom:1px solid #e3dfd5;cursor:pointer;line-height:1.5}
.list li:hover{background:#ebe7dd}
.list .bt{font-size:14.5px}
.list .ba{font-size:12px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 10px}
.chips button{font-size:12.5px;padding:4px 9px;border:1px solid var(--rule);background:#fff;border-radius:2px;color:var(--ink)}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card dl{display:grid;grid-template-columns:4.5em 1fr;gap:6px 10px;margin:8px 0 14px;font-size:14px}
.card dt{color:var(--ink-soft)}
.card dd{margin:0}
.card .tt{font-size:19px;font-weight:600;line-height:1.5}
.btn{display:inline-block;font-size:13.5px;padding:7px 12px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px;text-decoration:none;margin:0 6px 6px 0}
.btn.pri{background:var(--seal);color:#fff;border-color:var(--seal)}
.sec{font-size:13px;letter-spacing:.2em;margin:14px 0 4px;padding-left:8px;border-left:3px solid}
/* reader */
#reader{position:fixed;inset:0;z-index:30;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch}
#reader .rw{max-width:720px;margin:0 auto;padding:28px 22px 80px}
#reader .top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--rule);margin-bottom:22px;z-index:1}
#reader h1{font-size:24px;line-height:1.5;margin:0 0 6px;font-weight:700}
#reader .sub{color:var(--ink-soft);font-size:15px;margin-bottom:4px}
#reader .by{color:var(--ink-soft);font-size:13px;margin-bottom:22px}
#reader .src{font-size:13px;color:var(--ink-soft);background:var(--card);padding:10px 12px;border-left:3px solid var(--rule);margin-bottom:22px;line-height:1.8}
#reader article{font-size:16.5px;line-height:2;text-align:justify}
#reader article p{margin:0 0 1.1em}
#reader article h2{font-size:19px;margin:1.8em 0 .6em}
#reader article h3{font-size:17px;margin:1.5em 0 .5em}
#reader blockquote{margin:0 0 1.2em;padding:4px 0 4px 16px;border-left:3px solid var(--rule);color:#5b5553;font-size:15.5px}
#reader sup a{color:var(--seal);text-decoration:none;font-size:11px}
#reader .img{display:block;font-size:13px;color:var(--ink-soft);border:1px dashed var(--rule);padding:8px 12px;margin:0 0 1.2em;text-decoration:none}
#reader .notes{border-top:1px solid var(--rule);margin-top:30px;padding-top:14px;font-size:13.5px;line-height:1.8;color:#555}
#reader .notes li{margin-bottom:6px}
#reader a{color:var(--c-academic)}
@media (max-width:640px){#brand .n{font-size:21px}#people{font-size:12px;min-width:0;top:107px;right:auto;left:14px;padding:6px 10px}#people .st{margin-left:10px}#bar button{padding:8px 10px;font-size:13px}#hint{bottom:110px}}
#aim{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;text-shadow:0 0 3px black;pointer-events:none;z-index:5;font:22px monospace}
#hud #utility{position:fixed;top:12px;right:12px;z-index:8;pointer-events:auto;color:#332d26}
#utility summary{cursor:pointer;background:#f1efe8;border:1px solid #a39a8f;padding:6px 12px;width:max-content;margin-left:auto}
#utility-body{margin-top:8px;background:#f1efe8;padding:12px;width:min(290px,85vw);max-height:70vh;overflow:auto;border:1px solid #a39a8f}
#utility #people,#utility #brand,#utility #bar{position:static;inset:auto;width:auto;max-width:none;margin:0 0 10px;transform:none}
#utility #bar{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px}
body:has(#utility[open]) #aim{visibility:hidden}
#aim-action{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#29231ee8;padding:4px 8px;border-radius:3px;font:14px system-ui}
</style>

  const G=window.__gate={name:(LS.get('hk-name')||'').trim().slice(0,12),color:LS.get('hk-color')||COLORS[Math.floor(Math.random()*COLORS.length)],look};
  if(G.name==='訪客') G.name='';
  const $=s=>document.querySelector(s), inp=$('#gname'), btn=$('#genter'); inp.value=G.name;
  const sw=$('#gsw'); sw.innerHTML=COLORS.map(c=>`<button data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
  function svg(){ const L=G.look, c=G.color, f=L.g==='f', sh=f?24:28, skin='#e7cfb4', hair='#1d1a18'; let s='';
    const dark=(()=>{ const n=parseInt(c.slice(1),16); const r=(n>>16)*.62|0, g=(n>>8&255)*.62|0, b=(n&255)*.62|0; return `rgb(${r},${g},${b})`; })();
    if(L.o==='robe'){ s+=`<path d="M${60-sh} 70 L${60+sh} 70 L${60+(f?27:36)} 196 L${60-(f?27:36)} 196 Z" fill="${c}"/><rect x="53" y="64" width="14" height="8" fill="${dark}"/><rect x="${55}" y="198" width="9" height="5" fill="#1a1716"/><rect x="66" y="198" width="9" height="5" fill="#1a1716"/>`; }
    else if(L.o==='suit'){ s+=`<path d="M${60-sh} 70 L${60+sh} 70 L${60+sh-3} 132 L${60-sh+3} 132 Z" fill="${c}"/><path d="M53 70 L67 70 L60 96 Z" fill="#f2efe8"/>`+(f?'':`<path d="M58 74 L62 74 L63 98 L60 103 L57 98 Z" fill="#7a2a2a"/>`)+
        (f?`<path d="M38 130 L82 130 L88 166 L32 166 Z" fill="${dark}"/><rect x="47" y="166" width="7" height="32" fill="${skin}"/><rect x="66" y="166" width="7" height="32" fill="${skin}"/>`:`<rect x="41" y="130" width="17" height="68" fill="${dark}"/><rect x="62" y="130" width="17" height="68" fill="${dark}"/>`)+`<rect x="41" y="198" width="17" height="6" fill="#1a1716"/><rect x="62" y="198" width="17" height="6" fill="#1a1716"/>`; }
    else { s+=`<path d="M${60-sh} 70 L${60+sh} 70 L${60+sh-2} 132 L${60-sh+2} 132 Z" fill="${c}"/><rect x="41" y="130" width="17" height="68" fill="#3b4a66"/><rect x="62" y="130" width="17" height="68" fill="#3b4a66"/><rect x="40" y="198" width="19" height="7" rx="2" fill="#ece8e0" stroke="#bbb"/><rect x="61" y="198" width="19" height="7" rx="2" fill="#ece8e0" stroke="#bbb"/>`; }
    s+=`<rect x="${60-sh-9}" y="72" width="9" height="56" rx="4" fill="${c}"/><rect x="${60+sh}" y="72" width="9" height="56" rx="4" fill="${c}"/><circle cx="${60-sh-4.5}" cy="131" r="5" fill="${skin}"/><circle cx="${60+sh+4.5}" cy="131" r="5" fill="${skin}"/>`;
    s+=`<rect x="55" y="54" width="10" height="12" fill="${skin}"/>`+(f&&L.o!=='robe'?`<rect x="44" y="34" width="32" height="40" rx="6" fill="${hair}"/>`:'')+`<circle cx="60" cy="40" r="17" fill="${skin}"/><path d="M43 40 A17 17 0 0 1 77 40 L77 34 A17 15 0 0 0 43 34 Z" fill="${hair}"/><path d="M43 38 Q60 18 77 38 Q72 26 60 24 Q48 26 43 38 Z" fill="${hair}"/>`+(f&&L.o==='robe'?`<circle cx="60" cy="22" r="8" fill="${hair}"/>`:'');
    const A=L.a; if(A==='douli') s+=`<path d="M20 34 L60 10 L100 34 Z" fill="#c8a96a" stroke="#a88a4e"/>`;
    if(A==='straw') s+=`<ellipse cx="60" cy="27" rx="34" ry="5" fill="#c8a96a"/><rect x="44" y="13" width="32" height="15" rx="4" fill="#c8a96a"/><rect x="44" y="22" width="32" height="4" fill="#7a2a2a"/>`;
    if(A==='scarf') s+=`<rect x="46" y="62" width="28" height="9" rx="4" fill="${c==='#a8343a'?'#2f4f6f':'#a8343a'}"/><rect x="62" y="68" width="8" height="30" fill="${c==='#a8343a'?'#2f4f6f':'#a8343a'}"/>`;
    if(A==='glasses') s+=`<circle cx="53" cy="41" r="5" fill="none" stroke="#2a2622" stroke-width="1.6"/><circle cx="67" cy="41" r="5" fill="none" stroke="#2a2622" stroke-width="1.6"/><path d="M58 41 L62 41" stroke="#2a2622" stroke-width="1.6"/>`;
    if(A==='bag') s+=`<path d="M${60-sh} 70 L${60+sh+10} 118" stroke="#8a7a5c" stroke-width="4"/><rect x="${60+sh+2}" y="110" width="24" height="28" rx="2" fill="#8a7a5c"/>`;
    if(A==='fan') s+=`<path d="M${60+sh+5} 132 L${60+sh+30} 112 A28 28 0 0 1 ${60+sh+33} 140 Z" fill="#efe6d0" stroke="#b9a77d"/>`;
    $('#gprev').innerHTML=`<svg viewBox="0 0 120 210" width="150" height="262">${s}</svg>`; }
  function sync(){ document.querySelectorAll('.gopt').forEach(d=>d.querySelectorAll('button').forEach(b=>b.classList.toggle('on',G.look[d.dataset.k]===b.dataset.v)));
    sw.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===G.color)); svg(); }
  document.querySelectorAll('.gopt').forEach(d=>d.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; G.look[d.dataset.k]=b.dataset.v; sync(); });
  sw.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; G.color=b.dataset.c; sync(); };
  inp.oninput=()=>{ G.name=inp.value; };
  function go(){ G.name=inp.value.trim(); if(!G.name){ inp.focus(); inp.classList.add('need'); inp.placeholder='請先取個名字'; return; }
    if(window.__houseReady&&window.__enterHouse) window.__enterHouse(); else { window.__wantEnter=true; btn.textContent='宅院整理中…'; btn.disabled=true; window.__loadHouse?.(); } }
  btn.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } e.stopPropagation(); };
  window.__openGate=()=>{ const g=$('#gate'); inp.value=G.name; btn.textContent='換好了'; btn.disabled=false; g.classList.remove('hide','out'); sync(); };
  sync(); if(!G.name) setTimeout(()=>inp.focus(),50);
})();
</script>
